<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Links</title>
  
  <style>
    /* Підключення шрифту */
    @font-face {
      font-family: 'SN Pro';
      src: url('fonts/sn-pro.ttf') format('truetype');
      font-weight: 100 900;
      font-display: block;
    }

    :root {
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) {
        --bg: #141517;
        --text: #f0f1f4;
        --subtext: #8d929f;
        --shadow-light: rgba(255, 255, 255, 0.05);
        --shadow-dark: rgba(0, 0, 0, 0.85);
        --card-border: rgba(255, 255, 255, 0.04);
        --icon-bg: #1a1c1f;
        --icon-fill: #e6e8ee;
        --tag-bg: #141517;
        --tag-text: #a4a9b8;
        --sub-card-bg: #191b1e;
        --sub-card-hover: #22252a;
        --copied-bg: #1e6b3b;
        --copied-text: #ffffff;
        --copied-badge-bg: rgba(255, 255, 255, 0.2);
      }
    }

    [data-theme="dark"] {
      --bg: #141517;
      --text: #f0f1f4;
      --subtext: #8d929f;
      --shadow-light: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --card-border: rgba(255, 255, 255, 0.04);
      --icon-bg: #1a1c1f;
      --icon-fill: #e6e8ee;
      --tag-bg: #141517;
      --tag-text: #a4a9b8;
      --sub-card-bg: #191b1e;
      --sub-card-hover: #22252a;
      --copied-bg: #1e6b3b;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    /* Тема Aqua */
    [data-theme="aqua"] {
      --bg: transparent;
      --text: #ffffff;
      --subtext: rgba(255, 255, 255, 0.82);
      --shadow-light: rgba(255, 255, 255, 0.22);
      --shadow-dark: rgba(10, 32, 45, 0.55);
      --card-border: rgba(255, 255, 255, 0.35);
      --icon-bg: rgba(255, 255, 255, 0.16);
      --icon-fill: #ffffff;
      --tag-bg: rgba(255, 255, 255, 0.16);
      --tag-text: #ffffff;
      --sub-card-bg: rgba(255, 255, 255, 0.12);
      --sub-card-hover: rgba(255, 255, 255, 0.24);
      --copied-bg: #197278;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'SN Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 18px 60px;
      overflow-x: hidden;
      position: relative;
    }

    [data-theme="aqua"] body {
      background: linear-gradient(135deg, #16425b 0%, #216383 38%, #3f8f97 70%, #71bfbc 100%);
      background-size: 260% 260%;
      animation: aquaGradientFlow 14s ease infinite alternate;
    }

    [data-theme="aqua"] .link-card,
    [data-theme="aqua"] .theme-toggle {
      background-color: rgba(255, 255, 255, 0.12) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Прибираємо підкладку навколо логотипу в темі Aqua */
    [data-theme="aqua"] .avatar-wrapper {
      background: transparent !important;
      box-shadow: none !important;
      border-color: transparent !important;
    }

    [data-theme="aqua"] .avatar-inner {
      background: transparent !important;
    }

    @keyframes aquaGradientFlow {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 80%; }
      100% { background-position: 20% 100%; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, 
    .theme-toggle, 
    .avatar-wrapper, 
    .avatar-inner, 
    .profile-title, 
    .username-badge, 
    .profile-desc, 
    .link-card, 
    .link-icon-box, 
    .link-icon-masked,
    .link-title, 
    .link-subtitle, 
    .link-arrow, 
    .nested-btn,
    .nested-btn-badge,
    .nested-btn-right,
    .footer {
      transition: 
        color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        outline-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    @media (hover: hover) and (pointer: fine) {
      body, a, button, [role="button"], input {
        cursor: none !important;
      }
    }

    #rayCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 6px;
      z-index: 2;
    }

    /* Поява блоків */
    .theme-toggle,
    .avatar-wrapper,
    .profile-title,
    .username-badge,
    .profile-desc,
    .link-item-wrapper,
    .footer {
      opacity: 0;
    }

    .container.ready .theme-toggle {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.05s;
    }

    .container.ready .avatar-wrapper {
      animation: revealZoom 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    .container.ready .profile-title {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.28s;
    }

    .container.ready .username-badge:nth-child(1) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.34s; }
    .container.ready .username-badge:nth-child(2) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.40s; }
    .container.ready .username-badge:nth-child(3) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.46s; }

    .container.ready .profile-desc {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.52s;
    }

    .container.ready .link-item-wrapper:nth-child(1) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.58s; }
    .container.ready .link-item-wrapper:nth-child(2) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.65s; }
    .container.ready .link-item-wrapper:nth-child(3) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.72s; }
    .container.ready .link-item-wrapper:nth-child(4) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.79s; }
    .container.ready .link-item-wrapper:nth-child(5) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.86s; }
    .container.ready .link-item-wrapper:nth-child(6) { animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.93s; }

    .container.ready .footer {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.05s;
    }

    /* Кнопка зміни теми */
    .theme-toggle {
      position: absolute;
      top: 6px;
      right: 4px;
      z-index: 10;
      background: var(--bg);
      border: 1px solid var(--card-border);
      outline: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 
        5px 5px 12px var(--shadow-dark),
        -5px -5px 12px var(--shadow-light);
      transform: scale(1);
    }

    .theme-toggle:active {
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light) !important;
      transform: scale(0.96);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Аватар */
    .avatar-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: var(--bg);
      padding: 7px;
      box-shadow: 
        8px 8px 20px var(--shadow-dark),
        -8px -8px 20px var(--shadow-light);
      margin-top: 8px;
      margin-bottom: 18px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: none !important;
      will-change: opacity;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-light { opacity: 1; z-index: 2; }
    .avatar-dark { opacity: 0; z-index: 1; }
    .avatar-aqua { opacity: 0; z-index: 1; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-light { opacity: 0; z-index: 1; }
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-dark { opacity: 1; z-index: 2; }
    }

    [data-theme="dark"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="dark"] .avatar-dark { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="dark"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    [data-theme="aqua"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-aqua { opacity: 1 !important; z-index: 3 !important; }

    [data-theme="light"] .avatar-light { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="light"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="light"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    .avatar-placeholder-svg {
      width: 54px;
      height: 54px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 1.6;
    }

    /* Інфо профілю */
    .profile-info {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      padding: 0 10px;
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .usernames-group {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    .username-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tag-text);
      background: var(--tag-bg);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      box-shadow: 
        3px 3px 7px var(--shadow-dark),
        -3px -3px 7px var(--shadow-light);
    }

    .username-badge:active {
      transform: scale(0.96);
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light) !important;
    }

    .profile-desc {
      font-size: 0.94rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--subtext);
      max-width: 360px;
      margin: 0 auto;
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-item-wrapper {
      width: 100%;
    }

    /* ОСНОВНА КНОПКА */
    .link-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 18px;
      border-radius: 36px;
      background: var(--bg);
      text-decoration: none;
      color: inherit;
      position: relative;
      border: 1px solid var(--card-border);
      user-select: none;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);

      transition: 
        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, box-shadow;
    }

    .link-main-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      position: relative;
      overflow: hidden;
      transform: translate3d(0, 0, 0) scale(1);
      
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light);

      transition: 
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, box-shadow;
    }

    .link-icon-masked {
      width: 24px;
      height: 24px;
      background-color: var(--icon-fill);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      display: block;
    }

    .link-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .link-subtitle {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--subtext);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 20px;
      height: 20px;
      margin-left: 10px;
      color: var(--subtext);
      opacity: 0.7;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      flex-shrink: 0;
    }

    /* Випуклий стан при скролі */
    .link-card.is-elevated {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        9px 11px 24px var(--shadow-dark),
        -9px -11px 24px var(--shadow-light);
    }

    .link-card.is-elevated .link-icon-box {
      transform: scale(1.035);
      box-shadow: 
        3px 3px 8px var(--shadow-dark),
        -3px -3px 8px var(--shadow-light);
    }

    .link-card.is-elevated .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* Hover на ПК */
    @media (hover: hover) and (pointer: fine) {
      .link-card:not(.is-open):hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 
          8px 10px 22px var(--shadow-dark),
          -8px -10px 22px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-icon-box {
        transform: scale(1.035);
        box-shadow: 
          3px 3px 8px var(--shadow-dark),
          -3px -3px 8px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-arrow {
        opacity: 1;
        transform: translateX(3px);
      }
    }

    /* Стан розкритої кнопки */
    .link-card.is-open {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 
        7px 9px 20px var(--shadow-dark),
        -7px -9px 20px var(--shadow-light);
      transform: translateY(-1px);
    }

    .link-card.is-open .link-arrow {
      transform: rotate(180deg) !important;
      opacity: 1;
    }

    /* ВНУТРІШНІЙ БЛОК */
    .inner-tray {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      width: 100%;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: grid-template-rows;
    }

    .link-card.is-open .inner-tray {
      grid-template-rows: 1fr;
    }

    .inner-tray-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 10px;
      transition: padding-top 0.45s cubic-bezier(0.25, 1, 0.5, 1), padding-bottom 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .link-card.is-open .inner-tray-content {
      padding: 14px 10px 14px;
    }

    /* МЕНШІ КНОПКИ */
    .nested-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 20px;
      background-color: var(--sub-card-bg);
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transform: translate3d(0, -6px, 0);
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      box-shadow: 
        2px 2px 5px var(--shadow-dark),
        -2px -2px 5px var(--shadow-light);

      opacity: 0;
      transition: 
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.35s ease,
        background-color 0.3s ease,
        outline-color 0.3s ease,
        box-shadow 0.3s ease !important;
    }

    .link-card.is-open .nested-btn {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover {
        transform: translate3d(0, -1.5px, 0) !important;
        background-color: var(--sub-card-hover) !important;
        outline-color: rgba(255, 255, 255, 0.45);
        box-shadow: 
          3px 4px 10px var(--shadow-dark),
          -3px -4px 10px var(--shadow-light) !important;
      }
      .nested-btn:hover .nested-btn-right {
        color: var(--text);
      }
      .nested-btn:hover .nested-btn-badge {
        outline-color: rgba(255, 255, 255, 0.5);
      }
    }

    .nested-btn:active {
      transform: translate3d(0, 0, 0) scale(0.98) !important;
      outline-color: var(--card-border);
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light) !important;
      transition: all 0.15s ease !important;
    }

    .nested-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nested-btn-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
      background-color: var(--tag-bg);
      color: var(--subtext);
      font-weight: 500;
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      transition: outline-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }

    .nested-btn-right {
      font-size: 0.78rem;

        mouse.y = e.clientY;
        mouse.active = true;

        const target = e.target.closest('a, button, [role="button"], .username-badge, .nested-btn, .link-main-row, .insta-preview-card');
        mouse.hovering = !!target;
      });

      window.addEventListener('mousedown', () => { mouse.clicking = true; });
      window.addEventListener('mouseup', () => { mouse.clicking = false; });
      document.addEventListener('mouseleave', () => { mouse.active = false; });
      document.addEventListener('mouseenter', () => { mouse.active = true; });

      function renderFrame() {
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        if (mouse.active) {
          cursorDot.x += (mouse.x - cursorDot.x) * 0.8;
          cursorDot.y += (mouse.y - cursorDot.y) * 0.8;

          cursorRing.x += (mouse.x - cursorRing.x) * 0.28;
          cursorRing.y += (mouse.y - cursorRing.y) * 0.28;

          let targetSize = mouse.clicking ? 18 : (mouse.hovering ? 38 : 24);
          cursorRing.size += (targetSize - cursorRing.size) * 0.25;

          const currentTheme = htmlEl.getAttribute('data-theme') || getSystemTheme();

          let ringColor = 'rgba(35, 37, 42, 0.35)';
          let dotColor = '#23252a';

          if (currentTheme === 'dark') {
            ringColor = mouse.hovering ? 'rgba(255, 255, 255, 0.85)' : 'rgba(240, 241, 244, 0.38)';
            dotColor = '#ffffff';
          } else if (currentTheme === 'aqua') {
            ringColor = mouse.hovering ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
            dotColor = '#ffffff';
          } else {
            ringColor = mouse.hovering ? 'rgba(0, 0, 0, 0.75)' : 'rgba(35, 37, 42, 0.35)';
            dotColor = '#23252a';
          }

          ctx.beginPath();
          ctx.arc(cursorRing.x, cursorRing.y, cursorRing.size / 2, 0, Math.PI * 2);
          ctx.strokeStyle = ringColor;
          ctx.lineWidth = mouse.hovering ? 1.5 : 1.1;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cursorDot.x, cursorDot.y, mouse.hovering ? 3.5 : 3, 0, Math.PI * 2);
          ctx.fillStyle = dotColor;
          ctx.fill();
        }

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }
  </script>
</body>
</html>
