<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Артем Гай</title>
  <!-- Іконка на вкладці браузера (Favicon) -->
  <link rel="icon" type="image/png" href="img/logo-circle.png">

  <!-- Застосовуємо збережену тему ще до відмальовки, щоб не було "блимання" -->
  <script>
    (function () {
      try {
        var saved = sessionStorage.getItem('user_manual_theme');
        if (saved === 'light' || saved === 'dark' || saved === 'aqua') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Підключення шрифту */
    @font-face {
      font-family: 'SN Pro';
      src: url('fonts/sn-pro.ttf') format('truetype');
      font-weight: 100 900;
      font-display: block;
    }

    :root {
      /* Плавні криві для всіх анімацій */
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) {
        --bg: #141517;
        --text: #f0f1f4;
        --subtext: #8d929f;
        --shadow-light: rgba(255, 255, 255, 0.05);
        --shadow-dark: rgba(0, 0, 0, 0.85);
        --card-border: rgba(255, 255, 255, 0.04);
        --icon-bg: #1a1c1f;
        --icon-fill: #e6e8ee;
        --tag-bg: #141517;
        --tag-text: #a4a9b8;
        --sub-card-bg: #191b1e;
        --sub-card-hover: #22252a;
        --copied-bg: #1e6b3b;
        --copied-text: #ffffff;
        --copied-badge-bg: rgba(255, 255, 255, 0.2);
      }
    }

    [data-theme="dark"] {
      --bg: #141517;
      --text: #f0f1f4;
      --subtext: #8d929f;
      --shadow-light: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --card-border: rgba(255, 255, 255, 0.04);
      --icon-bg: #1a1c1f;
      --icon-fill: #e6e8ee;
      --tag-bg: #141517;
      --tag-text: #a4a9b8;
      --sub-card-bg: #191b1e;
      --sub-card-hover: #22252a;
      --copied-bg: #1e6b3b;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    /* Тема Aqua */
    [data-theme="aqua"] {
      --bg: transparent;
      --text: #ffffff;
      --subtext: rgba(255, 255, 255, 0.82);
      --shadow-light: rgba(255, 255, 255, 0.22);
      --shadow-dark: rgba(10, 32, 45, 0.55);
      --card-border: rgba(255, 255, 255, 0.35);
      --icon-bg: rgba(255, 255, 255, 0.16);
      --icon-fill: #ffffff;
      --tag-bg: rgba(255, 255, 255, 0.16);
      --tag-text: #ffffff;
      --sub-card-bg: rgba(255, 255, 255, 0.12);
      --sub-card-hover: rgba(255, 255, 255, 0.24);
      --copied-bg: #197278;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'SN Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 18px 60px;
      overflow-x: hidden;
      position: relative;
    }

    [data-theme="aqua"] body {
      background: linear-gradient(135deg, #16425b 0%, #216383 38%, #3f8f97 70%, #71bfbc 100%);
      background-size: 260% 260%;
      animation: aquaGradientFlow 14s ease infinite alternate;
    }

    [data-theme="aqua"] .link-card,
    [data-theme="aqua"] .theme-toggle {
      background-color: rgba(255, 255, 255, 0.12) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Прибираємо підкладку навколо логотипу в темі Aqua */
    [data-theme="aqua"] .avatar-wrapper {
      background: transparent !important;
      box-shadow: none !important;
      border-color: transparent !important;
    }

    [data-theme="aqua"] .avatar-inner {
      background: transparent !important;
    }

    @keyframes aquaGradientFlow {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 80%; }
      100% { background-position: 20% 100%; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, 
    .theme-toggle, 
    .avatar-wrapper, 
    .avatar-inner, 
    .profile-title, 
    .username-badge, 
    .profile-desc, 
    .link-card, 
    .link-icon-box, 
    .link-icon-masked,
    .link-title, 
    .link-subtitle, 
    .link-arrow, 
    .nested-btn,
    .nested-btn-badge,
    .nested-btn-right,
    .footer {
      transition: 
        color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        outline-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    @media (hover: hover) and (pointer: fine) {
      body, a, button, [role="button"], input {
        cursor: none !important;
      }
    }

    #rayCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 6px;
      z-index: 2;
    }

    /* Поява блоків */
    .theme-toggle,
    .avatar-wrapper,
    .profile-title,
    .username-badge,
    .profile-desc,
    .link-item-wrapper,
    .footer {
      opacity: 0;
    }

    .container.ready .theme-toggle {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.05s;
    }

    .container.ready .avatar-wrapper {
      animation: revealZoom 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    .container.ready .profile-title {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.28s;
    }

    .container.ready .username-badge {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.34s + var(--i, 0) * 0.06s);
    }

    .container.ready .profile-desc {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.52s;
    }

    .container.ready .link-item-wrapper {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.58s + var(--i, 0) * 0.07s);
    }

    .container.ready .footer {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.05s;
    }

    /* Після появи знімаємо анімацію, інакше вона "з'їдає" transform
       і ефект натискання (scale) на кнопках не працює */
    .container .is-revealed {
      opacity: 1 !important;
      animation: none !important;
    }

    /* Кнопка зміни теми */
    .theme-toggle {
      position: absolute;
      top: 6px;
      right: 4px;
      z-index: 10;
      background: var(--bg);
      border: 1px solid var(--card-border);
      outline: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 
        5px 5px 12px var(--shadow-dark),
        -5px -5px 12px var(--shadow-light);
      transform: scale(1);
    }

    .theme-toggle:active {
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light) !important;
      transform: scale(0.96);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Аватар */
    .avatar-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: var(--bg);
      padding: 7px;
      box-shadow: 
        8px 8px 20px var(--shadow-dark),
        -8px -8px 20px var(--shadow-light);
      margin-top: 8px;
      margin-bottom: 18px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: none !important;
      will-change: opacity;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-light { opacity: 1; z-index: 2; }
    .avatar-dark { opacity: 0; z-index: 1; }
    .avatar-aqua { opacity: 0; z-index: 1; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-light { opacity: 0; z-index: 1; }
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-dark { opacity: 1; z-index: 2; }
    }

    [data-theme="dark"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="dark"] .avatar-dark { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="dark"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    [data-theme="aqua"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-aqua { opacity: 1 !important; z-index: 3 !important; }

    [data-theme="light"] .avatar-light { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="light"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="light"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    .avatar-placeholder-svg {
      width: 54px;
      height: 54px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 1.6;
    }

    /* Інфо профілю */
    .profile-info {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      padding: 0 10px;
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .usernames-group {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    .username-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tag-text);
      background: var(--tag-bg);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      box-shadow: 
        3px 3px 7px var(--shadow-dark),
        -3px -3px 7px var(--shadow-light);
    }

    .username-badge,
    .theme-toggle {
      transition: 
        transform 0.6s var(--ease-spring),
        box-shadow 0.6s var(--ease-smooth),
        color 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        border-color 0.4s var(--ease-soft);
    }

    .theme-toggle svg {
      transition: transform 0.7s var(--ease-spring);
    }

    @media (hover: hover) and (pointer: fine) {
      .username-badge:hover {
        transform: translateY(-2px);
        box-shadow: 
          5px 6px 12px var(--shadow-dark),
          -4px -4px 10px var(--shadow-light);
      }
      .theme-toggle:hover {
        transform: translateY(-2px);
      }
      .theme-toggle:hover svg {
        transform: rotate(-18deg) scale(1.08);
      }
    }

    .username-badge:active {
      transform: scale(0.96);
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light) !important;
    }

    .profile-desc {
      font-size: 0.94rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--subtext);
      max-width: 360px;
      margin: 0 auto;
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-item-wrapper {
      width: 100%;
    }

    /* ОСНОВНА КНОПКА */
    .link-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 18px;
      border-radius: 36px;
      background: var(--bg);
      text-decoration: none;
      color: inherit;
      position: relative;
      border: 1px solid var(--card-border);
      user-select: none;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);

      transition: 
        transform 0.7s var(--ease-smooth),
        box-shadow 0.7s var(--ease-smooth),
        border-color 0.6s var(--ease-soft),
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    /* Натискання — м'яке "втискання" картки */
    .link-card:not(.is-open):active,
    .link-card.is-open .link-main-row:active .link-icon-box {
      transition-duration: 0.18s;
    }

    .link-card:not(.is-open):active {
      transform: translateY(0) scale(0.985) !important;
      box-shadow: 
        1px 1px 3px var(--shadow-dark),
        -1px -1px 3px var(--shadow-light) !important;
    }

    .link-main-row {
      width: 100%;
      display: flex;
      align-items: center;
      outline: none;
    }

    .link-card:focus-visible,
    .link-main-row:focus-visible,
    .nested-btn:focus-visible,
    .username-badge:focus-visible,
    .theme-toggle:focus-visible,
    .insta-preview-card:focus-visible {
      outline: 2px solid var(--subtext);
      outline-offset: 3px;
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      position: relative;
      overflow: hidden;
      transform: translate3d(0, 0, 0) scale(1);
      
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light);

      transition: 
        transform 0.75s var(--ease-spring),
        box-shadow 0.7s var(--ease-smooth),
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    .link-icon-masked {
      width: 24px;
      height: 24px;
      background-color: var(--icon-fill);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      display: block;
      transform: translate3d(0, 0, 0);
      transition: 
        transform 0.8s var(--ease-spring),
        background-color 0.6s var(--ease-soft);
    }

    .link-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .link-subtitle {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--subtext);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 20px;
      height: 20px;
      margin-left: 10px;
      color: var(--subtext);
      opacity: 0.7;
      transition: transform 0.7s var(--ease-spring), opacity 0.5s var(--ease-soft), color 0.6s var(--ease-soft);
      flex-shrink: 0;
    }

    /* Випуклий стан на телефоні під час гортання */
    .link-card.is-elevated {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        9px 11px 24px var(--shadow-dark),
        -9px -11px 24px var(--shadow-light);
    }

    .link-card.is-elevated .link-icon-masked {
      transform: scale(1.08) rotate(-6deg);
    }

    .link-card.is-elevated .link-icon-box {
      transform: scale(1.06);
      box-shadow: 
        3px 3px 8px var(--shadow-dark),
        -3px -3px 8px var(--shadow-light);
    }

    .link-card.is-elevated .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .link-card.is-elevated .link-subtitle {
      color: var(--text);
    }

    /* Hover на ПК */
    @media (hover: hover) and (pointer: fine) {
      .link-card:not(.is-open):hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 
          8px 10px 22px var(--shadow-dark),
          -8px -10px 22px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-icon-masked {
        transform: scale(1.1) rotate(-7deg);
      }
      .link-card:hover .link-subtitle {
        color: var(--text);
      }
      .link-card:not(.is-open):hover .link-icon-box {
        transform: scale(1.06);
        box-shadow: 
          3px 3px 8px var(--shadow-dark),
          -3px -3px 8px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-arrow {
        opacity: 1;
        transform: translateX(3px);
      }
    }

    /* Стан розкритої кнопки */
    .link-card.is-open {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 
        7px 9px 20px var(--shadow-dark),
        -7px -9px 20px var(--shadow-light);
      transform: translateY(-1px);
    }

    .link-card.is-open .link-icon-box {
      transform: scale(1.04);
    }

    .link-card.is-open .link-arrow {
      transform: rotate(180deg) !important;
      opacity: 1;
    }

    /* ВНУТРІШНІЙ БЛОК */
    .inner-tray {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.6s var(--ease-smooth);
      width: 100%;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: grid-template-rows;
    }

    .link-card.is-open .inner-tray {
      grid-template-rows: 1fr;
    }

    .inner-tray-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 10px;
      transition: padding-top 0.6s var(--ease-smooth), padding-bottom 0.6s var(--ease-smooth);
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .link-card.is-open .inner-tray-content {
      padding: 14px 10px 14px;
    }

    /* МЕНШІ КНОПКИ */
    .nested-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 20px;
      background-color: var(--sub-card-bg);
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transform: translate3d(0, -10px, 0) scale(0.98);
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      box-shadow: 
        2px 2px 5px var(--shadow-dark),
        -2px -2px 5px var(--shadow-light);

      opacity: 0;
      transition: 
        transform 0.55s var(--ease-smooth),
        opacity 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        outline-color 0.4s var(--ease-soft),
        box-shadow 0.5s var(--ease-smooth) !important;
    }

    .link-card.is-open .nested-btn {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      transition-delay: calc(0.06s + var(--n, 0) * 0.06s), calc(0.06s + var(--n, 0) * 0.06s), 0s, 0s, 0s !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover {
        transform: translate3d(0, -2px, 0) !important;
        transition-delay: 0s !important;
        background-color: var(--sub-card-hover) !important;
        outline-color: rgba(255, 255, 255, 0.45);
        box-shadow: 
          3px 4px 10px var(--shadow-dark),
          -3px -4px 10px var(--shadow-light) !important;
      }
      .nested-btn:hover .nested-btn-right {
        color: var(--text);
      }
      .nested-btn:hover .nested-btn-badge {
        outline-color: rgba(255, 255, 255, 0.5);
      }
    }

    .nested-btn:active {
      transform: translate3d(0, 0, 0) scale(0.98) !important;
      outline-color: var(--card-border);
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light) !important;
      transition: transform 0.15s var(--ease-soft), box-shadow 0.15s var(--ease-soft) !important;
    }

    .nested-action-icon {
      transition: transform 0.5s var(--ease-spring), stroke 0.3s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover .nested-action-icon {
        transform: translate(2px, -2px);
      }
    }

    .nested-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nested-btn-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
      background-color: var(--tag-bg);
      color: var(--subtext);
      font-weight: 500;
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      transition: outline-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }

    /* Плашка "Нове відео" */
    .link-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .new-pill {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 10px;
      background-color: #e5322d;
      color: #ffffff;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35);
      transition: opacity 0.4s var(--ease-soft), transform 0.6s var(--ease-spring);
      animation: pillGlow 2.6s var(--ease-soft) infinite;
    }

    @keyframes pillGlow {
      0%, 100% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 0 rgba(229, 50, 45, 0.35); }
      50% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 5px rgba(229, 50, 45, 0); }
    }

    .link-card .nested-btn .new-pill {
      transform: scale(0.6);
      opacity: 0;
    }

    .link-card.is-open .nested-btn .new-pill {
      transform: scale(1);
      opacity: 1;
      transition-delay: 0.25s;
    }

    /* Всередині — стікер у куті кнопки, щоб не ламати рядок */
    .nested-btn {
      position: relative;
    }

    .nested-btn .new-pill {
      position: absolute;
      top: -7px;
      right: 14px;
      font-size: 0.64rem;
      padding: 3px 7px;
    }

    /* На закритій картці плашка видна, при відкритті переїжджає всередину */
    .link-card.is-open .link-main-row .new-pill {
      opacity: 0;
      transform: scale(0.85);
    }

    .nested-btn-right {
      font-size: 0.78rem;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s ease;
    }

    .nested-action-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* Стан скопійовано */
    .nested-btn.copied {
      background-color: var(--copied-bg) !important;
      color: var(--copied-text) !important;
      outline-color: transparent !important;
      box-shadow: 2px 2px 6px var(--shadow-dark) !important;
    }

    .nested-btn.copied .nested-btn-badge {
      background-color: var(--copied-badge-bg) !important;
      color: #ffffff !important;
      outline-color: rgba(255, 255, 255, 0.3) !important;
    }

    .nested-btn.copied .nested-btn-right {
      color: #ffffff !important;
    }

    .nested-btn.copied .nested-action-icon {
      stroke: #ffffff !important;
    }

    /* Галерея Instagram: без обрізання тіней та підйому */
    .insta-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      padding: 4px 6px 8px; /* Запас для вільного розсіювання тіней */
      box-sizing: border-box;
    }

    .insta-preview-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--sub-card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);
      display: block;
      text-decoration: none;
      transform: translate3d(0, -6px, 0);
      opacity: 0;
      transition: 
        transform 0.6s var(--ease-smooth),
        box-shadow 0.6s var(--ease-smooth),
        border-color 0.5s var(--ease-soft),
        opacity 0.45s var(--ease-soft);
    }

    .link-card.is-open .insta-preview-card {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .link-card.is-open .insta-preview-card:nth-child(1) { transition-delay: 0.06s; }
    .link-card.is-open .insta-preview-card:nth-child(2) { transition-delay: 0.12s; }
    .link-card.is-open .insta-preview-card:nth-child(3) { transition-delay: 0.18s; }
    .link-card.is-open .insta-preview-card:hover { transition-delay: 0s; }

    .insta-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s var(--ease-smooth);
      color-interpolation-filters: sRGB;
    }

    @media (hover: hover) and (pointer: fine) {
      .insta-preview-card:hover {
        transform: translate3d(0, -2px, 0) !important;
        border-color: rgba(255, 255, 255, 0.5) !important;
        box-shadow: 
          3px 5px 12px var(--shadow-dark),
          -3px -5px 12px var(--shadow-light) !important;
      }
      .insta-preview-card:hover .insta-preview-img {
        transform: scale(1.08);
      }
    }

    .insta-profile-btn {
      width: 100%;
      margin-top: 2px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--subtext);
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ПАСХАЛКА: потягни пальцем угору в самому низу сторінки */
    .easter-spacer {
      width: 100%;
      min-height: 45vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      user-select: none;
    }

    /* Ледь помітна стрілочка-підказка без тексту */
    .easter-chevron {
      width: 22px;
      height: 22px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.4;
      animation: chevronNudge 2.4s var(--ease-soft) infinite;
    }

    @keyframes chevronNudge {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Кільце прогресу — фіксоване, тож сторінка під ним не смикається */
    .pull-ring {
      position: fixed;
      left: 50%;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      width: 68px;
      height: 68px;
      margin-left: -34px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 
        5px 5px 14px var(--shadow-dark),
        -5px -5px 14px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform: translateY(30px) scale(0.6);
      transition: opacity 0.35s var(--ease-soft), transform 0.5s var(--ease-spring);
    }

    .pull-ring.is-dragging {
      transition: none;
    }

    .pull-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .pull-ring-track {
      fill: none;
      stroke: var(--subtext);
      stroke-width: 2.2;
      stroke-dasharray: 3 5;
      stroke-linecap: round;
      opacity: 0.55;
    }

    .pull-ring-fill {
      fill: none;
      stroke: var(--text);
      stroke-width: 3.2;
      stroke-linecap: round;
    }

    .pull-ring-arrow {
      width: 22px;
      height: 22px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
    }

    .pull-ring.is-done {
      animation: ringPop 0.45s var(--ease-spring) forwards;
    }

    @keyframes ringPop {
      0%   { opacity: 1; transform: scale(1); }
      40%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(0.4); }
    }

    /* Шар з картинкою поверх сторінки */
    .easter-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease-soft), visibility 0s linear 0.35s;
    }

    .easter-overlay.is-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s var(--ease-soft), visibility 0s;
    }

    .easter-overlay {
      flex-direction: column;
      gap: 22px;
    }

    /* Бульбашка з фразою з тг-каналу */
    .easter-quote {
      position: relative;
      max-width: min(420px, 100%);
      min-height: 1px;
      padding: 12px 18px;
      border-radius: 22px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
      border: 1px solid var(--card-border);
      box-shadow: 
        6px 8px 20px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      opacity: 0;
      transform: translateY(14px) scale(0.6);
      transform-origin: 50% 100%;
      transition: opacity 0.25s var(--ease-soft), transform 0.3s var(--ease-smooth);
      pointer-events: none;
      z-index: 3;
    }

    /* Хвостик бульбашки */
    .easter-quote::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      background: var(--bg);
      border-right: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      transform: rotate(45deg);
      border-bottom-right-radius: 4px;
    }

    .easter-quote.is-shown {
      opacity: 1;
      animation: quotePop 0.55s var(--ease-spring) both;
    }

    @keyframes quotePop {
      0%   { opacity: 0; transform: translateY(14px) scale(0.5, 0.3); }
      45%  { opacity: 1; transform: translateY(-4px) scale(1.12, 0.9); }
      70%  { transform: translateY(0) scale(0.95, 1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 3D-РЕЖИМ ПАСХАЛКИ ===== */
    /* 3D-режим (WebGL): полотно на весь екран під фразою та кнопкою */
    .egg3d-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      touch-action: none;
      transition: opacity 0.3s var(--ease-soft), visibility 0s linear 0.3s;
    }

    .easter-overlay.is-3d .egg3d-canvas {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s var(--ease-soft), visibility 0s;
    }

    .easter-overlay.is-3d .easter-bounce {
      visibility: hidden;
    }

    .egg3d-toggle.is-loading svg {
      animation: eggSpin 0.8s linear infinite;
    }

    @keyframes eggSpin {
      to { transform: rotate(360deg); }
    }

    .egg3d-toggle {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 
        5px 5px 14px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      transition: transform 0.5s var(--ease-spring), box-shadow 0.4s var(--ease-smooth), background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
    }

    .egg3d-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.8s var(--ease-spring);
    }

    .egg3d-toggle[aria-pressed="true"] {
      background: var(--text);
      color: var(--bg);
    }

    .egg3d-toggle[aria-pressed="true"] svg {
      transform: rotate(180deg);
    }

    .egg3d-toggle:active {
      transform: scale(0.94);
    }

    .easter-bounce {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      opacity: 0;
      transform-origin: 50% 100%;
    }

    /* Смішна поява: вилітає, розплющується, витягується і трясеться як желе */
    .easter-overlay.is-open .easter-bounce {
      opacity: 1;
      animation: easterBoing 1.4s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    @keyframes easterBoing {
      0%   { opacity: 0; transform: translateY(120px) scale(0.3, 1.6); }
      22%  { opacity: 1; transform: translateY(-30px) scale(0.75, 1.35); }
      36%  { transform: translateY(0) scale(1.45, 0.55); }
      50%  { transform: translateY(-12px) scale(0.8, 1.25); }
      63%  { transform: translateY(0) scale(1.18, 0.86); }
      75%  { transform: scale(0.93, 1.08) rotate(-2deg); }
      86%  { transform: scale(1.04, 0.97) rotate(1.5deg); }
      100% { opacity: 1; transform: scale(1, 1) rotate(0); }
    }

    .easter-img {
      touch-action: none;
      cursor: grab;
      will-change: transform;
      -webkit-user-drag: none;
      user-select: none;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 
        8px 10px 22px var(--shadow-dark),
        -8px -10px 22px var(--shadow-light);
    }

    /* ===== РОЗВАГИ ПАСХАЛКИ ===== */
    .easter-puff,
    .easter-fly {
      transform-origin: 50% 50%;
    }

    .easter-fly {
      will-change: transform;
    }

    /* Під час польоту картка над кнопками і фразою */
    .easter-overlay.is-throwing .easter-bounce {
      z-index: 4;
    }

    /* Надування: дрижить сильніше з кожним рівнем */
    .easter-puff.is-inflating {
      animation: puffTremble 0.12s linear infinite;
      transition: scale 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), filter 0.25s ease;
    }

    .easter-puff {
      transition: scale 0.5s var(--ease-spring), filter 0.5s ease;
    }

    @keyframes puffTremble {
      0%   { translate: 0 0; }
      25%  { translate: var(--amp, 0px) calc(var(--amp, 0px) * -0.6); }
      50%  { translate: calc(var(--amp, 0px) * -1) calc(var(--amp, 0px) * 0.8); }
      75%  { translate: calc(var(--amp, 0px) * 0.7) var(--amp, 0px); }
      100% { translate: 0 0; }
    }

    .easter-puff.is-popping {
      animation: puffPop 0.32s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    @keyframes puffPop {
      0%   { scale: var(--s, 1.8); opacity: 1; }
      35%  { scale: calc(var(--s, 1.8) * 1.22); opacity: 1; }
      100% { scale: 0.05; opacity: 0; }
    }

    .easter-puff.is-reforming {
      animation: puffReform 0.9s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    @keyframes puffReform {
      0%   { scale: 0.1; opacity: 0; }
      35%  { scale: 1.25 0.75; opacity: 1; }
      55%  { scale: 0.85 1.18; }
      75%  { scale: 1.07 0.94; }
      100% { scale: 1; opacity: 1; }
    }

    /* Спалах вибуху */
    .egg-flash {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 245, 200, 0.95), rgba(255, 150, 40, 0.55) 35%, rgba(255, 60, 0, 0) 70%);
    }

    .egg-flash.is-boom {
      animation: eggFlash 0.7s ease-out forwards;
    }

    @keyframes eggFlash {
      0% { opacity: 0; scale: 0.4; }
      12% { opacity: 1; scale: 1.1; }
      100% { opacity: 0; scale: 1.6; }
    }

    /* Струс екрана від вибуху */
    .easter-overlay.is-boom {
      animation: eggBoomShake 0.55s linear;
    }

    @keyframes eggBoomShake {
      0%, 100% { translate: 0 0; }
      10% { translate: -14px 8px; }
      20% { translate: 12px -10px; }
      30% { translate: -10px -6px; }
      40% { translate: 9px 9px; }
      55% { translate: -6px 4px; }
      70% { translate: 4px -3px; }
      85% { translate: -2px 2px; }
    }

    /* Кнопка "Політ" вимкнена в 3D */
    .easter-overlay.is-3d .egg-launch {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Секрет: глітч-режим */
    body.is-glitch .container {
      animation: glitchJitter 0.12s steps(2) infinite;
    }

    body.is-glitch .profile-title,
    body.is-glitch .link-title {
      text-shadow: 2px 0 #ff2d6f, -2px 0 #22e1ff;
    }

    body.is-glitch {
      animation: glitchHue 0.6s steps(3) infinite;
    }

    @keyframes glitchJitter {
      0% { translate: 0 0; }
      50% { translate: -3px 1px; }
      100% { translate: 2px -1px; }
    }

    @keyframes glitchHue {
      0% { filter: none; }
      33% { filter: hue-rotate(90deg) saturate(1.6); }
      66% { filter: invert(0.08) hue-rotate(-60deg); }
      100% { filter: none; }
    }

    /* Секрет: дискотека */
    body.is-disco .link-card {
      animation: discoCard 0.5s ease-in-out infinite alternate;
    }

    body.is-disco .link-item-wrapper:nth-child(odd) .link-card {
      animation-delay: 0.25s;
    }

    body.is-disco {
      animation: discoBg 1.2s linear infinite;
    }

    @keyframes discoCard {
      from { translate: 0 0; rotate: -1.5deg; box-shadow: 0 0 22px #ff3bd4; }
      to { translate: 0 -6px; rotate: 1.5deg; box-shadow: 0 0 22px #3bf0ff; }
    }

    @keyframes discoBg {
      from { filter: hue-rotate(0deg) saturate(1.4); }
      to { filter: hue-rotate(360deg) saturate(1.4); }
    }

    /* Кнопки під картинкою */
    .egg-actions {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .egg-trophy-btn.is-bump {
      animation: trophyBump 0.6s var(--ease-spring);
    }

    @keyframes trophyBump {
      0% { scale: 1; }
      30% { scale: 1.3; rotate: -8deg; }
      60% { scale: 0.95; rotate: 4deg; }
      100% { scale: 1; rotate: 0deg; }
    }

    /* Лічильник для всіх відвідувачів */
    .egg-counter {
      position: relative;
      z-index: 3;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      margin-top: -8px;
    }

    .egg-counter b {
      display: inline-block;
      color: #ffe14d;
      font-variant-numeric: tabular-nums;
    }

    .egg-counter b.is-bump {
      animation: trophyBump 0.45s var(--ease-spring);
    }

    /* Список досягнень */
    .egg-trophies {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: rgba(0, 0, 0, 0.35);
    }

    .egg-trophies[hidden] {
      display: none;
    }

    .egg-trophies-card {
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: quotePop 0.5s var(--ease-spring) both;
    }

    .egg-trophies-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 10px;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .egg-trophies-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--sub-card-bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .egg-trophies-list {
      overflow-y: auto;
      padding: 4px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .egg-trophy {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--sub-card-bg);
      border: 1px solid var(--card-border);
    }

    .egg-trophy-emoji {
      font-size: 1.6rem;
      width: 2rem;
      text-align: center;
      flex-shrink: 0;
    }

    .egg-trophy-title {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .egg-trophy-desc {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-top: 2px;
    }

    .egg-trophy.is-locked {
      opacity: 0.55;
    }

    .egg-trophy.is-locked .egg-trophy-emoji {
      filter: grayscale(1);
    }

    /* Сповіщення про досягнення */
    .egg-toasts {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 50%;
      z-index: 9600;
      width: min(380px, calc(100vw - 32px));
      translate: -50% 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .egg-toast {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      animation: toastIn 0.6s var(--ease-spring) both;
    }

    .egg-toast.is-leaving {
      animation: toastOut 0.35s var(--ease-soft) forwards;
    }

    @keyframes toastIn {
      0% { opacity: 0; translate: 0 -40px; scale: 0.8; }
      100% { opacity: 1; translate: 0 0; scale: 1; }
    }

    @keyframes toastOut {
      to { opacity: 0; translate: 0 -30px; scale: 0.9; }
    }

    .egg-toast-emoji {
      font-size: 1.8rem;
      flex-shrink: 0;
      animation: trophyBump 0.8s var(--ease-spring) 0.2s;
    }

    .egg-toast-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e0a400;
    }

    .egg-toast-title {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Струсили телефон — плашки на головній підстрибують */
    body.is-shaken .link-card {
      animation: shakeHop 0.7s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    body.is-shaken .link-item-wrapper:nth-child(odd) .link-card {
      animation-name: shakeHopAlt;
    }

    @keyframes shakeHop {
      0%   { translate: 0 0; rotate: 0deg; }
      20%  { translate: -10px -14px; rotate: -3deg; }
      40%  { translate: 8px 4px; rotate: 2.5deg; }
      60%  { translate: -5px -4px; rotate: -1.5deg; }
      80%  { translate: 2px 1px; rotate: 0.6deg; }
      100% { translate: 0 0; rotate: 0deg; }
    }

    @keyframes shakeHopAlt {
      0%   { translate: 0 0; rotate: 0deg; }
      20%  { translate: 10px -10px; rotate: 3deg; }
      40%  { translate: -8px 5px; rotate: -2.5deg; }
      60%  { translate: 5px -3px; rotate: 1.5deg; }
      80%  { translate: -2px 1px; rotate: -0.6deg; }
      100% { translate: 0 0; rotate: 0deg; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }
    }

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes revealZoom {
      from {
        opacity: 0;
        transform: scale(0.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

    // Копіювання картки
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      return legacyCopy(text);
    }

    function legacyCopy(text) {
      return new Promise((resolve, reject) => {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.top = '-1000px';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        document.body.removeChild(area);
        ok ? resolve() : reject(new Error('copy failed'));
      });
    }

    document.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('.copy-card-btn');
      if (!copyBtn) return;
      e.stopPropagation();

      const text = copyBtn.getAttribute('data-copy');
      const textSpan = copyBtn.querySelector('.nested-btn-text');
      const iconBox = copyBtn.querySelector('.nested-btn-icon-box');

      // Запам'ятовуємо оригінальний текст лише один раз,
      // щоб повторний клік не "заморожував" напис «Скопійовано!»
      if (!copyBtn.dataset.originalText) {
        copyBtn.dataset.originalText = textSpan.textContent;
      }

      copyText(text).then(() => {
        clearTimeout(copyBtn._resetTimer);
        copyBtn.classList.add('copied');
        textSpan.textContent = 'Скопійовано!';
        if (iconBox) iconBox.innerHTML = checkSVG;

        copyBtn._resetTimer = setTimeout(() => {
          copyBtn.classList.remove('copied');
          textSpan.textContent = copyBtn.dataset.originalText;
          if (iconBox) iconBox.innerHTML = copySVG;
        }, 2000);
      }).catch(() => {
        clearTimeout(copyBtn._resetTimer);
        textSpan.textContent = text;
        copyBtn._resetTimer = setTimeout(() => {
          textSpan.textContent = copyBtn.dataset.originalText;
        }, 4000);

    // 2. Старт анімацій після завантаження шрифту

    setTimeout(startAnimations, 3000);

    // 3. Тема: 3 режими
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const htmlEl = document.documentElement;
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

    const sunIconSVG = `
      <circle cx="12" cy="12" r="4.2"></circle>
      <line x1="12" y1="2" x2="12" y2="4.5"></line>
      <line x1="12" y1="19.5" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="6.7" y2="6.7"></line>
      <line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="4.5" y2="12"></line>
      <line x1="19.5" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="6.7" y2="17.3"></line>
      <line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line>
    `;

    const moonIconSVG = `
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    `;

    const aquaIconSVG = `
      <path d="M12 2l2.4 5.2L20 8.5l-4 3.9.9 5.6-4.9-2.6-4.9 2.6.9-5.6-4-3.9 5.6-1.3L12 2z"></path>
    `;

    const THEME_KEY = 'user_manual_theme';
    const VALID_THEMES = ['light', 'dark', 'aqua'];

    function readManualTheme() {
      try {
        const value = sessionStorage.getItem(THEME_KEY);
        return VALID_THEMES.includes(value) ? value : null;
      } catch (e) {
        return null;
      }
    }

    function writeManualTheme(value) {
      try {
        if (value) sessionStorage.setItem(THEME_KEY, value);
        else sessionStorage.removeItem(THEME_KEY);
      } catch (e) {}
    }

    try { localStorage.removeItem('theme'); } catch (e) {}

    function getSystemTheme() {
      return mediaQuery.matches ? 'dark' : 'light';
    }

    function syncTheme() {
      const manual = readManualTheme();
      const activeTheme = manual || getSystemTheme();

      htmlEl.setAttribute('data-theme', activeTheme);
      
      if (themeIcon) {
        if (activeTheme === 'dark') {
          themeIcon.innerHTML = aquaIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути тему Aqua');
        } else if (activeTheme === 'aqua') {
          themeIcon.innerHTML = sunIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути світлу тему');
        } else {
          themeIcon.innerHTML = moonIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути темну тему');
        }
      }
    }

    const onSystemThemeChange = () => {
      writeManualTheme(null);
      syncTheme();

    if (typeof mediaQuery.addEventListener === 'function') {

      mediaQuery.addListener(onSystemThemeChange); // старий Safari

      themeBtn.addEventListener('click', () => {

        let next = 'light';
        
        if (current === 'light') next = 'dark';
        else if (current === 'dark') next = 'aqua';
        else next = 'light';

        writeManualTheme(next);
        syncTheme();
      });
