      // ---------- Лічильник для всіх відвідувачів (Supabase) ----------
      // Налаштування — в SUPABASE_CONFIG на початку скрипта. Таблиця й функція — supabase/counter.sql
      const SB = (typeof SUPABASE_CONFIG !== 'undefined' && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey) ? SUPABASE_CONFIG : null;
      const KEY = 'stretches';
      const counterEl = document.getElementById('eggCounter');
      let globalCount = null;
      let pending = 0, sentThisSession = 0, flushing = false, flushTimer = null;
      const SESSION_CAP = 300;   // не більше стільки розтягувань за одне відвідування

      // Нові ключі (sb_publishable_...) передаються лише в apikey; старий anon (JWT) — ще й як Bearer
      const sbHeaders = () => {
        const h = { apikey: SB.anonKey, 'Content-Type': 'application/json' };
        if (!SB.anonKey.startsWith('sb_')) h.Authorization = `Bearer ${SB.anonKey}`;
        return h;
      };

      function renderCounter(bump) {
        if (!counterEl || globalCount === null) return;
        counterEl.hidden = false;
        counterEl.innerHTML = 'Цю пику розтягнули вже <b></b> разів 🫠';
        const b = counterEl.querySelector('b');
        b.textContent = (globalCount + pending).toLocaleString('uk-UA');
        if (bump) b.classList.add('is-bump');
      }

      async function loadCounter() {
        if (!SB) { if (counterEl) counterEl.hidden = true; return; }
        try {
          const r = await fetch(`${SB.url}/rest/v1/counters?key=eq.${KEY}&select=value`, { headers: sbHeaders(), cache: 'no-store' });
          if (!r.ok) throw new Error('bad');
          const rows = await r.json();
          globalCount = rows.length ? Number(rows[0].value) || 0 : 0;
          renderCounter();
        } catch (e) {
          if (counterEl) counterEl.hidden = true;
        }
      }

      // Збираємо розтягування пачками і відправляємо раз на 2 секунди
      async function flush() {
        flushTimer = null;
        if (!SB || flushing || pending <= 0) return;
        flushing = true;
        const amount = Math.min(pending, 20);
        try {
          const r = await fetch(`${SB.url}/rest/v1/rpc/increment_counter`, {
            method: 'POST',
            headers: sbHeaders(),
            body: JSON.stringify({ counter_key: KEY, amount })
          });
          if (!r.ok) throw new Error('bad');
          const value = Number(await r.json());
          pending = Math.max(0, pending - amount);
          if (Number.isFinite(value)) globalCount = value;
          renderCounter();
        } catch (e) {
          // не вдалося — спробуємо з наступною пачкою
        }
        flushing = false;
        if (pending > 0) flushTimer = setTimeout(flush, 2000);
      }

      function counterHit() {
        if (globalCount === null || sentThisSession >= SESSION_CAP) return;
        sentThisSession++;
        pending++;
        renderCounter(true);
        if (!flushTimer) flushTimer = setTimeout(flush, 2000);
      }

      // Не губимо останню пачку при закритті сторінки
      window.addEventListener('pagehide', () => {
        if (!SB || pending <= 0) return;
        try {
          fetch(`${SB.url}/rest/v1/rpc/increment_counter`, {
            method: 'POST', headers: sbHeaders(), keepalive: true,
            body: JSON.stringify({ counter_key: KEY, amount: Math.min(pending, 20) })
          });
        } catch (e) {}
      });

      // ---------- Режим "Кидання": картка — тверде тіло, що літає по екрану ----------
      // Без цього режиму картку можна лише розтягувати.
      // Фізика: прямокутник з масою і моментом інерції; кути б'ються об краї екрана,
      // удари дають імпульс з пружністю і тертям, тож картка обертається від ударів,
      // котиться, перевертається і лягає. Схоплену картку несе за точку, де її взяли.
      const launchBtn = document.getElementById('eggLaunchBtn');
      const launchLabel = document.getElementById('eggLaunchLabel');
      let free = false;          // режим увімкнено
      let carrying = false;      // тримаємо пальцем
      let returning = false;
      let physRaf = null;
      // x,y — зсув центру від місця спокою (px); rot — кут (град); vrot — кутова швидкість (град/с)
      const T = { x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, sx: 1, sy: 1, vsx: 0, vsy: 0, last: 0, w: 0, h: 0, cx: 0, cy: 0, base: 1 };
      // У польоті картка трохи менша — вміщується під будь-яким кутом і має де стрибати
      const FLY_SCALE = 0.72;
      const RESTITUTION = 0.5;   // пружність удару
      const FRICTION = 0.45;     // тертя об край
      let grav = { x: 0, y: 2600 };        // гравітація (від нахилу телефона)
      let lastWallHit = { side: null, t: -1e9, speed: 0 };
      let carry = null;
      const carryTracker = makeVelTracker();
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const DEG = Math.PI / 180;
      const flyImg = fly.querySelector('.easter-img');
      // Желейне розтягування картки: len — наскільки витягнута (px), ang — напрямок у координатах картки
      // Розтяг як вектор у координатах картки — напрям змінюється плавно, без стрибків
      const J = { x: 0, y: 0, vx: 0, vy: 0, ox: 50, oy: 50 };

      function updateJelly(dt) {
        let tx = 0, ty = 0, k = 320, c = 11;
        if (carrying && carry) {
          const co = Math.cos(T.rot * DEG), sn = Math.sin(T.rot * DEG);
          const rx = carry.ax * co - carry.ay * sn, ry = carry.ax * sn + carry.ay * co;
          const ex = carry.fx - (T.cx + T.x + rx), ey = carry.fy - (T.cy + T.y + ry);
          const L = Math.hypot(ex, ey);
          if (L > 0.5) {
            // Еластичний упор і переведення у координати картки
            const mag = 110 * (1 - Math.exp(-L / 160));
            const lx = (ex * co + ey * sn) / L, ly = (-ex * sn + ey * co) / L;
            tx = lx * mag; ty = ly * mag;
          }
          const hw = (T.w / 2) * T.base || 1, hh = (T.h / 2) * T.base || 1;
          J.ox = 50 - (carry.ax / hw) * 50;
          J.oy = 50 - (carry.ay / hh) * 50;
          k = 260; c = 34;   // у руці — без коливань
        }
        J.vx += ((tx - J.x) * k - J.vx * c) * dt;
        J.vy += ((ty - J.y) * k - J.vy * c) * dt;
        J.x += J.vx * dt;
        J.y += J.vy * dt;
        if (!flyImg) return;
        const len = Math.hypot(J.x, J.y);
        if (len < 0.3 && Math.hypot(J.vx, J.vy) < 2 && !carrying) { flyImg.style.transform = ''; return; }
        const st = 1 + len / 260;
        const sq = 1 / Math.sqrt(Math.max(0.4, st));
        const a = Math.atan2(J.y, J.x) / DEG;
        flyImg.style.transformOrigin = `${J.ox}% ${J.oy}%`;
        flyImg.style.transform = `rotate(${a.toFixed(1)}deg) scale(${st.toFixed(3)}, ${sq.toFixed(3)}) rotate(${(-a).toFixed(1)}deg)`;
      }

      function render() {
        fly.style.transform = `translate(${T.x.toFixed(1)}px, ${T.y.toFixed(1)}px) rotate(${T.rot.toFixed(2)}deg) scale(${(T.sx * T.base).toFixed(3)}, ${(T.sy * T.base).toFixed(3)})`;
      }

      // Кути картки у координатах екрана
      function corners() {
        const hw = (T.w / 2) * T.base, hh = (T.h / 2) * T.base;
        const c = Math.cos(T.rot * DEG), s = Math.sin(T.rot * DEG);
        const cx = T.cx + T.x, cy = T.cy + T.y;
        return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([lx, ly]) => ({
          rx: lx * c - ly * s, ry: lx * s + ly * c, px: cx + lx * c - ly * s, py: cy + lx * s + ly * c
        }));
      }

      const inertia = () => {
        const w = T.w * T.base, h = T.h * T.base;
        return (w * w + h * h) / 12;   // маса = 1
      };

      // Імпульс у точці r (відносно центру) по нормалі n
      function applyImpulse(rx, ry, jx, jy) {
        T.vx += jx;
        T.vy += jy;
        T.vrot += ((rx * jy - ry * jx) / inertia()) / DEG;
      }

      function onWallHit(side, speed) {
        if (speed < 160) return;
        const k = Math.min(speed / 2200, 1);
        stat('bounces');
        sound('thud', k);
        Haptics.tick(Math.round(8 + k * 30));
        if (side === 'left' || side === 'right') { T.sx = 1 - 0.34 * k; T.sy = 1 + 0.24 * k; }
        else { T.sy = 1 - 0.34 * k; T.sx = 1 + 0.24 * k; }
        // і желейне тремтіння після удару
        if (side === 'left' || side === 'right') J.vx += (side === 'left' ? 1 : -1) * 700 * k;
        else J.vy += (side === 'top' ? 1 : -1) * 700 * k;
        // Секрет "DVD": дві різні перпендикулярні стінки майже одночасно і на швидкості
        const now = performance.now();
        const perp = lastWallHit.side && ((/left|right/.test(side)) !== (/left|right/.test(lastWallHit.side)));
        if (perp && now - lastWallHit.t < 60 && speed > 700 && lastWallHit.speed > 700) secret('dvd');
        lastWallHit = { side, t: now, speed };
      }

      function collide() {
        const W = window.innerWidth, pad = 6;
        // "Підлога" — над кнопками внизу, щоб картка їх не закривала
        const actions = document.querySelector('.egg-actions');
        const H = actions ? Math.min(window.innerHeight, actions.getBoundingClientRect().top - 4) : window.innerHeight;
        const walls = [
          { side: 'left', nx: 1, ny: 0, d: pad },
          { side: 'right', nx: -1, ny: 0, d: -(W - pad) },
          { side: 'top', nx: 0, ny: 1, d: pad },
          { side: 'bottom', nx: 0, ny: -1, d: -(H - pad) }
        ];
        let touching = false;
        for (const wall of walls) {
          // Найглибше занурений кут у цю стінку
          let worst = null, depth = 0;
          for (const p of corners()) {
            const pen = wall.d - (p.px * wall.nx + p.py * wall.ny);
            if (pen > depth) { depth = pen; worst = p; }
          }
          if (!worst) continue;
          touching = true;
          // Виштовхуємо з стінки
          T.x += wall.nx * depth;
          T.y += wall.ny * depth;
          if (carrying) continue;
          // Швидкість точки удару: v + ω × r
          const w = T.vrot * DEG;
          const vpx = T.vx - w * worst.ry, vpy = T.vy + w * worst.rx;
          const vn = vpx * wall.nx + vpy * wall.ny;
          if (vn >= 0) continue;
          const I = inertia();
          const rn = worst.rx * wall.ny - worst.ry * wall.nx;
          const e = -vn < 120 ? 0 : RESTITUTION;     // повільні дотики не підстрибують — картка лягає
          const j = (-(1 + e) * vn) / (1 + (rn * rn) / I);
          applyImpulse(worst.rx, worst.ry, j * wall.nx, j * wall.ny);
          // Тертя вздовж стінки
          const tx = -wall.ny, ty = wall.nx;
          const w2 = T.vrot * DEG;
          const vt = (T.vx - w2 * worst.ry) * tx + (T.vy + w2 * worst.rx) * ty;
          const rt = worst.rx * ty - worst.ry * tx;
          let jt = -vt / (1 + (rt * rt) / I);
          jt = Math.max(-FRICTION * j, Math.min(FRICTION * j, jt));
          applyImpulse(worst.rx, worst.ry, jt * tx, jt * ty);
          onWallHit(wall.side, -vn);
        }
        return touching;
      }

      function physStep(t) {
        const dt = Math.min((t - T.last) / 1000, 0.033);
        T.last = t;
        T.base += (FLY_SCALE - T.base) * Math.min(1, dt * 8);

        const STEPS = 4;
        const h = dt / STEPS;
        let touching = false;
        for (let s = 0; s < STEPS; s++) {
          if (carrying && carry) {
            // Пружина між точкою, за яку тримаємо, і пальцем: картка висить і розгойдується
            const c = Math.cos(T.rot * DEG), sn = Math.sin(T.rot * DEG);
            const rx = carry.ax * c - carry.ay * sn, ry = carry.ax * sn + carry.ay * c;
            const px = T.cx + T.x + rx, py = T.cy + T.y + ry;
            const w = T.vrot * DEG;
            const vpx = T.vx - w * ry, vpy = T.vy + w * rx;
            // Критичне гасіння (c ≈ 2√k): картка плавно доїжджає до пальця без смикання
            const fx = (carry.fx - px) * 500 - vpx * 46;
            const fy = (carry.fy - py) * 500 - vpy * 46;
            T.vx += (fx + grav.x * 0.35) * h;
            T.vy += (fy + grav.y * 0.35) * h;
            T.vrot += (((rx * fy - ry * fx) / inertia()) * h) / DEG;
            T.vrot *= Math.pow(0.004, h);   // у руці не розгойдується маятником
          } else {
            T.vx += grav.x * h;
            T.vy += grav.y * h;
            // Опір повітря
            T.vx *= Math.pow(0.88, h);
            T.vy *= Math.pow(0.88, h);
            T.vrot *= Math.pow(0.55, h);
          }
          T.x += T.vx * h;
          T.y += T.vy * h;
          T.rot += T.vrot * h;
          touching = collide() || touching;
        }

        // Спокій: дуже повільна картка на краю завмирає (без дрижання)
        // Лише коли лежить рівно на боці — інакше має докотитися і впасти
        const tilt = ((T.rot % 90) + 90) % 90;
        const flat = tilt < 2 || tilt > 88;
        if (touching && !carrying && flat && Math.hypot(T.vx, T.vy) < 12 && Math.abs(T.vrot) < 8) {
          T.vx = 0; T.vy = 0; T.vrot = 0;
        }

        // Пружне відновлення після сплющення (менше гасіння — довше желейно тремтить)
        T.vsx += (-(T.sx - 1) * 700 - T.vsx * 9) * dt;
        T.vsy += (-(T.sy - 1) * 700 - T.vsy * 9) * dt;
        T.sx += T.vsx * dt;
        T.sy += T.vsy * dt;
        updateJelly(dt);

        render();
        physRaf = free ? requestAnimationFrame(physStep) : null;
      }

      function startPhys() {
        if (!physRaf) { T.last = performance.now(); physRaf = requestAnimationFrame(physStep); }
      }

      function setFree(on, instant, v0) {
        if (on === free) return false;
        if (on) {
          if (overlay.classList.contains('is-3d') || popping || reduceMotion) return false;
          free = true;
          returning = false;
          const r = fly.getBoundingClientRect();
          Object.assign(T, {
            x: 0, y: 0,
            vx: v0 ? v0.x : rand(-250, 250), vy: v0 ? v0.y : -700,
            rot: 0, vrot: v0 ? v0.x / 4 : rand(-200, 200), sx: 1, sy: 1, vsx: 0, vsy: 0, base: 1,
            w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2
          });
          overlay.classList.add('is-throwing');
          fly.style.transition = '';
          if (launchBtn) launchBtn.setAttribute('aria-pressed', 'true');
          if (launchLabel) launchLabel.textContent = 'Стоп';
          sound('splash', 0.6);
          Haptics.pattern([25, 30, 15]);
          stat('throws');
          if (v0) counterHit();
          startPhys();
          return true;
        } else {
          free = false;
          carrying = false;
          J.x = 0; J.y = 0; J.vx = 0; J.vy = 0;
          if (flyImg) { flyImg.style.transform = ''; flyImg.style.transformOrigin = ''; }
          if (physRaf) cancelAnimationFrame(physRaf);
          physRaf = null;
          if (launchBtn) launchBtn.setAttribute('aria-pressed', 'false');
          if (launchLabel) launchLabel.textContent = 'Кидання';
          if (instant) {
            fly.style.transition = '';
            fly.style.transform = '';
            overlay.classList.remove('is-throwing');
            return;
          }
          // Картка повертається на місце з пружинкою
          returning = true;
          const turns = Math.round(T.rot / 360) * 360;
          fly.style.transform = `translate(${T.x}px, ${T.y}px) rotate(${T.rot - turns}deg) scale(${T.base})`;
          void fly.offsetWidth;
          fly.style.transition = 'transform 0.75s cubic-bezier(0.34, 1.45, 0.64, 1)';
          fly.style.transform = '';
          Haptics.pattern([8, 60, 8]);
          setTimeout(() => {
            if (free) return;
            fly.style.transition = '';
            overlay.classList.remove('is-throwing');
            returning = false;
          }, 760);
        }
      }

      // Запуск змахом: картка летить по інерції з тією ж швидкістю, що й палець
      function launchWith(vx, vy) {
        const cap = 4500;
        const k = Math.min(1, cap / Math.max(1, Math.hypot(vx, vy)));
        return setFree(true, false, { x: vx * k, y: vy * k });
      }

      if (launchBtn) {
        launchBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setFree(!free);
        });
      }

      // Хапаємо картку за конкретну точку — вона висить на пальці і розгойдується
      fly.addEventListener('pointerdown', (e) => {
        if (!free) return;
        e.preventDefault();
        e.stopPropagation();
        carrying = true;
        try { fly.setPointerCapture(e.pointerId); } catch (err) {}
        const c = Math.cos(-T.rot * DEG), s = Math.sin(-T.rot * DEG);
        const dx = e.clientX - (T.cx + T.x), dy = e.clientY - (T.cy + T.y);
        carry = { ax: dx * c - dy * s, ay: dx * s + dy * c, fx: e.clientX, fy: e.clientY };
        carryTracker.reset();
        carryTracker.push(e.clientX, e.clientY);
        if (window.easterQuote) window.easterQuote();
        Haptics.tick(10);
        sound('grab');
      });

      fly.addEventListener('pointermove', (e) => {
        if (!free || !carrying || !carry) return;
        carry.fx = e.clientX;
        carry.fy = e.clientY;
        carryTracker.push(e.clientX, e.clientY);
      });

      const dropCard = () => {
        if (!carrying) return;
        carrying = false;
        // Інерція: поєднуємо швидкість пальця і самої картки
        const v = carryTracker.get();
        T.vx = Math.max(-4500, Math.min(4500, v.x * 0.7 + T.vx * 0.3));
        T.vy = Math.max(-4500, Math.min(4500, v.y * 0.7 + T.vy * 0.3));
        const sp = Math.hypot(T.vx, T.vy);
        if (sp > 800) {
          stat('throws');
          counterHit();
          sound('splash', Math.min(sp / 3000, 1));
          Haptics.pattern([20, 30, 12]);
        }
        carry = null;
      };
      fly.addEventListener('pointerup', dropCard);
      fly.addEventListener('pointercancel', dropCard);
      fly.addEventListener('lostpointercapture', dropCard);

      // ---------- Надування до "ПУК" ----------
      let taps = [];
      let level = 0;
      let popping = false;
      let deflateTimer = null;
      const POP_LEVEL = 8;

      function applyPuff() {
        if (!puff) return;
        if (level <= 0) {
          puff.classList.remove('is-inflating');
          puff.style.scale = '';
          puff.style.filter = '';
          puff.style.removeProperty('--amp');
          return;
        }
        puff.classList.add('is-inflating');
        puff.style.scale = String(1 + level * 0.095);
        puff.style.setProperty('--amp', `${(level * 0.7).toFixed(1)}px`);
        puff.style.filter = `saturate(${1 + level * 0.18}) sepia(${level * 0.05}) hue-rotate(${-level * 5}deg) brightness(${1 + level * 0.015})`;
      }

      function scheduleDeflate() {
        clearTimeout(deflateTimer);
        deflateTimer = setTimeout(function deflate() {
          if (popping || level <= 0) return;
          level--;
          applyPuff();
          if (level > 0) deflateTimer = setTimeout(deflate, 450);
        }, 900);
      }

      // Повертає true, якщо дотик пішов на надування (і розтягувати не треба)
      function tap() {
        if (popping) return true;
        if (free) return false;
        const now = performance.now();
        taps = taps.filter((t) => now - t < 1300);
        taps.push(now);
        if (level === 0 && taps.length < 5) return false;
        level++;
        sound('inflate', level);
        Haptics.tick(6 + level * 3);
        applyPuff();
        if (level >= POP_LEVEL) { pop(); return true; }
        scheduleDeflate();
        return true;
      }

      // ---------- Руйнування сайту після вибуху ----------
      function crackSVG(w, h) {
        const ix = w * rand(0.2, 0.8), iy = h * rand(0.25, 0.75);
        let paths = '';
        const n = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < n; i++) {
          let a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3);
          let x = ix, y = iy, d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
          const len = Math.max(w, h) * rand(0.25, 0.7);
          const steps = 4 + Math.floor(Math.random() * 3);
          for (let k = 0; k < steps; k++) {
            a += rand(-0.5, 0.5);
            x += Math.cos(a) * len / steps; y += Math.sin(a) * len / steps;
            d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
            if (Math.random() < 0.3) {
              const b = a + rand(0.6, 1.1) * (Math.random() < 0.5 ? -1 : 1);
              paths += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(Math.cos(b) * len * 0.25).toFixed(1)} ${(Math.sin(b) * len * 0.25).toFixed(1)}"/>`;
            }
          }
          paths += `<path d="${d}"/>`;
        }
        // Кільце навколо точки удару
        let ring = '';
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2, r = Math.min(w, h) * rand(0.12, 0.2);
          ring += `${i ? 'L' : 'M'}${(ix + Math.cos(a) * r).toFixed(1)} ${(iy + Math.sin(a) * r).toFixed(1)} `;
        }
        paths += `<path d="${ring}Z"/>`;
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" stroke-linecap="round" stroke-linejoin="round">` +
          `<g stroke="rgba(0,0,0,0.55)" stroke-width="2.4">${paths}</g><g stroke="rgba(255,255,255,0.85)" stroke-width="1" transform="translate(-0.8 -0.8)">${paths}</g></svg>`;
      }

      // Фізичний рушій (matter.js) вантажиться лише коли відкрили пасхалку
      let matterPromise = null;
      function loadMatter() {
        if (window.Matter) return Promise.resolve(window.Matter);
        if (!matterPromise) {
          matterPromise = new Promise((res, rej) => {
            const sc = document.createElement('script');
            sc.src = 'js/vendor/matter.min.js';
            sc.onload = () => res(window.Matter);
            sc.onerror = rej;
            document.head.appendChild(sc);
          });
        }
        return matterPromise;
      }
      window.__loadMatter = loadMatter;

      function wreckSite() {
        if (window.__siteWrecked) return;
        window.__siteWrecked = true;
        const root = document.documentElement;
        root.classList.add('site-wrecked');
        const ringEl = document.getElementById('pullRing');
        if (ringEl) ringEl.style.display = 'none';

        // Спалах на весь екран
        const fl = document.createElement('div');
        fl.className = 'wreck-flash';
        document.body.appendChild(fl);
        setTimeout(() => fl.remove(), 700);

        // Клік після перетягування не повинен нічого відкривати; звичайний тап — працює як завжди
        let suppressClick = false;
        document.addEventListener('click', (e) => {
          if (!suppressClick) return;
          suppressClick = false;
          e.preventDefault();
          e.stopPropagation();
        }, true);

        const sel = ['.theme-toggle', '.avatar-wrapper', '.profile-title', '.username-badge', '.profile-desc', '.link-item-wrapper', '.footer'];
        const els = [];
        sel.forEach((q) => document.querySelectorAll('#mainContainer ' + q).forEach((el) => els.push(el)));
        let W = window.innerWidth, H = window.innerHeight;

        // Замірюємо все ДО будь-яких змін
        const items = els.map((el) => {
          const r = el.getBoundingClientRect();
          return { el, w: r.width, h: r.height, x0: r.left + r.width / 2, y0: r.top + r.height / 2 };
        }).filter((it) => it.w > 2 && it.h > 2);
        // Кожен блок виймаємо з потоку (position: fixed на тому ж місці),
        // щоб розкриття однієї картки не зсувало інші
        items.forEach((it) => {
          const el = it.el;
          el.style.animation = 'none';
          el.style.opacity = '1';
          el.style.transition = 'none';
          el.style.willChange = 'transform';
          el.style.transform = 'none';
          el.classList.add('wreck-body');
        });
        items.forEach((it) => {
          const el = it.el;
          el.style.position = 'fixed';
          el.style.margin = '0';
          el.style.width = it.w + 'px';
          el.style.left = (it.x0 - it.w / 2) + 'px';
          el.style.top = (it.y0 - it.h / 2) + 'px';
          el.style.right = 'auto';
          el.style.bottom = 'auto';
        });
        // Поправка, якщо якийсь предок зсуває fixed-систему координат
        items.forEach((it) => {
          const r = it.el.getBoundingClientRect();
          const dx = (it.x0 - it.w / 2) - r.left, dy = (it.y0 - it.h / 2) - r.top;
          if (Math.abs(dx) > 0.5) it.el.style.left = (parseFloat(it.el.style.left) + dx) + 'px';
          if (Math.abs(dy) > 0.5) it.el.style.top = (parseFloat(it.el.style.top) + dy) + 'px';
          it.top = it.y0 - it.h / 2;
        });

        // Частина блоків ламається: тріщини і відколотий кут
        items.forEach((it) => {
          if (!it.el.matches('.link-item-wrapper, .avatar-wrapper, .username-badge') || Math.random() > 0.55) return;
          const target = it.el.querySelector('.link-card') || it.el;
          if (getComputedStyle(target).position === 'static') target.style.position = 'relative';
          const crack = document.createElement('div');
          crack.className = 'wreck-crack';
          crack.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(crackSVG(Math.round(it.w), Math.round(it.h)))}")`;
          target.appendChild(crack);
          if (!it.el.matches('.avatar-wrapper') && Math.random() < 0.6) {
            const c = Math.floor(Math.random() * 4), k = rand(8, 16);
            const poly = [
              `${c === 0 ? k : 0}% 0%`, `${c === 1 ? 100 - k : 100}% 0%`,
              ...(c === 1 ? [`100% ${k * 2.2}%`] : []), `100% ${c === 2 ? 100 - k * 2.2 : 100}%`,
              ...(c === 2 ? [`${100 - k}% 100%`] : []), `${c === 3 ? k : 0}% 100%`,
              ...(c === 3 ? [`0% ${100 - k * 2.2}%`] : []), ...(c === 0 ? [`0% ${k * 2.2}%`] : [])
            ];
            target.style.clipPath = `polygon(${poly.join(',')})`;
          }
          target.classList.add('is-wrecked');
        });

        loadMatter().then((M) => startPhysics(M)).catch(() => {});

        function startPhysics(M) {
          const { Engine, Bodies, Body, Composite, Constraint, Events, Sleeping } = M;
          const engine = Engine.create({ enableSleeping: true });
          engine.gravity.y = 2.4;
          engine.positionIterations = 10;
          engine.velocityIterations = 8;

          const T = 200;
          const walls = [
            Bodies.rectangle(W / 2, H + T / 2, W * 3, T, { isStatic: true }),
            Bodies.rectangle(-T / 2, H / 2 - H, T, H * 4, { isStatic: true }),
            Bodies.rectangle(W + T / 2, H / 2 - H, T, H * 4, { isStatic: true }),
            Bodies.rectangle(W / 2, -H * 2 - T / 2, W * 3, T, { isStatic: true })
          ];
          Composite.add(engine.world, walls);
          window.addEventListener('resize', () => {
            W = window.innerWidth; H = window.innerHeight;
            Body.setPosition(walls[0], { x: W / 2, y: H + T / 2 });
            Body.setPosition(walls[2], { x: W + T / 2, y: H / 2 - H });
            Composite.allBodies(engine.world).forEach((b) => Sleeping.set(b, false));
          });

          function makeBody(it, x, y) {
            const round = it.el.matches('.avatar-wrapper');
            const opts = { friction: 0.5, frictionAir: 0.012, restitution: 0.25, slop: 0.02 };
            const radius = Math.min(it.h / 2 - 1, 30, it.w / 2 - 1);
            const b = round
              ? Bodies.circle(x, y, it.w / 2, opts)
              : Bodies.rectangle(x, y, it.w, it.h, { ...opts, chamfer: { radius: Math.max(0, radius) } });
            b.plugin = { it };
            return b;
          }

          const cx = W / 2, cy = H * 0.5;
          const bodies = items.map((it) => {
            let x = it.x0, y = it.y0;
            // Те, що далеко за екраном, падає згори
            if (y > H + it.h / 2 || y < -H * 0.8) { y = -it.h - rand(0, H * 0.6); x = rand(it.w / 2, Math.max(it.w / 2, W - it.w / 2)); }
            const b = makeBody(it, x, y);
            const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1;
            const big = it.w > W * 0.6;
            const sp = rand(9, 20) * (big ? 0.65 : 1);
            Body.setVelocity(b, { x: (dx / d) * sp + rand(-3, 3), y: (dy / d) * sp - rand(6, 13) });
            Body.setAngularVelocity(b, rand(-0.3, 0.3) * (big ? 0.3 : 1));
            it.body = b;
            return b;
          });
          Composite.add(engine.world, bodies);

          // Звук ударів
          let lastHit = 0;
          Events.on(engine, 'collisionStart', (ev) => {
            const now = performance.now();
            if (now - lastHit < 55) return;
            for (const pair of ev.pairs) {
              const a = pair.bodyA, c = pair.bodyB;
              const v = Math.hypot(a.velocity.x - c.velocity.x, a.velocity.y - c.velocity.y);
              if (v > 5) {
                lastHit = now;
                sound('clack', Math.min(v / 22, 1));
                Haptics.tick(Math.round(6 + Math.min(v, 22)));
                break;
              }
            }
          });

          // Картка розкрилась/закрилась — тіло міняє розмір, верхній край лишається на місці
          const ro = new ResizeObserver(() => {
            for (const it of items) {
              const nh = it.el.offsetHeight;
              if (!it.body || Math.abs(nh - it.h) < 1) continue;
              const old = it.body, dh = nh - it.h;
              const ang = old.angle;
              const nx = old.position.x - Math.sin(ang) * dh / 2;
              const ny = old.position.y + Math.cos(ang) * dh / 2;
              it.h = nh;
              it.y0 = it.top + nh / 2;
              const nb = makeBody(it, nx, ny);
              Body.setAngle(nb, ang);
              Body.setVelocity(nb, old.velocity);
              Body.setAngularVelocity(nb, old.angularVelocity);
              Composite.remove(engine.world, old);
              Composite.add(engine.world, nb);
              bodies[bodies.indexOf(old)] = nb;
              it.body = nb;
              if (drag && drag.b === old) { drag.b = nb; if (drag.c) drag.c.bodyB = nb; }
              // Сусіди можуть лежати на ній — будимо всіх
              bodies.forEach((b) => Sleeping.set(b, false));
            }
          });
          items.forEach((it) => ro.observe(it.el));

          // Тап — звичайне натискання; потягнув — хапаєш уламок і жбурляєш
          let drag = null;
          const pointerDown = (e) => {
            if (e.target.closest && e.target.closest('.wreck-restart')) return;
            const el = e.target.closest && e.target.closest('.wreck-body');
            if (!el || drag) return;
            const it = items.find((i) => i.el === el);
            if (!it || !it.body) return;
            if (e.pointerType === 'mouse') e.preventDefault();   // без виділення тексту
            drag = { c: null, id: e.pointerId, b: it.body, sx: e.clientX, sy: e.clientY, el };
          };
          const pointerMove = (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            if (!drag.c) {
              if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
              const b = drag.b;
              Sleeping.set(b, false);
              drag.c = Constraint.create({
                pointA: { x: e.clientX, y: e.clientY },
                bodyB: b,
                pointB: { x: drag.sx - b.position.x, y: drag.sy - b.position.y },
                stiffness: 0.18,
                damping: 0.12,
                length: 0
              });
              Composite.add(engine.world, drag.c);
              drag.el.classList.add('is-grabbed');
              try { drag.el.setPointerCapture(e.pointerId); } catch (_) {}
              sound('pick');
              Haptics.tick(10);
            }
            drag.c.pointA.x = e.clientX;
            drag.c.pointA.y = e.clientY;
            Sleeping.set(drag.b, false);
          };
          const pointerUp = (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            if (drag.c) {
              Composite.remove(engine.world, drag.c);
              drag.el.classList.remove('is-grabbed');
              // Трохи обмежуємо швидкість кидка, щоб не прошивало стіни
              const v = drag.b.velocity, sp = Math.hypot(v.x, v.y);
              if (sp > 45) Body.setVelocity(drag.b, { x: v.x * 45 / sp, y: v.y * 45 / sp });
              suppressClick = true;
              setTimeout(() => { suppressClick = false; }, 400);
            }
            drag = null;
          };
          document.addEventListener('pointerdown', pointerDown, { passive: false });
          document.addEventListener('pointermove', pointerMove);
          document.addEventListener('pointerup', pointerUp);
          document.addEventListener('pointercancel', pointerUp);

          // Нахил телефона керує гравітацією, струс — підкидає все
          window.__wreckTilt = (gx, gy) => {
            const k = 2.4 / 9.8;
            engine.gravity.x += (gx * k - engine.gravity.x) * 0.2;
            engine.gravity.y += (gy * k - engine.gravity.y) * 0.2;
            if (Math.abs(gx) > 2) bodies.forEach((b) => { if (b.isSleeping) Sleeping.set(b, false); });
          };
          window.__wreckShake = (power) => {
            bodies.forEach((b) => {
              Sleeping.set(b, false);
              const big = b.plugin.it.w > W * 0.6;
              Body.setVelocity(b, { x: b.velocity.x + rand(-8, 8) * power, y: b.velocity.y - rand(8, 16) * power * (big ? 0.7 : 1) });
              Body.setAngularVelocity(b, b.angularVelocity + rand(-0.2, 0.2) * power * (big ? 0.3 : 1));
            });
            sound('clack', 1);
          };

          // Фіксований крок 60 Гц — стабільно і на 120 Гц екранах
          let last = performance.now(), acc = 0;
          const STEP = 1000 / 60;
          function frame(now) {
            acc += Math.min(now - last, 100);
            last = now;
            while (acc >= STEP) { Engine.update(engine, STEP); acc -= STEP; }
            for (const it of items) {
              const b = it.body;
              if (!b) continue;
              it.el.style.transform = `translate3d(${(b.position.x - it.x0).toFixed(1)}px, ${(b.position.y - it.y0).toFixed(1)}px, 0) rotate(${b.angle.toFixed(4)}rad)`;
            }
            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        }

        // Кнопка перезапуску
        setTimeout(() => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'wreck-restart';
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Перезапустити сайт</span>';
          btn.addEventListener('click', () => location.reload());
          document.body.appendChild(btn);
        }, 2600);
      }

      function pop() {
        popping = true;
        clearTimeout(deflateTimer);
        stat('pops');
        sound('boom');
        Haptics.pattern([140, 40, 80, 40, 60, 40, 30]);
        if (flash) { flash.classList.remove('is-boom'); void flash.offsetWidth; flash.classList.add('is-boom'); }
        overlay.classList.remove('is-boom'); void overlay.offsetWidth; overlay.classList.add('is-boom');
        setTimeout(() => overlay.classList.remove('is-boom'), 600);
        puff.style.setProperty('--s', puff.style.scale || '1.7');
        puff.classList.remove('is-inflating');
        puff.style.filter = '';
        puff.classList.add('is-popping');
        // Вибух одразу зносить увесь сайт
        if (window.__closeEgg) window.__closeEgg();
        wreckSite();
        secret('wreck');
        setTimeout(() => {
          puff.classList.remove('is-popping');
          puff.style.scale = '';
          puff.classList.add('is-reforming');
          sound('splash', 0.4);
          setTimeout(() => {
            puff.classList.remove('is-reforming');
            level = 0;
            taps = [];
            applyPuff();
            popping = false;
          }, 950);
        }, 1000);
      }

      // ---------- Струс телефона ----------
      let motionOn = false;
      let lastShake = 0;
      let hits = [];
      let prevA = null;

      function onMotion(e) {
        const a = e.accelerationIncludingGravity || e.acceleration;
        if (!a || a.x == null) return;
        if (prevA) {
          const d = Math.abs(a.x - prevA.x) + Math.abs(a.y - prevA.y) + Math.abs(a.z - prevA.z);
          const now = performance.now();
          if (d > 28) {
            hits = hits.filter((t) => now - t < 700);
            hits.push(now);
            if (hits.length >= 3 && now - lastShake > 1200) {
              lastShake = now;
              hits = [];
              // Напрямок струсу (в координатах екрана)
              const sign = isIOS ? -1 : 1;
              const dir = Math.atan2((a.y - prevA.y) * -sign, (a.x - prevA.x) * sign);
              shaken(Math.min(d / 45, 1.6), dir);
            }
          }
        }
        prevA = { x: a.x, y: a.y, z: a.z };

        // У режимі "Кидання" гравітація йде за нахилом телефона — картка їздить по екрану
        if (window.__wreckTilt && e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
          const sign = isIOS ? -1 : 1;
          window.__wreckTilt(-e.accelerationIncludingGravity.x * sign, e.accelerationIncludingGravity.y * sign);
        }

        if (free && e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
          const sign = isIOS ? -1 : 1;
          const gx = -e.accelerationIncludingGravity.x * sign;
          const gy = e.accelerationIncludingGravity.y * sign;
          const k = 2600 / 9.8;
          grav.x += (gx * k - grav.x) * 0.25;
          grav.y += (gy * k - grav.y) * 0.25;
        }
      }

      function shaken(power, dir) {
        stat('shakes');
        if (window.__wreckShake) { window.__wreckShake(Math.min(power, 1.4)); return; }
        Haptics.pattern([30, 40, 30, 40, 60]);
        const eggOpen = overlay && overlay.classList.contains('is-open');
        if (eggOpen) {
          if (window.__egg3dShake && window.__egg3dShake(power)) return;
          // Режим "Кидання": струс розкидає картку по екрану
          if (free && !carrying) {
            const ang = dir != null ? dir : rand(0, Math.PI * 2);
            const sp = 1400 + power * 1400;
            T.vx += Math.cos(ang) * sp;
            T.vy += Math.sin(ang) * sp - 400;
            T.vrot += rand(-700, 700);
            sound('splash', 0.7);
            return;
          }
          if (!popping && window.__jellyKick) {
            window.__jellyKick(rand(-1, 1) * 900 * power, rand(-1, 1) * 900 * power);
            sound('splash', 0.5);
          }
          return;
        }
        // Головна сторінка — плашки підстрибують
        document.body.classList.remove('is-shaken');
        void document.body.offsetWidth;
        document.body.classList.add('is-shaken');
        setTimeout(() => document.body.classList.remove('is-shaken'), 1000);
      }

      // ---------- "Струс" на ПК: потрусити вікном браузера ----------
      // Рахуємо різкі зміни напрямку руху: 5 розворотів за 0.7 с — це струс.
      function makeWiggle(minAmp) {
        let lastX = null, lastY = null, dirX = 0, dirY = 0, anchorX = 0, anchorY = 0, flips = [];
        return (x, y) => {
          const now = performance.now();
          if (lastX === null) { lastX = anchorX = x; lastY = anchorY = y; return; }
          const dx = x - lastX, dy = y - lastY;
          lastX = x; lastY = y;
          const check = (d, dir, anchor, pos, setDir, setAnchor) => {
            if (Math.abs(d) < 1) return;
            const nd = Math.sign(d);
            if (dir !== 0 && nd !== dir && Math.abs(pos - anchor) > minAmp) flips.push(now);
            if (nd !== dir) { setDir(nd); setAnchor(pos); }
          };
          check(dx, dirX, anchorX, x, (v) => { dirX = v; }, (v) => { anchorX = v; });
          check(dy, dirY, anchorY, y, (v) => { dirY = v; }, (v) => { anchorY = v; });
          flips = flips.filter((t) => now - t < 700);
          if (flips.length >= 5 && now - lastShake > 1200) {
            lastShake = now;
            flips = [];
            const horizontal = Math.abs(dx) >= Math.abs(dy);
            shaken(1, horizontal ? (dx > 0 ? 0 : Math.PI) : (dy > 0 ? Math.PI / 2 : -Math.PI / 2));
          }
        };
      }

      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        // Вікно браузера: якщо його смикають за заголовок, змінюється screenX/screenY
        const windowWiggle = makeWiggle(12);
        setInterval(() => {
          if (!document.hidden) windowWiggle(window.screenX, window.screenY);
        }, 40);
      }

      // Акселерометр на сайті вимкнено: жодних підписок на devicemotion і запитів дозволу.
      // Струс лишився тільки на ПК — посмикати вікно браузера.
      function askMotion() {}

      // ---------- Секретні пасхалки ----------
      const SECRET_QUOTES = {
        hold: 'Ай блеее',
        dvd: 'ІДЕАЛЬНО В КУТ 📀',
        night: 'Стріма не буде я хочу спать сорі',
        heli: 'Ремонт за твій рахунок 📱',
        avatar: 'Хто вгадає де я, отримає ціле ніхуя!',
        footer: 'Ти читаєш дрібний шрифт? Поважаю 🧐',
        disco: 'Музикальна пауза!'
      };

      function secret(id) {
        if (!stats.secrets) stats.secrets = [];
        const first = !stats.secrets.includes(id);
        if (!first) return false;   // повторно нічого не показуємо — секрет уже знайдено
        stats.secrets.push(id);
        save();
        if (SECRET_QUOTES[id] && window.easterQuoteForce && overlay.classList.contains('is-open')) window.easterQuoteForce(SECRET_QUOTES[id]);
        Haptics.pattern([20, 40, 20, 40, 20, 40, 60]);
        checkAch();
        return true;
      }

      // Секрет: 7 тапів по аватарці — глітч
      const avatar = document.querySelector('.avatar-wrapper');
      let avatarTaps = [];
      if (avatar) {
        avatar.addEventListener('click', () => {
          const now = performance.now();
          avatarTaps = avatarTaps.filter((t) => now - t < 2500);
          avatarTaps.push(now);
          Haptics.tick(5 + avatarTaps.length * 2);
          if (avatarTaps.length >= 7) {
            avatarTaps = [];
            sound('glitch');
            document.body.classList.add('is-glitch');
            avatar.style.transition = 'rotate 1s cubic-bezier(0.34, 1.3, 0.64, 1)';
            avatar.style.rotate = '720deg';
            setTimeout(() => {
              document.body.classList.remove('is-glitch');
              avatar.style.transition = '';
              avatar.style.rotate = '';
            }, 2200);
            secret('avatar');
          }
        });
      }

      // Секрет: 5 тапів по підпису внизу сторінки
      const footer = document.getElementById('footerText');
      let footerTaps = [];
      if (footer) {
        footer.style.cursor = 'pointer';
        footer.addEventListener('click', () => {
          const now = performance.now();
          footerTaps = footerTaps.filter((t) => now - t < 2500);
          footerTaps.push(now);
          if (footerTaps.length >= 5) {
            footerTaps = [];
            const old = footer.textContent;
            footer.textContent = 'ти знайшов секрет 👀 · тепер ти еліта';
            Haptics.pattern([15, 40, 15]);
            sound('chime');
            setTimeout(() => { footer.textContent = old; }, 4000);
            secret('footer');
          }
        });
      }

      // Секрет: 8 швидких перемикань теми — дискотека
      const themeBtnEl = document.getElementById('themeBtn');
      let themeTaps = [];
      if (themeBtnEl) {
        themeBtnEl.addEventListener('click', () => {
          const now = performance.now();
          themeTaps = themeTaps.filter((t) => now - t < 4000);
          themeTaps.push(now);
          if (themeTaps.length >= 8) {
            themeTaps = [];
            document.body.classList.add('is-disco');
            Haptics.pattern([30, 70, 30, 70, 30, 70, 30, 70, 30]);
            clearTimeout(window.__discoTimer);
            window.__discoTimer = setTimeout(() => document.body.classList.remove('is-disco'), 60000);
            secret('disco');
          }
        });
      }

      function onOpen() {
        if (globalCount === null) loadCounter(); else renderCounter();
        // Секрет: відкрив пасхалку вночі
        const h = new Date().getHours();
        if (h >= 0 && h < 5) setTimeout(() => secret('night'), 600);
      }

      function onClose() {
        setFree(false, true);
        if (panel) panel.hidden = true;
      }

      return {
        stat, statMax, counterHit, tap, askMotion, onOpen, onClose, secret, setFree, launchWith,
        isFree: () => free,
        busy: () => carrying || popping || returning
      };
    })();

    // 5. Курсор
    const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (isDesktopPointer) {
      const canvas = document.getElementById('rayCanvas');
      const ctx = canvas.getContext('2d');

      let cssWidth = window.innerWidth;
      let cssHeight = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;

      function resizeCanvas() {
        dpr = window.devicePixelRatio || 1;
        cssWidth = window.innerWidth;
        cssHeight = window.innerHeight;

        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let mouse = { x: -200, y: -200, active: false, clicking: false, hovering: false, grabbable: false, grabbing: false };
      let vel = { x: 0, y: 0 };
      let prevMouse = { x: -200, y: -200 };
      let spin = 0;
      // Те, що можна схопити й тягати: картинка пасхалки, 3D-сцена, кільце "потягни"
      const GRAB_SELECTOR = '.easter-img, .easter-fly, .egg3d-canvas';
      let cursorDot = { x: -200, y: -200 };
      let cursorRing = { x: -200, y: -200, size: 24 };

      // Pointer-події: вони приходять навіть коли елемент блокує звичайні події миші (перетягування)
      window.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;

        const target = e.target.closest('a, button, [role="button"], .username-badge, .nested-btn, .link-main-row, .insta-preview-card');
        mouse.grabbable = !!e.target.closest(GRAB_SELECTOR);
        mouse.hovering = !!target && !mouse.grabbable;
      });

      window.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        mouse.clicking = true;
        mouse.grabbing = mouse.grabbable;
      }, true);
      window.addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'mouse') return;
        mouse.clicking = false;
        mouse.grabbing = false;
      }, true);
      document.addEventListener('mouseout', (e) => {
        if (!e.relatedTarget) mouse.active = false; // курсор пішов за межі вікна
      });
      window.addEventListener('blur', () => { mouse.active = false; mouse.clicking = false; mouse.grabbing = false; });

      function renderFrame() {
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        if (mouse.active) {
          cursorDot.x += (mouse.x - cursorDot.x) * 0.8;
          cursorDot.y += (mouse.y - cursorDot.y) * 0.8;

          cursorRing.x += (mouse.x - cursorRing.x) * 0.28;
          cursorRing.y += (mouse.y - cursorRing.y) * 0.28;

          let targetSize = mouse.grabbing ? 20 : mouse.clicking ? 18 : mouse.grabbable ? 46 : (mouse.hovering ? 38 : 24);
          cursorRing.size += (targetSize - cursorRing.size) * 0.25;

          // Швидкість курсора — для желейного розтягування кільця під час перетягування
          vel.x += ((mouse.x - prevMouse.x) - vel.x) * 0.3;
          vel.y += ((mouse.y - prevMouse.y) - vel.y) * 0.3;
          prevMouse.x = mouse.x;
          prevMouse.y = mouse.y;
          spin += mouse.grabbable && !mouse.grabbing ? 0.03 : 0;

          const currentTheme = htmlEl.getAttribute('data-theme') || getSystemTheme();

          let ringColor = 'rgba(35, 37, 42, 0.35)';
          let dotColor = '#23252a';

          if (currentTheme === 'dark') {
            ringColor = mouse.hovering ? 'rgba(255, 255, 255, 0.85)' : 'rgba(240, 241, 244, 0.38)';
            dotColor = '#ffffff';
          } else if (currentTheme === 'aqua') {
            ringColor = mouse.hovering ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
            dotColor = '#ffffff';
          } else {
            ringColor = mouse.hovering ? 'rgba(0, 0, 0, 0.75)' : 'rgba(35, 37, 42, 0.35)';
            dotColor = '#23252a';
          }

          const grabMode = mouse.grabbable || mouse.grabbing;
          if (grabMode) {
            // Над фото: біле кільце з тінню — видно на будь-якому фоні
            ringColor = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
            ctx.shadowBlur = 6;
          }

          ctx.strokeStyle = ringColor;
          if (mouse.grabbing) {
            // Тягнеш — кільце стиснуте і розтягнуте вздовж руху, як желе
            const sp = Math.min(Math.hypot(vel.x, vel.y), 40);
            const stretch = 1 + sp / 22;
            const angle = Math.atan2(vel.y, vel.x);
            ctx.save();
            ctx.translate(cursorRing.x, cursorRing.y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, (cursorRing.size / 2) * stretch, (cursorRing.size / 2) / Math.sqrt(stretch), 0, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          } else if (mouse.grabbable) {
            // Можна хапати — кільце з 4 дуг, що повільно обертаються
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let i = 0; i < 4; i++) {
              const a0 = spin + i * Math.PI / 2 + 0.25;
              ctx.beginPath();
              ctx.arc(cursorRing.x, cursorRing.y, cursorRing.size / 2, a0, a0 + Math.PI / 2 - 0.5);
              ctx.stroke();
            }
          } else {
            ctx.beginPath();
            ctx.arc(cursorRing.x, cursorRing.y, cursorRing.size / 2, 0, Math.PI * 2);
            ctx.lineWidth = mouse.hovering ? 1.5 : 1.1;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(cursorDot.x, cursorDot.y, mouse.grabbing ? 4.5 : (mouse.hovering || mouse.grabbable ? 3.5 : 3), 0, Math.PI * 2);
          ctx.fillStyle = grabMode ? '#ffffff' : dotColor;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }
  </script>
  <!-- 3D-режим пасхалки (модель телефона) -->
