        return VALID_THEMES.includes(value) ? value : null;
      } catch (e) {
        return null;
      }
    }

    function writeManualTheme(value) {
      try {
        if (value) sessionStorage.setItem(THEME_KEY, value);
        else sessionStorage.removeItem(THEME_KEY);
      } catch (e) {}
    }

    try { localStorage.removeItem('theme'); } catch (e) {}

    function getSystemTheme() {
      return mediaQuery.matches ? 'dark' : 'light';
    }

    function syncTheme() {
      const manual = readManualTheme();
      const activeTheme = manual || getSystemTheme();

      htmlEl.setAttribute('data-theme', activeTheme);
      
      if (themeIcon) {
        if (activeTheme === 'dark') {
          themeIcon.innerHTML = aquaIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути тему Aqua');
        } else if (activeTheme === 'aqua') {
          themeIcon.innerHTML = sunIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути світлу тему');
        } else {
          themeIcon.innerHTML = moonIconSVG;
          themeBtn.setAttribute('title', 'Увімкнути темну тему');
        }
      }
    }

    const onSystemThemeChange = () => {
      writeManualTheme(null);
      syncTheme();
    };
    if (typeof mediaQuery.addEventListener === 'function') {
      mediaQuery.addEventListener('change', onSystemThemeChange);
    } else if (typeof mediaQuery.addListener === 'function') {
      mediaQuery.addListener(onSystemThemeChange); // старий Safari
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const current = htmlEl.getAttribute('data-theme') || getSystemTheme();
        let next = 'light';
        
        if (current === 'light') next = 'dark';
        else if (current === 'dark') next = 'aqua';
        else next = 'light';

        writeManualTheme(next);
        syncTheme();
      });
    }

    syncTheme();

    // Декодуємо всі три аватарки заздалегідь — щоб при першій зміні теми не було "блимання"
    document.querySelectorAll('.avatar-img').forEach((img) => {
      img.decoding = 'sync';
      if (img.decode) img.decode().catch(() => {});
    });

    // 4. Анімація за скролом (мобільні): картка стає випуклою лише під час гортання.
    //    Угорі сторінки активна перша картка, далі — по черзі до останньої.
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (isTouchDevice) {
      const cards = Array.from(document.querySelectorAll('.link-card'));
      let ticking = false;

      const docCenter = (el) => {
        const r = el.getBoundingClientRect();
        return r.top + (window.scrollY || window.pageYOffset) + r.height / 2;
      };

      function updateActiveCardOnScroll() {
        ticking = false;
        if (cards.length === 0) return;
        const scrollY = window.scrollY || window.pageYOffset;
        const first = docCenter(cards[0]);
        const last = docCenter(cards[cards.length - 1]);

        // Скільки треба прогорнути, щоб остання картка дійшла до центру екрана
        const range = Math.max(last - window.innerHeight / 2, 1);
        const progress = Math.min(Math.max(scrollY / range, 0), 1);
        const focus = first + (last - first) * progress;

        let activeIndex = -1;
        let bestDist = Infinity;
        cards.forEach((card, idx) => {
          const dist = Math.abs(docCenter(card) - focus);
          if (dist < bestDist) { bestDist = dist; activeIndex = idx; }
        });

        // Картки вже за верхнім краєм (гортаємо до пасхалки) — нічого не піднімаємо
        const lastRect = cards[cards.length - 1].getBoundingClientRect();
        if (lastRect.bottom < 0) activeIndex = -1;

        cards.forEach((card, idx) => {
          card.classList.toggle('is-elevated', idx === activeIndex && !card.classList.contains('is-open'));
        });
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(updateActiveCardOnScroll);
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', updateActiveCardOnScroll);
      setTimeout(updateActiveCardOnScroll, 350);
    }

    // 4.0 Хаптика (тактильний відгук)
    //  - Android (Chrome, Samsung, Opera): navigator.vibrate з візерунками;
    //  - iPhone (iOS 18+): Safari дає системний "тап" Taptic Engine, коли клікаєш
    //    по перемикачу <input type="checkbox" switch>. Працює лише у відповідь на
    //    дотик (pointerdown / pointerup / touchend), тому найкраще — у ці моменти.
    const Haptics = (() => {
      const canVibrate = typeof navigator.vibrate === 'function';
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let label = null;

      if (isIOS && !canVibrate) {
        label = document.createElement('label');
        label.setAttribute('aria-hidden', 'true');
        label.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');
        input.tabIndex = -1;
        label.appendChild(input);
        document.body.appendChild(label);
      }

      const iosTap = () => { if (label) { try { label.click(); } catch (e) {} } };
      const vibrate = (p) => { if (canVibrate) { try { navigator.vibrate(p); } catch (e) {} } };

      return {
        // Один короткий "тік"
        tick(ms = 8) {
          if (canVibrate) vibrate(ms); else iosTap();
        },
        // Лише для iPhone (на Android не перебиваємо вже запущену вібрацію)
        ios(p) {
          if (canVibrate || !label) return;
          this.pattern(p);
        },
        // Візерунок [вібро, пауза, вібро, ...] в мілісекундах
        pattern(p) {
          if (canVibrate) { vibrate(p); return; }
          if (!label) return;
          let t = 0;
          p.forEach((d, i) => {
            if (i % 2 === 0) setTimeout(iosTap, t);
            t += d;
          });
        }
      };
    })();

    // 4.1 Пасхалка: в самому низу тягнеш пальцем угору (або крутиш колесо далі) —
    //     пунктирне кільце плавно заповнюється, а коли повне — вилітає картинка.
    (() => {
      const ring = document.getElementById('pullRing');
      const fill = document.getElementById('pullRingFill');
      const arrow = document.getElementById('pullRingArrow');
      const overlay = document.getElementById('easterOverlay');
      if (!ring || !fill || !overlay) return;

      const PULL_DISTANCE = 160;          // скільки пікселів тягнути пальцем
      const CIRCUMFERENCE = 2 * Math.PI * 29;
      fill.style.strokeDasharray = CIRCUMFERENCE;
      fill.style.strokeDashoffset = CIRCUMFERENCE;

      let progress = 0;
      let pullStartY = null;
      let done = false;

      const atBottom = () =>
        window.innerHeight + (window.scrollY || window.pageYOffset) >= document.documentElement.scrollHeight - 4;

      function render(p, dragging) {
        progress = p;
        ring.classList.toggle('is-dragging', !!dragging);
        fill.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);
        ring.style.opacity = p > 0 ? Math.min(1, p * 4) : 0;
        ring.style.transform = p > 0
          ? `translateY(${(1 - p) * 20}px) scale(${0.75 + p * 0.25})`
          : '';
        if (arrow) arrow.style.transform = `translateY(${-p * 4}px)`;
      }

      function reset() {
        pullStartY = null;
        if (!done) render(0, false);
      }

      function openEgg() {
        if (window.__siteWrecked) return;
        done = true;
        pullStartY = null;
        ring.classList.remove('is-dragging');
        ring.style.opacity = '';
        ring.style.transform = '';
        ring.classList.add('is-done');
        openedThisTouch = true;
        Haptics.pattern([18, 45, 35]);
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.documentElement.classList.add('egg-open');
        if (window.EggFun) { window.EggFun.stat('opens'); window.EggFun.onOpen(); }
        if (window.__loadMatter) window.__loadMatter().catch(() => {});
      }

      function closeEgg() {
        overlay.dispatchEvent(new CustomEvent('eggclose'));
        if (window.EggFun) window.EggFun.onClose();
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('egg-open');
        ring.classList.remove('is-done');
        done = false;
        render(0, false);
      }

      window.__closeEgg = closeEgg;

      // Поки відкрита пасхалка, сторінка не гортається (на iOS overflow:hidden не завжди досить)
      document.addEventListener('touchmove', (e) => {
        if (!document.documentElement.classList.contains('egg-open')) return;
        if (e.target.closest && e.target.closest('.egg-trophies-list')) return;
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      // Вихід — лише кнопкою справа зверху (або Esc на ПК); тап по фону нічого не закриває
      const closeBtn = document.getElementById('eggClose');
      if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          Haptics.tick(10);
          closeEgg();
        });
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeEgg();
      });

      // --- Палець ---
      document.addEventListener('touchstart', (e) => {
        if (done || e.touches.length !== 1) return;
        pullStartY = atBottom() ? e.touches[0].clientY : null;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (done || e.touches.length !== 1) return;
        const y = e.touches[0].clientY;
        if (pullStartY === null) {
          if (atBottom()) pullStartY = y; // догорнули до низу посеред жесту
          return;
        }
        const dy = pullStartY - y; // > 0, коли палець іде вгору
        if (dy <= 0) { render(0, true); return; }
        // Блокуємо прокрутку й "гумку" браузера, щоб нічого не смикалось
        if (e.cancelable) e.preventDefault();
        const p = Math.min(dy / PULL_DISTANCE, 1);
        render(p, true);
        if (p >= 1) openEgg();
      }, { passive: false });

      // На iPhone тактильний відгук можливий лише в touchend — "клацаємо" тут
      let openedThisTouch = false;
      document.addEventListener('touchend', () => {
        if (openedThisTouch) {
          openedThisTouch = false;
          Haptics.ios([1, 70, 1]);
          // iPhone: дозвіл на датчик руху (для струшування) — лише у відповідь на дотик
          if (window.EggFun) window.EggFun.askMotion();
        }
        reset();
      }, { passive: true });
      document.addEventListener('touchcancel', reset, { passive: true });

      // --- Колесо миші на ПК ---
      let wheelTimer = null;
      window.addEventListener('wheel', (e) => {
        if (done || e.deltaY <= 0 || !atBottom()) return;
        render(Math.min(progress + e.deltaY / 900, 1), true);
        if (progress >= 1) { openEgg(); return; }
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => render(0, false), 500);
      }, { passive: true });
    })();

    // Швидкість пальця за останні ~80 мс руху (для кидків по інерції)
    const makeVelTracker = () => {
      let hist = [];
      return {
        reset() { hist = []; },
        push(x, y) {
          const t = performance.now();
          hist.push([t, x, y]);
          while (hist.length > 2 && t - hist[0][0] > 120) hist.shift();
        },
        // Повертає {x, y} px/с; якщо палець зупинився перед відпусканням — нуль
        get() {
          const now = performance.now();
          if (hist.length < 2 || now - hist[hist.length - 1][0] > 100) return { x: 0, y: 0 };
          const last = hist[hist.length - 1];
          let first = hist[0];
          for (const h of hist) { if (last[0] - h[0] <= 80) { first = h; break; } }
          const dt = Math.max((last[0] - first[0]) / 1000, 0.008);
          return { x: (last[1] - first[1]) / dt, y: (last[2] - first[2]) / dt };
        }
      };
    };

    // 4.2 Желейна картинка: хапаєш пальцем — тягнеш — розтягується, відпускаєш — пружинить
    (() => {
      const img = document.querySelector('.easter-img');
      if (!img) return;

      const STIFFNESS = 260;   // пружність (чим більше — тим швидше повертається)
      const DAMPING = 9;       // гасіння (чим менше — тим довше трясеться)
      const MAX_PULL = 260;    // максимальний зсув, далі "впирається"

      let pos = { x: 0, y: 0 };   // поточна деформація
      let vel = { x: 0, y: 0 };
      let dragging = false;
      let grab = null;            // точка, де схопили (відносно центру, -1..1)
      let start = null;
      let rafId = null;
      let lastT = 0;
      let detent = 0;
      let lastDetent = 0;
      let fv = { x: 0, y: 0 };       // швидкість пальця, px/с
      let lastMove = null;
      let holdStart = 0;             // секрет: тримати розтягнутою до упору
      let holdPointer = null, holdRaf = null, lastHoldTick = 0;
      const jitter = { x: 0, y: 0, r: 0 };
      const tracker = makeVelTracker();

      // Еластичний "упор": чим далі тягнеш, тим важче
      const soften = (v) => Math.sign(v) * MAX_PULL * (1 - Math.exp(-Math.abs(v) / MAX_PULL));

      function apply() {
        const { x, y } = pos;
        const len = Math.hypot(x, y);
        if (len < 0.05) {
          img.style.transform = '';
          return;
        }
        const angle = Math.atan2(y, x) * 180 / Math.PI;
        const stretch = 1 + len / 220;               // тягнемо вздовж руху пальця
        const squeeze = 1 / Math.sqrt(stretch);      // і стискаємо впоперек (як гума)
        img.style.transform =
          `translate(${x * 0.35 + jitter.x}px, ${y * 0.35 + jitter.y}px) rotate(${jitter.r}deg) rotate(${angle}deg) scale(${stretch}, ${squeeze}) rotate(${-angle}deg)`;
      }

      function step(t) {
        const dt = Math.min((t - lastT) / 1000, 0.032);
        lastT = t;
        // Пружина: a = -k*x - c*v
        vel.x += (-STIFFNESS * pos.x - DAMPING * vel.x) * dt;
        vel.y += (-STIFFNESS * pos.y - DAMPING * vel.y) * dt;
        pos.x += vel.x * dt;
        pos.y += vel.y * dt;
        apply();
        if (Math.hypot(pos.x, pos.y) < 0.1 && Math.hypot(vel.x, vel.y) < 0.5) {
          pos = { x: 0, y: 0 };
          vel = { x: 0, y: 0 };
          apply();
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(step);
      }

      const is3D = () => document.getElementById('easterOverlay').classList.contains('is-3d');

      // Струс телефона — желе отримує поштовх
      window.__jellyKick = (kx, ky) => {
        if (dragging) return;
        vel.x += kx;
        vel.y += ky;
        if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(step); }
      };

      img.addEventListener('pointerdown', (e) => {
        if (is3D()) return; // у 3D-режимі картку крутять, а не розтягують
        e.preventDefault();
        // Режим "Кидання" — картку носять і жбурляють (це робить EggFun)
        if (window.EggFun && window.EggFun.isFree()) return;
        // Картка лускає — не чіпаємо
        if (window.EggFun && window.EggFun.busy()) return;
        if (window.EggFun && window.EggFun.tap()) return; // надування з'їло дотик
        dragging = true;
        fv = { x: 0, y: 0 };
        tracker.reset();
        tracker.push(e.clientX, e.clientY);
        lastMove = { x: e.clientX, y: e.clientY, t: performance.now() };
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        const r = img.getBoundingClientRect();
        grab = {
          x: ((e.clientX - r.left) / r.width) * 2 - 1,
          y: ((e.clientY - r.top) / r.height) * 2 - 1
        };
        // Тягнемо від протилежного боку — він ніби "прибитий", а схоплений тягнеться
        img.style.transformOrigin = `${50 - grab.x * 50}% ${50 - grab.y * 50}%`;
        start = { x: e.clientX - pos.x, y: e.clientY - pos.y };
        vel = { x: 0, y: 0 };
        try { img.setPointerCapture(e.pointerId); } catch (err) {}
        if (window.easterQuote) window.easterQuote();
        detent = 0;
        Haptics.tick(10);
        if (window.easterSound) window.easterSound.grab();
      });

      img.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const tNow = performance.now();
        if (lastMove) {
          const dtm = Math.max((tNow - lastMove.t) / 1000, 0.004);
          fv.x = fv.x * 0.5 + ((e.clientX - lastMove.x) / dtm) * 0.5;
          fv.y = fv.y * 0.5 + ((e.clientY - lastMove.y) / dtm) * 0.5;
        }
        lastMove = { x: e.clientX, y: e.clientY, t: tNow };
        tracker.push(e.clientX, e.clientY);
        const nx = soften(e.clientX - start.x);
        const ny = soften(e.clientY - start.y);
        // Швидкість потрібна, щоб відпущена картинка "відстрілювала" природно
        vel = { x: (nx - pos.x) * 60, y: (ny - pos.y) * 60 };
        pos = { x: nx, y: ny };
        apply();
        // "Клацання" при розтягуванні — як у гуми, що натягується (на Android)
        const level = Math.floor(Math.hypot(nx, ny) / 40);
        const now = performance.now();
        if (level > detent && now - lastDetent > 45) {
          Haptics.tick(4 + level * 2);
          lastDetent = now;
        }
        detent = level;

        // Рогатка: сильно тримаєш розтягнутою понад секунду — картинка дедалі сильніше тремтить
        // і пуляється в протилежний бік, вмикається "Кидання"
        const pullNow = Math.hypot(nx, ny);
        if (pullNow > 160) {
          if (!holdStart) {
            holdStart = now;
            holdPointer = e.pointerId;
            if (!holdRaf) holdRaf = requestAnimationFrame(holdTick);
          }
        } else {
          holdStart = 0;
        }
      });

      function holdTick(t) {
        holdRaf = null;
        if (!dragging || !holdStart) {
          jitter.x = jitter.y = jitter.r = 0;
          apply();
          return;
        }
        const now = performance.now();
        const el = now - holdStart;
        // Тремтіння наростає з 0.25 с до 1 с
        const p = Math.max(0, Math.min(1, (el - 250) / 750));
        const amp = p * p * 6 + (p > 0 ? 0.6 : 0);
        jitter.x = (Math.random() * 2 - 1) * amp;
        jitter.y = (Math.random() * 2 - 1) * amp;
        jitter.r = (Math.random() * 2 - 1) * amp * 0.5;
        apply();
        if (p > 0 && now - lastHoldTick > 90 - p * 50) {
          lastHoldTick = now;
          Haptics.tick(Math.round(4 + p * 14));
        }
        if (el > 1000 && window.EggFun && window.EggFun.launchWith) { launchFromHold(); return; }
        holdRaf = requestAnimationFrame(holdTick);
      }

      function launchFromHold() {
        const pullNow = Math.hypot(pos.x, pos.y) || 1;
        holdStart = 0;
        jitter.x = jitter.y = jitter.r = 0;
        const k = 2600 + (pullNow - 160) * 12;
        const dx = -pos.x / pullNow, dy = -pos.y / pullNow;
        dragging = false;
        try { if (holdPointer != null) img.releasePointerCapture(holdPointer); } catch (err) {}
        pos = { x: 0, y: 0 };
        vel = { x: 0, y: 0 };
        apply();
        if (window.EggFun.launchWith(dx * k, dy * k)) {
          window.EggFun.secret('hold');
          Haptics.pattern([60, 30, 30]);
          if (window.easterSound) window.easterSound.splash(1);
        }
      }

      const release = (e) => {
        if (!dragging) return;
        dragging = false;
        const pull = Math.hypot(pos.x, pos.y);

        holdStart = 0;

        if (pull > 30 && window.EggFun) {
          window.EggFun.stat('stretches');
          window.EggFun.statMax('maxPull', pull);
          window.EggFun.counterHit();
        }
        if (pull > 30) {
          // Вібрація "пружинить" разом з картинкою: сильний удар і затухаючі відскоки
          const k = Math.min(pull / 220, 1.2);
          Haptics.pattern([
            Math.round(22 + 30 * k), 55,
            Math.round(14 + 18 * k), 70,
            Math.round(8 + 10 * k), 85,
            Math.round(5 + 4 * k)
          ]);
          if (window.easterSound) window.easterSound.splash(k);
        }
        lastT = performance.now();
        rafId = requestAnimationFrame(step);
      };
      img.addEventListener('pointerup', release);
      img.addEventListener('pointercancel', release);
      img.addEventListener('lostpointercapture', release);
    })();

    // 4.3 Фрази з тг-каналу: при дотику до картинки, не частіше ніж раз на 3 секунди
    (() => {
      const bubble = document.getElementById('easterQuote');
      const all = Array.isArray(window.EASTER_PHRASES) ? window.EASTER_PHRASES.slice() : [];
      if (!bubble || all.length === 0) return;

      const PERIOD_MS = 3000;
      let deck = [];
      let lastShown = -Infinity;
      let hideTimer = null;

      // Перемішана колода — фрази не повторюються, поки не покажуться всі
      const nextPhrase = () => {
        if (deck.length === 0) {
          deck = all.slice();
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
        }
        return deck.pop();
      };

      window.easterQuote = () => {
        const now = performance.now();
        if (now - lastShown < PERIOD_MS) return;
        lastShown = now;
        bubble.textContent = nextPhrase();
        if (window.EggFun) window.EggFun.stat('quotes');
        bubble.classList.remove('is-shown');
        void bubble.offsetWidth; // перезапуск анімації
        bubble.classList.add('is-shown');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bubble.classList.remove('is-shown'), PERIOD_MS - 200);
      };

      // Показати конкретну фразу одразу (для секретів)
      window.easterQuoteForce = (text) => {
        lastShown = performance.now();
        bubble.textContent = text;
        bubble.classList.remove('is-shown');
        void bubble.offsetWidth;
        bubble.classList.add('is-shown');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bubble.classList.remove('is-shown'), PERIOD_MS);
      };

      // При закритті пасхалки ховаємо бульбашку
      const overlay = document.getElementById('easterOverlay');
      if (overlay) {
        overlay.addEventListener('eggclose', () => { bubble.classList.remove('is-shown'); lastShown = -Infinity; });
      }
    })();

    // 4.4 Звуки пасхалки: водяні "хлюпи" з варіаціями (синтез у браузері, без файлів)
    window.easterSound = (() => {
      const rand = (a, b) => a + Math.random() * (b - a);
      let ac = null;
      let lastVariant = -1;

      const getAC = () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        return ac;
      };

      // Спільний вихід для всіх звуків: тихіше, без різкого "дзвону" на верхах,
      // компресор згладжує гучні піки (вибух, удари), трохи м'якого простору
      let bus = null;
      const getBus = () => {
        if (bus) return bus;
        const input = ac.createGain();
        const tone = ac.createBiquadFilter();
        tone.type = 'lowpass';
        tone.frequency.value = 5200;
        tone.Q.value = 0.5;
        const deHarsh = ac.createBiquadFilter();   // прибираємо "свердління" в районі 3 кГц
        deHarsh.type = 'peaking';
        deHarsh.frequency.value = 3200;
        deHarsh.Q.value = 1;
        deHarsh.gain.value = -4;
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -22;
        comp.knee.value = 18;
        comp.ratio.value = 4;
        comp.attack.value = 0.004;
        comp.release.value = 0.2;
        const master = ac.createGain();
        master.gain.value = 0.42;
        // Легкий простір: коротке розмите відлуння
        const len = Math.floor(ac.sampleRate * 0.35);
        const ir = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = ir.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        const verb = ac.createConvolver();
        verb.buffer = ir;
        const wet = ac.createGain();
        wet.gain.value = 0.12;
        input.connect(tone).connect(deHarsh).connect(comp);
        deHarsh.connect(verb).connect(wet).connect(comp);
        comp.connect(master).connect(ac.destination);
        bus = input;
        return bus;
      };

      const out = (vol) => {
        const g = ac.createGain();
        g.gain.value = vol;
        g.connect(getBus());
        return g;
      };

      // Бульбашка: тон швидко росте вгору — так звучить крапля у воді
      const bloop = (dest, time, f0, f1, dur, vol, type = 'sine') => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, time);
        o.frequency.exponentialRampToValueAtTime(f1, time + dur * 0.7);
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        o.connect(g).connect(dest);
        o.start(time);
        o.stop(time + dur + 0.02);
      };

      // Шум води, який "закривається" фільтром
      const wash = (dest, time, dur, vol, fStart, fEnd, q = 3) => {
        const len = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.Q.value = q;
        lp.frequency.setValueAtTime(fStart, time);
        lp.frequency.exponentialRampToValueAtTime(fEnd, time + dur * 0.85);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(lp).connect(g).connect(dest);
        src.start(time);
        src.stop(time + dur);
      };

      const drops = (dest, t0, n, spread) => {
        for (let i = 0; i < n; i++) {
          const f = rand(700, 1900);
          bloop(dest, t0 + rand(0.05, spread), f, f * rand(1.4, 2.1), rand(0.04, 0.08), rand(0.08, 0.2));
        }
      };

      // Варіації хлюпу
      const variants = [
        // 0. Класичний "бульк" з краплями
        (d, t, k, p) => {
          bloop(d, t, 160 * p, (620 + k * 200) * p, 0.16, 0.5);
          wash(d, t, 0.45, 0.18 + k * 0.12, 2600, 350);
          drops(d, t, 4 + Math.round(k * 5), 0.6);
        },
        // 1. Великий плюх — наче щось упало у ванну
        (d, t, k, p) => {
          bloop(d, t, 90 * p, 260 * p, 0.22, 0.55);
          wash(d, t, 0.7, 0.3 + k * 0.15, 3800, 260, 1.5);
          bloop(d, t + 0.05, 240 * p, 900 * p, 0.12, 0.3);
          drops(d, t + 0.1, 7 + Math.round(k * 6), 0.9);
        },
        // 2. Кап-кап-кап — серія крапель
        (d, t, k, p) => {
          const n = 3 + Math.round(k * 2);
          for (let i = 0; i < n; i++) {
            const f = rand(350, 600) * p;
            bloop(d, t + i * rand(0.09, 0.14), f, f * 2.4, 0.11, 0.42 - i * 0.05);
          }
          wash(d, t, 0.25, 0.08, 2000, 500);
        },
        // 3. Желейний "боїнг" — пружинить разом з картинкою
        (d, t, k, p) => {
          const o = ac.createOscillator();
          const lfo = ac.createOscillator();
          const lfoGain = ac.createGain();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(210 * p, t);
          o.frequency.exponentialRampToValueAtTime(140 * p, t + 0.6);
          lfo.frequency.setValueAtTime(14, t);
          lfo.frequency.linearRampToValueAtTime(6, t + 0.6);
          lfoGain.gain.setValueAtTime(70 * (0.6 + k * 0.4), t);
          lfoGain.gain.exponentialRampToValueAtTime(1, t + 0.6);
          lfo.connect(lfoGain).connect(o.frequency);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
          o.connect(g).connect(d);
          o.start(t); lfo.start(t);
          o.stop(t + 0.7); lfo.stop(t + 0.7);
          wash(d, t, 0.3, 0.12, 1800, 400);
        },
        // 4. Ковток "глюк" — тон падає вниз
        (d, t, k, p) => {
          bloop(d, t, 420 * p, 85 * p, 0.2, 0.5);
          bloop(d, t + 0.13, 300 * p, 70 * p, 0.16, 0.35);
          wash(d, t, 0.35, 0.12 + k * 0.08, 1400, 200, 5);
        },
        // 5. Чвяк — в'язкий хлюп
        (d, t, k, p) => {
          wash(d, t, 0.22, 0.35, 900, 3500, 8);
          wash(d, t + 0.08, 0.3, 0.2, 2500, 300, 6);
          bloop(d, t + 0.02, 120 * p, 380 * p, 0.14, 0.4, 'triangle');
          drops(d, t + 0.15, 2 + Math.round(k * 3), 0.4);
        }
      ];

      return {
        // Удар об край екрана під час польоту
        thud(k) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(Math.min(0.8, 0.3 + k * 0.5));
            bloop(d, t, 140 * rand(0.85, 1.2), 60, 0.14, 0.55);
            wash(d, t, 0.18, 0.12 + k * 0.1, 1600, 300, 2);
            if (k > 0.5) drops(d, t, 2, 0.3);
          } catch (e) {}
        },
        // Скрип повітряної кульки, що надувається (вище з кожним рівнем)
        inflate(level) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.35);
            const f = 300 + level * 90;
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(f, t);
            o.frequency.exponentialRampToValueAtTime(f * 1.35, t + 0.12);
            const lp = ac.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.value = 1800;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
            o.connect(lp).connect(g).connect(d);
            o.start(t);
            o.stop(t + 0.17);
          } catch (e) {}
        },
        // "ПУК": низьке хрипле брр з тремтінням тону + хлопок
        pop() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.9);
            // хлопок кульки
            wash(d, t, 0.12, 0.6, 6000, 800, 0.7);
            // брр
            const o = ac.createOscillator();
            const lfo = ac.createOscillator();
            const lfoG = ac.createGain();
            const g = ac.createGain();
            const lp = ac.createBiquadFilter();
            o.type = 'sawtooth';
            const base = rand(85, 110);
            o.frequency.setValueAtTime(base * 1.3, t + 0.05);
            o.frequency.exponentialRampToValueAtTime(base * 0.7, t + 0.75);
            lfo.type = 'square';
            lfo.frequency.setValueAtTime(rand(22, 30), t);
            lfoG.gain.value = base * 0.35;
            lfo.connect(lfoG).connect(o.frequency);
            lp.type = 'lowpass';
            lp.frequency.value = 650;
            lp.Q.value = 4;
            g.gain.setValueAtTime(0.0001, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.5, t + 0.09);
            g.gain.setValueAtTime(0.45, t + 0.55);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
            o.connect(lp).connect(g).connect(d);
            o.start(t + 0.05); lfo.start(t + 0.05);
            o.stop(t + 0.9); lfo.stop(t + 0.9);
          } catch (e) {}
        },
        // Вибух: глухий удар, гуркіт, що затихає, і тріск уламків
        boom() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const master = out(0.95);
            // Легке "перевантаження" для потужності
            const shaper = ac.createWaveShaper();
            const curve = new Float32Array(1024);
            for (let i = 0; i < 1024; i++) { const x = (i / 512) - 1; curve[i] = Math.tanh(x * 2.5); }
            shaper.curve = curve;
            shaper.connect(master);

            // Суб-удар
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(130, t);
            o.frequency.exponentialRampToValueAtTime(32, t + 0.9);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.9, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
            o.connect(g).connect(shaper);
            o.start(t); o.stop(t + 1.25);

            // Гуркіт
            wash(shaper, t, 1.6, 0.8, 5000, 90, 0.8);
            // Тріск уламків
            for (let i = 0; i < 9; i++) {
              const tt = t + 0.08 + Math.random() * 0.7;
              const len = Math.floor(ac.sampleRate * 0.03);
              const buf = ac.createBuffer(1, len, ac.sampleRate);
              const dd = buf.getChannelData(0);
              for (let j = 0; j < len; j++) dd[j] = (Math.random() * 2 - 1) * (1 - j / len);
              const src = ac.createBufferSource();
              src.buffer = buf;
              const hp = ac.createBiquadFilter();
              hp.type = 'highpass';
              hp.frequency.value = 1500 + Math.random() * 2500;
              const gg = ac.createGain();
              gg.gain.value = 0.15 + Math.random() * 0.2;
              src.connect(hp).connect(gg).connect(master);
              src.start(tt);
            }
          } catch (e) {}
        },
        // ---- Звуки для 3D-телефона (тверде тіло, без води) ----
        // Короткий клацаючий шум з фільтром
        _noise(dest, t, dur, vol, type, f, q = 1) {
          const len = Math.max(1, Math.floor(ac.sampleRate * dur));
          const buf = ac.createBuffer(1, len, ac.sampleRate);
          const dd = buf.getChannelData(0);
          for (let j = 0; j < len; j++) dd[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / len, 3);
          const src = ac.createBufferSource();
          src.buffer = buf;
          const fl = ac.createBiquadFilter();
          fl.type = type; fl.frequency.value = f; fl.Q.value = q;
          const g = ac.createGain();
          g.gain.value = vol;
          src.connect(fl).connect(g).connect(dest);
          src.start(t);
        },
        // Дзвінкий "пінг" корпусу (алюміній/скло)
        _ping(dest, t, f, dur, vol) {
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.002);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(dest);
          o.start(t); o.stop(t + dur + 0.02);
        },
        // Удар телефона об підлогу/стіну: глухий стук + клац корпусу
        clack(k) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.003;
            const d = out(Math.min(0.9, 0.25 + k * 0.65));
            const p = rand(0.9, 1.12);
            bloop(d, t, 180 * p, 70, 0.07 + k * 0.05, 0.5);            // глухий "тук" по столу
            this._noise(d, t, 0.025 + k * 0.02, 0.9, 'bandpass', 2600 * p, 0.9); // клац
            this._noise(d, t, 0.012, 0.5, 'highpass', 5000);
            this._ping(d, t, 1850 * p, 0.06 + k * 0.1, 0.06 + k * 0.08); // дзвін алюмінієвої рамки
            this._ping(d, t, 3120 * p, 0.04 + k * 0.06, 0.03 + k * 0.05);
          } catch (e) {}
        },
        // Свист повітря при кидку
        whoosh(k) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.003;
            const d = out(0.25 + k * 0.35);
            const dur = 0.22 + k * 0.18;
            const len = Math.floor(ac.sampleRate * dur);
            const buf = ac.createBuffer(1, len, ac.sampleRate);
            const dd = buf.getChannelData(0);
            for (let j = 0; j < len; j++) dd[j] = Math.random() * 2 - 1;
            const src = ac.createBufferSource();
            src.buffer = buf;
            const bp = ac.createBiquadFilter();
            bp.type = 'bandpass'; bp.Q.value = 1.4;
            bp.frequency.setValueAtTime(500, t);
            bp.frequency.exponentialRampToValueAtTime(1800 + k * 1400, t + dur * 0.45);
            bp.frequency.exponentialRampToValueAtTime(600, t + dur);
            const g = ac.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.7, t + dur * 0.4);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(bp).connect(g).connect(d);
            src.start(t); src.stop(t + dur);
          } catch (e) {}
        },
        // Тихий клік, коли береш телефон у руку
        pick() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.003;
            const d = out(0.35);
            this._noise(d, t, 0.018, 0.5, 'bandpass', 3200, 1.2);
            this._ping(d, t, 2400, 0.03, 0.03);
          } catch (e) {}
        },
        // Тріск скла екрана при сильному ударі
        crack(k) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.01;
            const d = out(0.5 + k * 0.4);
            this._noise(d, t, 0.05, 1, 'highpass', 2500);
            const n = 6 + Math.round(k * 10);
            for (let i = 0; i < n; i++) {
              const tt = t + Math.pow(Math.random(), 1.6) * (0.12 + k * 0.2);
              this._noise(d, tt, rand(0.004, 0.012), rand(0.3, 0.8), 'highpass', rand(3000, 7000));
              if (Math.random() < 0.5) this._ping(d, tt, rand(3500, 7500), rand(0.03, 0.09), rand(0.02, 0.05));
            }
          } catch (e) {}
        },
        // Глітч для секрету з аватаркою
        glitch() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.3);
            for (let i = 0; i < 8; i++) {
              const o = ac.createOscillator();
              const g = ac.createGain();
              o.type = 'square';
              o.frequency.value = rand(80, 1800);
              const tt = t + i * 0.06;
              g.gain.setValueAtTime(0.25, tt);
              g.gain.setValueAtTime(0.0001, tt + 0.045);
              o.connect(g).connect(d);
              o.start(tt); o.stop(tt + 0.05);
            }
          } catch (e) {}
        },
        // Дзинь досягнення
        chime() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.01;
            const d = out(0.35);
            [880, 1320, 1760].forEach((f, i) => {
              const o = ac.createOscillator();
              const g = ac.createGain();
              o.type = 'triangle';
              o.frequency.value = f;
              g.gain.setValueAtTime(0.0001, t + i * 0.09);
              g.gain.exponentialRampToValueAtTime(0.3, t + i * 0.09 + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.5);
              o.connect(g).connect(d);
              o.start(t + i * 0.09);
              o.stop(t + i * 0.09 + 0.55);
            });
          } catch (e) {}
        },
        // Переворот картки в 3D — легкий "свуш" і клац
        flip() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.45);
            wash(d, t, 0.14, 0.1, 600, 3000, 2);
            bloop(d, t + 0.05, 900, 1400, 0.04, 0.12, 'triangle');
          } catch (e) {}
        },
        // Тихий "чвяк" коли хапаєш картинку
        grab() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.5);
            wash(d, t, 0.09, 0.12, 700, 2200, 6);
            bloop(d, t, 110, 190, 0.07, 0.18, 'triangle');
          } catch (e) {}
        },
        // Хлюп при відпусканні: випадкова варіація (не та ж сама двічі поспіль)
        splash(k) {
          try {
            if (!getAC()) return;
            let v;
            do { v = Math.floor(Math.random() * variants.length); } while (v === lastVariant && variants.length > 1);
            lastVariant = v;
            const t = ac.currentTime + 0.01;
            const d = out(Math.min(0.9, 0.45 + k * 0.35));
            variants[v](d, t, k, rand(0.85, 1.2)); // p — випадкова висота тону
          } catch (e) {}
        }
      };
    })();

    // 4.6 Розваги пасхалки: кидок, надування, струшування, досягнення, лічильник
    window.EggFun = (() => {
      const overlay = document.getElementById('easterOverlay');
      const fly = document.getElementById('easterFly');
      const puff = document.getElementById('easterPuff');
      const flash = document.getElementById('eggFlash');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rand = (a, b) => a + Math.random() * (b - a);
      const sound = (name, ...args) => { if (window.easterSound && window.easterSound[name]) window.easterSound[name](...args); };

      // ---------- Векторні іконки досягнень ----------
      const ICON_PATHS = {
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
        stretch: '<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
        infinity: '<path d="M12 12c-2-2.7-4-4-6-4a4 4 0 0 0 0 8c2 0 4-1.3 6-4Zm0 0c2 2.7 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.3-6 4Z"/>',

      function checkAch() {

      // Список досягнень
      const panel = document.getElementById('eggTrophies');
