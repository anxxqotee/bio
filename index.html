  <meta name="theme-color" content="#141517">
  <!-- Тема — до першого кадру: інакше браузер малює спершу системну тему, а потім плавно перемикає на очах -->
  <script>
    (function () {
      var r = document.documentElement, t = null;
      try { t = sessionStorage.getItem('user_manual_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark' && t !== 'aqua') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      r.setAttribute('data-theme', t);
      r.classList.add('is-preload');
      // Переходи між темами вмикаємо лише після перших кадрів
      addEventListener('load', function () { requestAnimationFrame(function () { requestAnimationFrame(function () { r.classList.remove('is-preload'); }); }); });
    })();
  </script>

  <!-- Застосовуємо збережену тему ще до відмальовки, щоб не було "блимання" -->
  <script>
    (function () {
      try {
        var saved = sessionStorage.getItem('user_manual_theme');
        if (saved === 'light' || saved === 'dark' || saved === 'aqua') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Підключення шрифту */
    @font-face {
      font-family: 'SN Pro';
      src: url('fonts/sn-pro.woff2') format('woff2'), url('fonts/sn-pro.ttf') format('truetype');
      font-weight: 100 900;
      font-display: block;
    }

    @font-face {
      font-family: 'Caveat Duk';
      src: url('fonts/caveat-duk.woff2') format('woff2');
      font-weight: 600;
      font-display: block;
    }

    :root {
      /* Поверхні інтерфейсу пасхалки (у темі Aqua — непрозорі) */
      --egg-surface: var(--bg);
      --egg-pressed-bg: var(--text);
      --egg-pressed-fg: var(--bg);
      /* Плавні криві для всіх анімацій */
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) {
        --bg: #141517;
        --text: #f0f1f4;
        --subtext: #8d929f;
        --shadow-light: rgba(255, 255, 255, 0.05);
        --shadow-dark: rgba(0, 0, 0, 0.85);
        --card-border: rgba(255, 255, 255, 0.04);
        --icon-bg: #1a1c1f;
        --icon-fill: #e6e8ee;
        --tag-bg: #141517;
        --tag-text: #a4a9b8;
        --sub-card-bg: #191b1e;
        --sub-card-hover: #22252a;
        --copied-bg: #1e6b3b;
        --copied-text: #ffffff;
        --copied-badge-bg: rgba(255, 255, 255, 0.2);
      }
    }

    [data-theme="dark"] {
      --bg: #141517;
      --text: #f0f1f4;
      --subtext: #8d929f;
      --shadow-light: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --card-border: rgba(255, 255, 255, 0.04);
      --icon-bg: #1a1c1f;
      --icon-fill: #e6e8ee;
      --tag-bg: #141517;
      --tag-text: #a4a9b8;
      --sub-card-bg: #191b1e;
      --sub-card-hover: #22252a;
      --copied-bg: #1e6b3b;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    /* Тема Aqua */
    [data-theme="aqua"] {
      --bg: transparent;
      --text: #ffffff;
      --subtext: rgba(255, 255, 255, 0.82);
      --shadow-light: rgba(255, 255, 255, 0.22);
      --shadow-dark: rgba(10, 32, 45, 0.55);
      --card-border: rgba(255, 255, 255, 0.35);
      --icon-bg: rgba(255, 255, 255, 0.16);
      --icon-fill: #ffffff;
      --tag-bg: rgba(255, 255, 255, 0.16);
      --tag-text: #ffffff;
      --sub-card-bg: rgba(255, 255, 255, 0.12);
      --sub-card-hover: rgba(255, 255, 255, 0.24);
      --copied-bg: #197278;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
      --egg-surface: rgba(18, 62, 84, 0.94);
      --egg-pressed-bg: #ffffff;
      --egg-pressed-fg: #16425b;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'SN Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 18px 60px;
      overflow-x: hidden;
      position: relative;
    }

    /* Градієнт Aqua — окремий шар, що плавно проявляється (градієнт сам по собі не анімується) */
    body::before {
      content: "";
      position: fixed;
      top: -20vh;
      left: 0;
      right: 0;
      bottom: -20vh;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(135deg, #16425b 0%, #216383 38%, #3f8f97 70%, #71bfbc 100%);
      background-size: 260% 260%;
      animation: aquaGradientFlow 14s ease infinite alternate;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    [data-theme="aqua"] body {
      /* не прозорий — інакше на мить просвітить білий фон браузера */
      background-color: #1f5a74;
    }

    [data-theme="aqua"] body::before {
      opacity: 1;
      /* Без безкінечного переливання: воно змушувало перераховувати розмиття всіх карток щокадру */
      animation: none;
      background-position: 30% 40%;
    }

    /* ===== Aqua: Frosted Glass замість неоморфізму ===== */
    /* Подвійні "опуклі" тіні перетворюються на одну м'яку тінь під склом */
    [data-theme="aqua"] {
      --shadow-light: rgba(255, 255, 255, 0);
      --shadow-dark: rgba(6, 28, 46, 0.22);
      --glass-sheen: linear-gradient(160deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.10) 32%, rgba(255, 255, 255, 0.04) 62%, rgba(255, 255, 255, 0.14) 100%);
      --glass-rim: linear-gradient(155deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.18) 28%, rgba(255, 255, 255, 0.06) 55%, rgba(255, 255, 255, 0.22) 80%, rgba(255, 255, 255, 0.55) 100%);
    }

    /* Оптимізація: розмиття (найдорожча частина) — лише на зовнішніх елементах, один фільтр без saturate/brightness,
       менший радіус; дрібні елементи всередині карток — просто напівпрозорі (розмиття всередині розмиття дуже дороге) */
    [data-theme="aqua"] .link-card,
    [data-theme="aqua"] .theme-toggle,
    [data-theme="aqua"] .username-badge,
    [data-theme="aqua"] .nested-btn:not([class*="is-highlight"]),
    [data-theme="aqua"] .link-icon-box,
    [data-theme="aqua"] .nested-btn-badge {
      background-color: rgba(255, 255, 255, 0.10) !important;
      background-image: var(--glass-sheen);
      border-color: transparent !important;
      outline-color: transparent !important;
    }

    [data-theme="aqua"] .link-card,
    [data-theme="aqua"] .theme-toggle,
    [data-theme="aqua"] .username-badge {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    [data-theme="aqua"] .nested-btn-badge,
    [data-theme="aqua"] .nested-btn:not([class*="is-highlight"]) {
      background-color: rgba(255, 255, 255, 0.14) !important;
    }

    /* Іконка — того ж кольору, що й скло картки (форму дають лише тіні) */
    [data-theme="aqua"] .link-icon-box {
      background-color: transparent !important;
      background-image: none;
    }

    [data-theme="aqua"] .username-badge {
      position: relative;
    }

    /* Світлий обідок по краю скла: яскравий згори-зліва, гасне до середини, відблиск знизу-справа */
    [data-theme="aqua"] .link-card::after,
    [data-theme="aqua"] .theme-toggle::after,
    [data-theme="aqua"] .username-badge::after,
    [data-theme="aqua"] .nested-btn:not([class*="is-highlight"])::after,
    [data-theme="aqua"] .link-icon-box::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.2px;
      background: var(--glass-rim);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      pointer-events: none;
      z-index: 2;
    }

    /* М'яке внутрішнє світіння скла */
    [data-theme="aqua"] .link-card {
      box-shadow:
        0 10px 30px -6px rgba(6, 28, 46, 0.35),
        inset 0 1px 12px rgba(255, 255, 255, 0.10) !important;
    }

    [data-theme="aqua"] .link-card.is-elevated,
    [data-theme="aqua"] .link-card.is-open {
      box-shadow:
        0 16px 38px -8px rgba(6, 28, 46, 0.45),
        inset 0 1px 16px rgba(255, 255, 255, 0.16) !important;
    }

    @media (hover: hover) and (pointer: fine) {
      [data-theme="aqua"] .link-card:hover {
        background-color: rgba(255, 255, 255, 0.14) !important;
      }
    }

    /* Зображення під градієнтом Aqua (35%) */
    .aqua-bg-image {
      position: fixed;
      top: -20vh;
      left: 0;
      right: 0;
      bottom: -20vh;
      z-index: -1;
      pointer-events: none;
      background-position: 62% center;   /* на телефоні в кадр потрапляє стіл з монітором */
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    [data-theme="aqua"] .aqua-bg-image.is-loaded {
      opacity: 0.35;
    }

    /* Прибираємо підкладку навколо логотипу в темі Aqua */
    [data-theme="aqua"] .avatar-wrapper {
      background: transparent !important;
      box-shadow: none !important;
      border-color: transparent !important;
    }

    [data-theme="aqua"] .avatar-inner {
      background: transparent !important;
    }

    /* Підкладка аватарки змінюється в такт з колом і лого */
    .avatar-wrapper,
    .avatar-inner {
      transition:
        background-color 0.7s cubic-bezier(0.25, 1, 0.5, 1),
        border-color 0.7s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.7s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }

    @keyframes aquaGradientFlow {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 80%; }
      100% { background-position: 20% 100%; }
    }

    /* Поки сторінка вантажиться — без переходів кольорів/прозорості (анімації появи працюють як завжди) */
    .is-preload *,
    .is-preload *::before,
    .is-preload *::after {
      transition: none !important;
    }

    /* Числові змінні, які браузер уміє плавно анімувати (глибина іконок) */
    @property --ib-in { syntax: '<number>'; inherits: false; initial-value: 1; }
    @property --ib-out { syntax: '<number>'; inherits: false; initial-value: 0; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Текст на сайті не виділяється — окрім нікнеймів */
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .username-badge,
    .username-badge * {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    body, 
    .theme-toggle, 
    .avatar-wrapper, 
    .avatar-inner, 
    .profile-title, 
    .username-badge, 
    .profile-desc, 
    .link-card, 
    .link-icon-box, 
    .link-icon-masked,
    .link-title, 
    .link-subtitle, 
    .link-arrow, 
    .nested-btn,
    .nested-btn-badge,
    .nested-btn-right,
    .footer {
      transition: 
        color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        outline-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    @media (hover: hover) and (pointer: fine) {
      /* Системний курсор (зокрема "рука" Windows) не показуємо ніде — є свій */
      *, *::before, *::after {
        cursor: none !important;
      }
    }

    #rayCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 6px;
      z-index: 2;
    }

    /* Поява блоків */
    .theme-toggle,
    .avatar-wrapper,
    .profile-title,
    .username-badge,
    .profile-desc,
    .link-item-wrapper,
    .footer {
      opacity: 0;
    }

    .container.ready .theme-toggle {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.05s;
    }

    .container.ready .avatar-wrapper {
      animation: revealZoom 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    .container.ready .profile-title {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.28s;
    }

    .container.ready .username-badge {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.34s + var(--i, 0) * 0.06s);
    }

    .container.ready .profile-desc {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.52s;
    }

    .container.ready .link-item-wrapper {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.58s + var(--i, 0) * 0.07s);
    }

    /* Aqua: скло не розмивається, поки предок напівпрозорий — тому з'являється сама картка,
       а не її обгортка (інакше матовість "вмикається" стрибком наприкінці появи) */
    [data-theme="aqua"] .link-item-wrapper,
    [data-theme="aqua"] .container.ready .link-item-wrapper {
      opacity: 1;
      animation: none;
    }

    [data-theme="aqua"] .link-card {
      opacity: 0;
    }

    [data-theme="aqua"] .container.ready .link-card {
      animation: glassReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.58s + var(--i, 0) * 0.07s);
    }

    /* Після першої появи — анімації вимкнено (інакше зміна теми програє їх знову) */
    .container.intro-done .link-item-wrapper,
    .container.intro-done .link-card {
      opacity: 1 !important;
    }

    .container.intro-done .link-item-wrapper,
    body:not(.is-disco) .container.intro-done .link-card {
      animation: none !important;
      translate: none;
    }

    @keyframes glassReveal {
      from { opacity: 0; translate: 0 22px; }
      to { opacity: 1; translate: 0 0; }
    }

    .container.ready .footer {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.05s;
    }

    /* Після появи знімаємо анімацію, інакше вона "з'їдає" transform
       і ефект натискання (scale) на кнопках не працює */
    .container .is-revealed {
      opacity: 1 !important;
      animation: none !important;
    }

    /* Кнопка зміни теми */
    .theme-toggle {
      position: absolute;
      top: 6px;
      right: 4px;
      z-index: 10;
      background: var(--bg);
      border: 1px solid var(--card-border);
      outline: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 
        5px 5px 12px var(--shadow-dark),
        -5px -5px 12px var(--shadow-light);
      transform: scale(1);
    }

    .theme-toggle:active {
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light) !important;
      transform: scale(0.96);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Аватар */
    .avatar-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: var(--bg);
      padding: 7px;
      box-shadow: 
        8px 8px 20px var(--shadow-dark),
        -8px -8px 20px var(--shadow-light);
      margin-top: 8px;
      margin-bottom: 18px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: none !important;
      will-change: opacity, filter;
    }

    /* Аватар зібраний з двох шарів: бірюзове коло + лого.
       Теми лише плавно міняють прозорість кола і колір лого — без накладання різних картинок. */
    .avatar-bg {
      z-index: 1;
      opacity: 1;
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-mark {
      z-index: 2;
      filter: brightness(1);
      transition: filter 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .avatar-mark { filter: brightness(0.1); }
    }

    :root[data-theme="dark"] .avatar-mark { filter: brightness(0.1); }
    :root[data-theme="aqua"] .avatar-bg { opacity: 0; }

    .avatar-placeholder-svg {
      width: 54px;
      height: 54px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 1.6;
    }

    /* Інфо профілю */
    .profile-info {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      padding: 0 10px;
    }

    /* Для гостей з Telegram: синьою ручкою дописується "дук :)" */
    .profile-title .ink-anchor {
      position: relative;
      display: inline-block;
    }

    .ink-note {
      position: absolute;
      left: 100%;
      top: 50%;
      overflow: visible;
      pointer-events: none;
      transform: translate(1px, -46%) rotate(-5deg);
      transform-origin: left center;
      --ink: #1e4fd8;
    }

    [data-theme="dark"] .ink-note { --ink: #5b86ff; }
    [data-theme="aqua"] .ink-note { --ink: #0b2a9e; }

    .ink-note text {
      font-family: 'Caveat Duk', cursive;
      font-weight: 600;
      fill: var(--ink);
    }

    .ink-note .ink-stroke {
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      visibility: hidden;
      animation: inkStroke var(--d, 200ms) cubic-bezier(0.45, 0.05, 0.4, 1) forwards;
    }

    @keyframes inkStroke {
      from { stroke-dashoffset: 1; visibility: visible; }
      to { stroke-dashoffset: 0; visibility: visible; }
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .usernames-group {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    .username-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tag-text);
      background: var(--tag-bg);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      box-shadow: 
        3px 3px 7px var(--shadow-dark),
        -3px -3px 7px var(--shadow-light);
    }

    .username-badge,
    .theme-toggle {
      transition: 
        transform 0.6s var(--ease-spring),
        box-shadow 0.6s var(--ease-smooth),
        color 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        border-color 0.4s var(--ease-soft);
    }

    .theme-toggle svg {
      transition: transform 0.7s var(--ease-spring);
    }

    @media (hover: hover) and (pointer: fine) {
      .username-badge:hover {
        transform: translateY(-2px);
        box-shadow: 
          5px 6px 12px var(--shadow-dark),
          -4px -4px 10px var(--shadow-light);
      }
      .theme-toggle:hover {
        transform: translateY(-2px);
      }
      .theme-toggle:hover svg {
        transform: rotate(-18deg) scale(1.08);
      }
    }

    .username-badge:active {
      transform: scale(0.96);
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light) !important;
    }

    .profile-desc {
      font-size: 0.94rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--subtext);
      max-width: 360px;
      margin: 0 auto;
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-item-wrapper {
      width: 100%;
    }

    /* ОСНОВНА КНОПКА */
    .link-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 18px;
      border-radius: 36px;
      background: var(--bg);
      text-decoration: none;
      color: inherit;
      position: relative;
      border: 1px solid var(--card-border);
      user-select: none;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);

      transition: 
        transform 0.7s var(--ease-smooth),
        box-shadow 0.7s var(--ease-smooth),
        border-color 0.6s var(--ease-soft),
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    /* Натискання — м'яке "втискання" картки */
    .link-card:not(.is-open):active,
    .link-card.is-open .link-main-row:active .link-icon-box {
      transition-duration: 0.18s;
    }

    .link-card:not(.is-open):active {
      transform: translateY(0) scale(0.985) !important;
      box-shadow: 
        1px 1px 3px var(--shadow-dark),
        -1px -1px 3px var(--shadow-light) !important;
    }

    .link-main-row {
      width: 100%;
      display: flex;
      align-items: center;
      outline: none;
    }

    .link-card:focus-visible,
    .link-main-row:focus-visible,
    .nested-btn:focus-visible,
    .username-badge:focus-visible,
    .theme-toggle:focus-visible,
    .insta-preview-card:focus-visible {
      outline: 2px solid var(--subtext);
      outline-offset: 3px;
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--bg);   /* той самий колір, що й у кнопки — іконка "видавлена" з неї */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      position: relative;
      overflow: hidden;
      transform: translate3d(0, 0, 0) scale(1);

      /* Глибина іконки — дві окремі величини: --ib-in (наскільки втиснута) і --ib-out (наскільки висунута).
         Вони змінюються ПО ЧЕРЗІ: спершу зникає ямка, кнопка стає врівень, і лише тоді з'являється випуклість
         (а при поверненні — навпаки). */
      --ib-in: 1;
      --ib-out: 0;
      box-shadow:
        inset calc(2px * var(--ib-in)) calc(2px * var(--ib-in)) calc(4px * var(--ib-in)) var(--shadow-dark),
        inset calc(-2px * var(--ib-in)) calc(-2px * var(--ib-in)) calc(4px * var(--ib-in)) var(--shadow-light),
        calc(3px * var(--ib-out)) calc(4px * var(--ib-out)) calc(9px * var(--ib-out)) var(--shadow-dark),
        calc(-3px * var(--ib-out)) calc(-3px * var(--ib-out)) calc(8px * var(--ib-out)) var(--shadow-light);
      /* Без збільшення: випуклість дають лише тіні */
      transform: translate3d(0, 0, 0);

      /* Повернення: спершу ховається випуклість, потім проступає ямка */
      transition:
        --ib-out 0.12s cubic-bezier(0.55, 0, 1, 0.45),
        --ib-in 0.14s cubic-bezier(0, 0.55, 0.45, 1) 0.12s,
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    .link-icon-masked {
      width: 24px;
      height: 24px;
      background-color: var(--icon-fill);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      display: block;
      transform: translate3d(0, 0, 0);
      transition: 
        transform 0.8s var(--ease-spring),
        background-color 0.6s var(--ease-soft);
    }

    .link-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .link-subtitle {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--subtext);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 20px;
      height: 20px;
      margin-left: 10px;
      color: var(--subtext);
      opacity: 0.7;
      transition: transform 0.7s var(--ease-spring), opacity 0.5s var(--ease-soft), color 0.6s var(--ease-soft);
      flex-shrink: 0;
    }

    /* Випуклий стан на телефоні під час гортання */
    .link-card.is-elevated {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        9px 11px 24px var(--shadow-dark),
        -9px -11px 24px var(--shadow-light);
    }

    .link-card.is-elevated .link-icon-masked {
      transform: scale(1.08) rotate(-6deg);
    }

    .link-card.is-elevated .link-icon-box {
      --ib-in: 0;
      --ib-out: 1;
      /* Виринання: спершу зникає ямка, потім з'являється випуклість */
      transition:
        --ib-in 0.12s cubic-bezier(0.55, 0, 1, 0.45),
        --ib-out 0.14s cubic-bezier(0, 0.55, 0.45, 1) 0.12s,
        background-color 0.6s var(--ease-soft);
    }

    .link-card.is-elevated .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .link-card.is-elevated .link-subtitle {
      color: var(--text);
    }

    /* Hover на ПК */
    @media (hover: hover) and (pointer: fine) {
      .link-card:not(.is-open):hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 
          8px 10px 22px var(--shadow-dark),
          -8px -10px 22px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-icon-masked {
        transform: scale(1.1) rotate(-7deg);
      }
      .link-card:hover .link-subtitle {
        color: var(--text);
      }
      .link-card:not(.is-open):hover .link-icon-box {
        --ib-in: 0;
        --ib-out: 1;
        transition:
          --ib-in 0.12s cubic-bezier(0.55, 0, 1, 0.45),
          --ib-out 0.14s cubic-bezier(0, 0.55, 0.45, 1) 0.12s,
          background-color 0.6s var(--ease-soft);
      }
      .link-card:not(.is-open):hover .link-arrow {
        opacity: 1;
        transform: translateX(3px);
      }
    }

    /* Стан розкритої кнопки */
    .link-card.is-open {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 
        7px 9px 20px var(--shadow-dark),
        -7px -9px 20px var(--shadow-light);
      transform: translateY(-1px);
    }


    .link-card.is-open .link-arrow {
      transform: rotate(180deg) !important;
      opacity: 1;
    }

    /* ВНУТРІШНІЙ БЛОК */
    .inner-tray {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.6s var(--ease-smooth);
      width: 100%;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: grid-template-rows;
    }

    .link-card.is-open .inner-tray {
      grid-template-rows: 1fr;
    }

    .inner-tray-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 10px;
      transition: padding-top 0.6s var(--ease-smooth), padding-bottom 0.6s var(--ease-smooth);
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .link-card.is-open .inner-tray-content {
      padding: 14px 10px 14px;
    }

    /* Кнопки не стискаються, поки картка розкривається (інакше підсвічена з overflow:hidden сплющується) */
    .inner-tray-content > * {
      flex-shrink: 0;
    }

    /* МЕНШІ КНОПКИ */
    .nested-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 20px;
      background-color: var(--sub-card-bg);
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transform: translate3d(0, -10px, 0);
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      box-shadow: 
        2px 2px 5px var(--shadow-dark),
        -2px -2px 5px var(--shadow-light);

      opacity: 0;
      transition: 
        transform 0.55s var(--ease-smooth),
        opacity 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        outline-color 0.4s var(--ease-soft),
        box-shadow 0.5s var(--ease-smooth) !important;
    }

    .link-card.is-open .nested-btn {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition-delay: calc(0.06s + var(--n, 0) * 0.06s), calc(0.06s + var(--n, 0) * 0.06s), 0s, 0s, 0s !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover {
        transform: translate3d(0, -2px, 0) !important;
        transition-delay: 0s !important;
        background-color: var(--sub-card-hover) !important;
        outline-color: rgba(255, 255, 255, 0.45);
        box-shadow: 
          3px 4px 10px var(--shadow-dark),
          -3px -4px 10px var(--shadow-light) !important;
      }
      .nested-btn:hover .nested-btn-right {
        color: var(--text);
      }
      .nested-btn:hover .nested-btn-badge {
        outline-color: rgba(255, 255, 255, 0.5);
      }
    }

    .nested-btn:active {
      transform: translate3d(0, 0, 0) scale(0.98) !important;
      outline-color: var(--card-border);
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light) !important;
      transition: transform 0.15s var(--ease-soft), box-shadow 0.15s var(--ease-soft) !important;
    }

    .nested-action-icon {
      transition: transform 0.5s var(--ease-spring), stroke 0.3s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover .nested-action-icon {
        transform: translate(2px, -2px);
      }
    }

    .nested-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nested-btn-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
      background-color: var(--tag-bg);
      color: var(--subtext);
      font-weight: 500;
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      transition: outline-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }

    /* Плашка "Нове відео" */
    .link-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .new-pill {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 10px;
      background-color: #e5322d;
      color: #ffffff;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35);
      transition: opacity 0.4s var(--ease-soft), transform 0.6s var(--ease-spring);
      animation: pillGlow 2.6s var(--ease-soft) infinite;
    }

    @keyframes pillGlow {
      0%, 100% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 0 rgba(229, 50, 45, 0.35); }
      50% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 5px rgba(229, 50, 45, 0); }
    }

    .link-card .nested-btn .new-pill {
      transform: scale(0.6);
      opacity: 0;
    }

    .link-card.is-open .nested-btn .new-pill {
      transform: scale(1);
      opacity: 1;
      transition-delay: 0.25s;
    }

    /* Всередині — стікер у куті кнопки, щоб не ламати рядок */
    .nested-btn {
      position: relative;
    }

    .nested-btn .new-pill {
      position: absolute;
      top: -7px;
      right: 14px;
      font-size: 0.64rem;
      padding: 3px 7px;
    }

    /* Фіолетова плашка (SongRate) — градієнт, що переливається */
    .new-pill.is-purple {
      background: linear-gradient(120deg, #7e22ce, #4338ca, #a21caf, #7e22ce);
      background-size: 300% 100%;
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.45);
      animation: purpleFlow 4s linear infinite, purpleGlow 2.6s var(--ease-soft) infinite;
    }

    @keyframes purpleFlow {
      to { background-position: 300% 0; }
    }

    @keyframes purpleGlow {
      0%, 100% { box-shadow: 0 2px 10px rgba(168, 85, 247, 0.45), 0 0 0 0 rgba(168, 85, 247, 0.4); }
      50% { box-shadow: 0 2px 10px rgba(168, 85, 247, 0.45), 0 0 0 5px rgba(168, 85, 247, 0); }
    }

    /* Підсвічена кнопка у відкритій картці (SongRate — фіолетова, Основний канал — червона).
       Світіння компактне, щоб уміщалося у відступи картки і не обрізалось. */
    .nested-btn.is-highlight-purple {
      --hl-1: rgba(107, 33, 168, 0.88);
      --hl-2: rgba(55, 48, 163, 0.86);
      --hl-3: rgba(134, 25, 143, 0.88);
      --hl-line: rgba(192, 132, 252, 0.8);
      --hl-glow: rgba(168, 85, 247, 0.7);
    }

    .nested-btn.is-highlight-red {
      --hl-1: rgba(153, 27, 27, 0.88);
      --hl-2: rgba(159, 18, 57, 0.86);
      --hl-3: rgba(154, 52, 18, 0.88);
      --hl-line: rgba(252, 165, 165, 0.8);
      --hl-glow: rgba(239, 68, 68, 0.7);
    }

    .nested-btn.is-highlight-purple,
    .nested-btn.is-highlight-red {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    .nested-btn.is-highlight-purple::before,
    .nested-btn.is-highlight-red::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(120deg, var(--hl-1), var(--hl-2), var(--hl-3), var(--hl-1));
      background-size: 300% 100%;
      opacity: 0;
      /* З'являється разом з самою кнопкою (та сама затримка і тривалість), а не окремим кроком */
      transition: opacity 0.55s var(--ease-smooth);
      animation: purpleFlow 5s linear infinite;
    }

    .link-card.is-open .nested-btn.is-highlight-purple::before,
    .link-card.is-open .nested-btn.is-highlight-red::before {
      transition-delay: calc(0.06s + var(--n, 0) * 0.06s);
    }

    .link-card.is-open .nested-btn.is-highlight-purple::before,
    .link-card.is-open .nested-btn.is-highlight-red::before {
      opacity: 1;
    }

    .link-card.is-open .nested-btn.is-highlight-purple,
    .link-card.is-open .nested-btn.is-highlight-red {
      outline-color: var(--hl-line) !important;
      color: #fff;
      animation: hlGlow 2.8s var(--ease-soft) 0.6s infinite;
    }

    .link-card.is-open .nested-btn.is-highlight-purple .nested-btn-badge,
    .link-card.is-open .nested-btn.is-highlight-red .nested-btn-badge {
      background-color: rgba(255, 255, 255, 0.18);
      color: #fff;
      outline-color: rgba(255, 255, 255, 0.35);
    }

    .link-card.is-open .nested-btn.is-highlight-purple .nested-btn-right,
    .link-card.is-open .nested-btn.is-highlight-red .nested-btn-right {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Зовнішнє сяйво не ширше ~8px (вміщається у відступ), плюс внутрішнє */
    @keyframes hlGlow {
      0%, 100% { box-shadow: 0 0 6px -1px var(--hl-glow), inset 0 0 10px rgba(255, 255, 255, 0.06); }
      50% { box-shadow: 0 0 10px 0 var(--hl-glow), inset 0 0 18px rgba(255, 255, 255, 0.16); }
    }

    /* На закритій картці плашка видна, при відкритті переїжджає всередину */
    .link-card.is-open .link-main-row .new-pill {
      opacity: 0;
      transform: scale(0.85);
    }

    .nested-btn-right {
      font-size: 0.78rem;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s ease;
    }

    .nested-action-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* Стан скопійовано */
    .nested-btn.copied {
      background-color: var(--copied-bg) !important;
      color: var(--copied-text) !important;
      outline-color: transparent !important;
      box-shadow: 2px 2px 6px var(--shadow-dark) !important;
    }

    .nested-btn.copied .nested-btn-badge {
      background-color: var(--copied-badge-bg) !important;
      color: #ffffff !important;
      outline-color: rgba(255, 255, 255, 0.3) !important;
    }

    .nested-btn.copied .nested-btn-right {
      color: #ffffff !important;
    }

    .nested-btn.copied .nested-action-icon {
      stroke: #ffffff !important;
    }

    /* Галерея Instagram: без обрізання тіней та підйому */
    .insta-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      padding: 4px 6px 8px; /* Запас для вільного розсіювання тіней */
      box-sizing: border-box;
    }

    .insta-preview-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--sub-card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);
      display: block;
      text-decoration: none;
      transform: translate3d(0, -6px, 0);
      opacity: 0;
      transition: 
        transform 0.6s var(--ease-smooth),
        box-shadow 0.6s var(--ease-smooth),
        border-color 0.5s var(--ease-soft),
        opacity 0.45s var(--ease-soft);
    }

    .link-card.is-open .insta-preview-card {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .link-card.is-open .insta-preview-card:nth-child(1) { transition-delay: 0.06s; }
    .link-card.is-open .insta-preview-card:nth-child(2) { transition-delay: 0.12s; }
    .link-card.is-open .insta-preview-card:nth-child(3) { transition-delay: 0.18s; }
    .link-card.is-open .insta-preview-card:hover { transition-delay: 0s; }

    .insta-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s var(--ease-smooth);
      color-interpolation-filters: sRGB;
    }

    @media (hover: hover) and (pointer: fine) {
      .insta-preview-card:hover {
        transform: translate3d(0, -2px, 0) !important;
        border-color: rgba(255, 255, 255, 0.5) !important;
        box-shadow: 
          3px 5px 12px var(--shadow-dark),
          -3px -5px 12px var(--shadow-light) !important;
      }
      .insta-preview-card:hover .insta-preview-img {
        transform: scale(1.08);
      }
    }

    .insta-profile-btn {
      width: 100%;
      margin-top: 2px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--subtext);
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ПАСХАЛКА: потягни пальцем угору в самому низу сторінки */
    .easter-spacer {
      width: 100%;
      min-height: 45vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      user-select: none;
    }

    /* Ледь помітна стрілочка-підказка без тексту */
    .easter-chevron {
      width: 22px;
      height: 22px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.4;
      animation: chevronNudge 2.4s var(--ease-soft) infinite;
    }

    @keyframes chevronNudge {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Кільце прогресу — фіксоване, тож сторінка під ним не смикається */
    .pull-ring {
      position: fixed;
      left: 50%;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      width: 68px;
      height: 68px;
      margin-left: -34px;
      border-radius: 50%;
      background: var(--egg-surface);
      box-shadow: 
        5px 5px 14px var(--shadow-dark),
        -5px -5px 14px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform: translateY(30px) scale(0.6);
      transition: opacity 0.35s var(--ease-soft), transform 0.5s var(--ease-spring);
    }

    .pull-ring.is-dragging {
      transition: none;
    }

    .pull-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .pull-ring-track {
      fill: none;
      stroke: var(--subtext);
      stroke-width: 2.2;
      stroke-dasharray: 3 5;
      stroke-linecap: round;
      opacity: 0.55;
    }

    .pull-ring-fill {
      fill: none;
      stroke: var(--text);
      stroke-width: 3.2;
      stroke-linecap: round;
    }

    .pull-ring-arrow {
      width: 22px;
      height: 22px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
    }

    .pull-ring.is-done {
      animation: ringPop 0.45s var(--ease-spring) forwards;
    }

    @keyframes ringPop {
      0%   { opacity: 1; transform: scale(1); }
      40%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(0.4); }
    }

    /* Шар з картинкою поверх сторінки */
    .easter-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease-soft), visibility 0s linear 0.35s;
    }

    .easter-overlay.is-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s var(--ease-soft), visibility 0s;
    }

    .easter-overlay {
      flex-direction: column;
      gap: 22px;
    }

    /* Бульбашка з фразою з тг-каналу */
    .easter-quote {
      position: relative;
      max-width: min(420px, 100%);
      min-height: 1px;
      padding: 12px 18px;
      border-radius: 22px;
      background: var(--egg-surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
      border: 1px solid var(--card-border);
      box-shadow: 
        6px 8px 20px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      opacity: 0;
      transform: translateY(14px) scale(0.6);
      transform-origin: 50% 100%;
      transition: opacity 0.25s var(--ease-soft), transform 0.3s var(--ease-smooth);
      pointer-events: none;
      z-index: 3;
    }

    [data-theme="aqua"] .easter-quote,
    [data-theme="aqua"] .egg3d-toggle,
    [data-theme="aqua"] .egg-trophies-card,
    [data-theme="aqua"] .egg-toast {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Хвостик бульбашки */
    .easter-quote::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      background: var(--egg-surface);
      border-right: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      transform: rotate(45deg);
      border-bottom-right-radius: 4px;
    }

    .easter-quote.is-shown {
      opacity: 1;
      animation: quotePop 0.55s var(--ease-spring) both;
    }

    @keyframes quotePop {
      0%   { opacity: 0; transform: translateY(14px) scale(0.5, 0.3); }
      45%  { opacity: 1; transform: translateY(-4px) scale(1.12, 0.9); }
      70%  { transform: translateY(0) scale(0.95, 1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 3D-РЕЖИМ ПАСХАЛКИ ===== */
    /* 3D-режим (WebGL): полотно на весь екран під фразою та кнопкою */
    .egg3d-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      touch-action: none;
      transition: opacity 0.3s var(--ease-soft), visibility 0s linear 0.3s;
    }

    .easter-overlay.is-3d .egg3d-canvas {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s var(--ease-soft), visibility 0s;
    }

    .easter-overlay.is-3d .easter-bounce {
      visibility: hidden;
    }

    .egg3d-toggle.is-loading svg {
      animation: eggSpin 0.8s linear infinite;
    }

    @keyframes eggSpin {
      to { transform: rotate(360deg); }
    }

    .egg3d-toggle {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--egg-surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 
        5px 5px 14px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      transition: transform 0.5s var(--ease-spring), box-shadow 0.4s var(--ease-smooth), background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
    }

    .egg3d-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.8s var(--ease-spring);
    }

    .egg3d-toggle[aria-pressed="true"] {
      background: var(--egg-pressed-bg);
      color: var(--egg-pressed-fg);
    }

    #egg3dToggle[aria-pressed="true"] svg {
      transform: rotate(180deg);
    }

    .egg3d-toggle:active {
      transform: scale(0.94);
    }

    .easter-bounce {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      opacity: 0;
      transform-origin: 50% 100%;
    }

    /* Смішна поява: вилітає, розплющується, витягується і трясеться як желе */
    .easter-overlay.is-open .easter-bounce {
      opacity: 1;
      animation: easterBoing 1.4s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    @keyframes easterBoing {
      0%   { opacity: 0; transform: translateY(120px) scale(0.3, 1.6); }
      22%  { opacity: 1; transform: translateY(-30px) scale(0.75, 1.35); }
      36%  { transform: translateY(0) scale(1.45, 0.55); }
      50%  { transform: translateY(-12px) scale(0.8, 1.25); }
      63%  { transform: translateY(0) scale(1.18, 0.86); }
      75%  { transform: scale(0.93, 1.08) rotate(-2deg); }
      86%  { transform: scale(1.04, 0.97) rotate(1.5deg); }
      100% { opacity: 1; transform: scale(1, 1) rotate(0); }
    }

    .easter-img {
      touch-action: none;
      will-change: transform;
      -webkit-user-drag: none;
      user-select: none;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 
        8px 10px 22px var(--shadow-dark),
        -8px -10px 22px var(--shadow-light);
    }

    /* ===== РОЗВАГИ ПАСХАЛКИ ===== */
    .easter-puff,
    .easter-fly {
      transform-origin: 50% 50%;
    }

    .easter-fly {
      will-change: transform;
    }

    /* Під час польоту картка над кнопками і фразою */
    .easter-overlay.is-throwing .easter-bounce {
      z-index: 4;
    }

    /* Надування: дрижить сильніше з кожним рівнем */
    .easter-puff.is-inflating {
      animation: puffTremble 0.12s linear infinite;
      transition: scale 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), filter 0.25s ease;
    }

    .easter-puff {
      transition: scale 0.5s var(--ease-spring), filter 0.5s ease;
    }

    @keyframes puffTremble {
      0%   { translate: 0 0; }
      25%  { translate: var(--amp, 0px) calc(var(--amp, 0px) * -0.6); }
      50%  { translate: calc(var(--amp, 0px) * -1) calc(var(--amp, 0px) * 0.8); }
      75%  { translate: calc(var(--amp, 0px) * 0.7) var(--amp, 0px); }
      100% { translate: 0 0; }
    }

    .easter-puff.is-popping {
      animation: puffPop 0.32s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    @keyframes puffPop {
      0%   { scale: var(--s, 1.8); opacity: 1; }
      35%  { scale: calc(var(--s, 1.8) * 1.22); opacity: 1; }
      100% { scale: 0.05; opacity: 0; }
    }

    .easter-puff.is-reforming {
      animation: puffReform 0.9s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    @keyframes puffReform {
      0%   { scale: 0.1; opacity: 0; }
      35%  { scale: 1.25 0.75; opacity: 1; }
      55%  { scale: 0.85 1.18; }
      75%  { scale: 1.07 0.94; }
      100% { scale: 1; opacity: 1; }
    }

    /* Спалах вибуху */
    .egg-flash {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 245, 200, 0.95), rgba(255, 150, 40, 0.55) 35%, rgba(255, 60, 0, 0) 70%);
    }

    .egg-flash.is-boom {
      animation: eggFlash 0.7s ease-out forwards;
    }

    @keyframes eggFlash {
      0% { opacity: 0; scale: 0.4; }
      12% { opacity: 1; scale: 1.1; }
      100% { opacity: 0; scale: 1.6; }
    }

    /* Струс екрана від вибуху */
    .easter-overlay.is-boom {
      animation: eggBoomShake 0.55s linear;
    }

    @keyframes eggBoomShake {
      0%, 100% { translate: 0 0; }
      10% { translate: -14px 8px; }
      20% { translate: 12px -10px; }
      30% { translate: -10px -6px; }
      40% { translate: 9px 9px; }
      55% { translate: -6px 4px; }
      70% { translate: 4px -3px; }
      85% { translate: -2px 2px; }
    }

    /* Кнопка "Кидання" вимкнена в 3D */
    .easter-overlay.is-3d .egg-launch {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Секрет: глітч-режим */
    body.is-glitch .container {
      animation: glitchJitter 0.12s steps(2) infinite;
    }

    body.is-glitch .profile-title,
    body.is-glitch .link-title {
      text-shadow: 2px 0 #ff2d6f, -2px 0 #22e1ff;
    }

    body.is-glitch {
      animation: glitchHue 0.6s steps(3) infinite;
    }

    @keyframes glitchJitter {
      0% { translate: 0 0; }
      50% { translate: -3px 1px; }
      100% { translate: 2px -1px; }
    }

    @keyframes glitchHue {
      0% { filter: none; }
      33% { filter: hue-rotate(90deg) saturate(1.6); }
      66% { filter: invert(0.08) hue-rotate(-60deg); }
      100% { filter: none; }
    }

    /* Секрет: дискотека */
    body.is-disco .link-card {
      animation: discoCard 0.5s ease-in-out infinite alternate;
    }

    body.is-disco .link-item-wrapper:nth-child(odd) .link-card {
      animation-delay: 0.25s;
    }

    /* Фільтр не на body: інакше "приклеєні" до екрана фон і фото Aqua починають їздити разом зі сторінкою */
    :root:not([data-theme="aqua"]) body.is-disco #mainContainer,   /* в Aqua фільтр на вмісті вимкнув би скло */
    body.is-disco::before,
    body.is-disco .aqua-bg-image {
      animation: discoBg 1.2s linear infinite;
    }

    @keyframes discoCard {
      from { translate: 0 0; rotate: -1.5deg; box-shadow: 0 0 22px #ff3bd4; }
      to { translate: 0 -6px; rotate: 1.5deg; box-shadow: 0 0 22px #3bf0ff; }
    }

    @keyframes discoBg {
      from { filter: hue-rotate(0deg) saturate(1.4); }
      to { filter: hue-rotate(360deg) saturate(1.4); }
    }

    /* Кнопка виходу з пасхалки (справа зверху) */
    .egg-close {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 7;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
      background: var(--egg-surface);
      color: var(--text);
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.35), -3px -3px 10px var(--shadow-light);
      transition: transform 0.5s var(--ease-spring), box-shadow 0.4s var(--ease-smooth);
    }

    [data-theme="aqua"] .egg-close {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .egg-close svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      transition: transform 0.6s var(--ease-spring);
    }

    .egg-close:active {
      transform: scale(0.9);
    }

    @media (hover: hover) and (pointer: fine) {
      .egg-close:hover svg {
        transform: rotate(90deg);
      }
    }

    /* Кнопки під картинкою */
    /* Кнопки і лічильник — внизу екрана */
    .egg-actions {
      position: fixed;
      left: 50%;
      bottom: calc(46px + env(safe-area-inset-bottom, 0px));
      translate: -50% 0;
      z-index: 3;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: max-content;
      max-width: calc(100vw - 24px);
    }

    .egg-trophy-btn.is-bump {
      animation: trophyBump 0.6s var(--ease-spring);
    }

    @keyframes trophyBump {
      0% { scale: 1; }
      30% { scale: 1.3; rotate: -8deg; }
      60% { scale: 0.95; rotate: 4deg; }
      100% { scale: 1; rotate: 0deg; }
    }

    /* Лічильник для всіх відвідувачів */
    .egg-counter {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 3;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .egg-counter b {
      display: inline-block;
      color: #ffe14d;
      font-variant-numeric: tabular-nums;
    }

    .egg-counter b.is-bump {
      animation: trophyBump 0.45s var(--ease-spring);
    }

    /* Список досягнень */
    .egg-trophies {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: rgba(0, 0, 0, 0.35);
    }

    .egg-trophies[hidden] {
      display: none;
    }

    .egg-trophies-card {
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      background: var(--egg-surface);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: quotePop 0.5s var(--ease-spring) both;
    }

    .egg-trophies-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 10px;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .egg-trophies-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--sub-card-bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .egg-trophies-list {
      overflow-y: auto;
      padding: 4px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .egg-trophy {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--sub-card-bg);
      border: 1px solid var(--card-border);
    }

    /* Значок досягнення — золотий кружечок з векторною іконкою */
    .egg-trophy-emoji,
    .egg-toast-emoji {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
