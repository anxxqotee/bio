    syncTheme();

    // 4. Анімація за скролом (мобільні): картка стає випуклою лише під час гортання.
    //    Угорі сторінки активна перша картка, далі — по черзі до останньої.
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (isTouchDevice) {
      const cards = Array.from(document.querySelectorAll('.link-card'));
      let ticking = false;

      const docCenter = (el) => {
        const r = el.getBoundingClientRect();
        return r.top + (window.scrollY || window.pageYOffset) + r.height / 2;
      };

      function updateActiveCardOnScroll() {
        ticking = false;
        if (cards.length === 0) return;
        const scrollY = window.scrollY || window.pageYOffset;
        const first = docCenter(cards[0]);
        const last = docCenter(cards[cards.length - 1]);

        // Скільки треба прогорнути, щоб остання картка дійшла до центру екрана
        const range = Math.max(last - window.innerHeight / 2, 1);
        const progress = Math.min(Math.max(scrollY / range, 0), 1);
        const focus = first + (last - first) * progress;

        let activeIndex = -1;
        let bestDist = Infinity;
        cards.forEach((card, idx) => {
          const dist = Math.abs(docCenter(card) - focus);
          if (dist < bestDist) { bestDist = dist; activeIndex = idx; }
        });

        // Картки вже за верхнім краєм (гортаємо до пасхалки) — нічого не піднімаємо
        const lastRect = cards[cards.length - 1].getBoundingClientRect();
        if (lastRect.bottom < 0) activeIndex = -1;

        cards.forEach((card, idx) => {
          card.classList.toggle('is-elevated', idx === activeIndex && !card.classList.contains('is-open'));
        });
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(updateActiveCardOnScroll);
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', updateActiveCardOnScroll);
      setTimeout(updateActiveCardOnScroll, 350);
    }

    // 4.0 Хаптика (тактильний відгук)
    //  - Android (Chrome, Samsung, Opera): navigator.vibrate з візерунками;
    //  - iPhone (iOS 18+): Safari дає системний "тап" Taptic Engine, коли клікаєш
    //    по перемикачу <input type="checkbox" switch>. Працює лише у відповідь на
    //    дотик (pointerdown / pointerup / touchend), тому найкраще — у ці моменти.
    const Haptics = (() => {
      const canVibrate = typeof navigator.vibrate === 'function';
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let label = null;

      if (isIOS && !canVibrate) {
        label = document.createElement('label');
        label.setAttribute('aria-hidden', 'true');
        label.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');
        input.tabIndex = -1;
        label.appendChild(input);
        document.body.appendChild(label);
      }

      const iosTap = () => { if (label) { try { label.click(); } catch (e) {} } };
      const vibrate = (p) => { if (canVibrate) { try { navigator.vibrate(p); } catch (e) {} } };

      return {
        // Один короткий "тік"
        tick(ms = 8) {
          if (canVibrate) vibrate(ms); else iosTap();
        },
        // Лише для iPhone (на Android не перебиваємо вже запущену вібрацію)
        ios(p) {
          if (canVibrate || !label) return;
          this.pattern(p);
        },
        // Візерунок [вібро, пауза, вібро, ...] в мілісекундах
        pattern(p) {
          if (canVibrate) { vibrate(p); return; }
          if (!label) return;
          let t = 0;
          p.forEach((d, i) => {
            if (i % 2 === 0) setTimeout(iosTap, t);
            t += d;
          });
        }
      };
    })();

    // 4.1 Пасхалка: в самому низу тягнеш пальцем угору (або крутиш колесо далі) —
    //     пунктирне кільце плавно заповнюється, а коли повне — вилітає картинка.
    (() => {
      const ring = document.getElementById('pullRing');
      const fill = document.getElementById('pullRingFill');
      const arrow = document.getElementById('pullRingArrow');
      const overlay = document.getElementById('easterOverlay');
      if (!ring || !fill || !overlay) return;

      const PULL_DISTANCE = 160;          // скільки пікселів тягнути пальцем
      const CIRCUMFERENCE = 2 * Math.PI * 29;
      fill.style.strokeDasharray = CIRCUMFERENCE;
      fill.style.strokeDashoffset = CIRCUMFERENCE;

      let progress = 0;
      let pullStartY = null;
      let done = false;

      const atBottom = () =>
        window.innerHeight + (window.scrollY || window.pageYOffset) >= document.documentElement.scrollHeight - 4;

      function render(p, dragging) {
        progress = p;
        ring.classList.toggle('is-dragging', !!dragging);
        fill.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);
        ring.style.opacity = p > 0 ? Math.min(1, p * 4) : 0;
        ring.style.transform = p > 0
          ? `translateY(${(1 - p) * 20}px) scale(${0.75 + p * 0.25})`
          : '';
        if (arrow) arrow.style.transform = `translateY(${-p * 4}px)`;
      }

      function reset() {
        pullStartY = null;
        if (!done) render(0, false);
      }

      function openEgg() {
        done = true;
        pullStartY = null;
        ring.classList.remove('is-dragging');
        ring.style.opacity = '';
        ring.style.transform = '';
        ring.classList.add('is-done');
        openedThisTouch = true;
        Haptics.pattern([18, 45, 35]);
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        if (window.EggFun) { window.EggFun.stat('opens'); window.EggFun.onOpen(); }
      }

      function closeEgg() {
        if (window.EggFun) window.EggFun.onClose();
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        ring.classList.remove('is-done');
        done = false;
        render(0, false);
      }

      // Закриваємо тапом по фону (не по картинці — її можна тягати)
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay && !(window.EggFun && window.EggFun.busy())) closeEgg();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeEgg();
      });

      // --- Палець ---
      document.addEventListener('touchstart', (e) => {
        if (done || e.touches.length !== 1) return;
        pullStartY = atBottom() ? e.touches[0].clientY : null;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (done || e.touches.length !== 1) return;
        const y = e.touches[0].clientY;
        if (pullStartY === null) {
          if (atBottom()) pullStartY = y; // догорнули до низу посеред жесту
          return;
        }
        const dy = pullStartY - y; // > 0, коли палець іде вгору
        if (dy <= 0) { render(0, true); return; }
        // Блокуємо прокрутку й "гумку" браузера, щоб нічого не смикалось
        if (e.cancelable) e.preventDefault();
        const p = Math.min(dy / PULL_DISTANCE, 1);
        render(p, true);
        if (p >= 1) openEgg();
      }, { passive: false });

      // На iPhone тактильний відгук можливий лише в touchend — "клацаємо" тут
      let openedThisTouch = false;
      document.addEventListener('touchend', () => {
        if (openedThisTouch) {
          openedThisTouch = false;
          Haptics.ios([1, 70, 1]);
          // iPhone: дозвіл на датчик руху (для струшування) — лише у відповідь на дотик
          if (window.EggFun) window.EggFun.askMotion();
        }
        reset();
      }, { passive: true });
      document.addEventListener('touchcancel', reset, { passive: true });

      // --- Колесо миші на ПК ---
      let wheelTimer = null;
      window.addEventListener('wheel', (e) => {
        if (done || e.deltaY <= 0 || !atBottom()) return;
        render(Math.min(progress + e.deltaY / 900, 1), true);
        if (progress >= 1) { openEgg(); return; }
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => render(0, false), 500);
      }, { passive: true });
    })();

    // Швидкість пальця за останні ~80 мс руху (для кидків по інерції)
    const makeVelTracker = () => {
      let hist = [];
      return {
        reset() { hist = []; },
        push(x, y) {
          const t = performance.now();
          hist.push([t, x, y]);
          while (hist.length > 2 && t - hist[0][0] > 120) hist.shift();
        },
        // Повертає {x, y} px/с; якщо палець зупинився перед відпусканням — нуль
        get() {
          const now = performance.now();
          if (hist.length < 2 || now - hist[hist.length - 1][0] > 100) return { x: 0, y: 0 };
          const last = hist[hist.length - 1];
          let first = hist[0];
          for (const h of hist) { if (last[0] - h[0] <= 80) { first = h; break; } }
          const dt = Math.max((last[0] - first[0]) / 1000, 0.008);
          return { x: (last[1] - first[1]) / dt, y: (last[2] - first[2]) / dt };
        }
      };
    };

    // 4.2 Желейна картинка: хапаєш пальцем — тягнеш — розтягується, відпускаєш — пружинить
    (() => {
      const img = document.querySelector('.easter-img');
      if (!img) return;

      const STIFFNESS = 260;   // пружність (чим більше — тим швидше повертається)
      const DAMPING = 9;       // гасіння (чим менше — тим довше трясеться)
      const MAX_PULL = 260;    // максимальний зсув, далі "впирається"

      let pos = { x: 0, y: 0 };   // поточна деформація
      let vel = { x: 0, y: 0 };
      let dragging = false;
      let grab = null;            // точка, де схопили (відносно центру, -1..1)
      let start = null;
      let rafId = null;
      let lastT = 0;
      let detent = 0;
      let lastDetent = 0;
      let fv = { x: 0, y: 0 };       // швидкість пальця, px/с
      let lastMove = null;
      let holdStart = 0;             // секрет: тримати розтягнутою до упору
      const tracker = makeVelTracker();

      // Еластичний "упор": чим далі тягнеш, тим важче
      const soften = (v) => Math.sign(v) * MAX_PULL * (1 - Math.exp(-Math.abs(v) / MAX_PULL));

      function apply() {
        const { x, y } = pos;
        const len = Math.hypot(x, y);
        if (len < 0.05) {
          img.style.transform = '';
          return;
        }
        const angle = Math.atan2(y, x) * 180 / Math.PI;
        const stretch = 1 + len / 220;               // тягнемо вздовж руху пальця
        const squeeze = 1 / Math.sqrt(stretch);      // і стискаємо впоперек (як гума)
        img.style.transform =
          `translate(${x * 0.35}px, ${y * 0.35}px) rotate(${angle}deg) scale(${stretch}, ${squeeze}) rotate(${-angle}deg)`;
      }

      function step(t) {
        const dt = Math.min((t - lastT) / 1000, 0.032);
        lastT = t;
        // Пружина: a = -k*x - c*v
        vel.x += (-STIFFNESS * pos.x - DAMPING * vel.x) * dt;
        vel.y += (-STIFFNESS * pos.y - DAMPING * vel.y) * dt;
        pos.x += vel.x * dt;
        pos.y += vel.y * dt;
        apply();
        if (Math.hypot(pos.x, pos.y) < 0.1 && Math.hypot(vel.x, vel.y) < 0.5) {
          pos = { x: 0, y: 0 };
          vel = { x: 0, y: 0 };
          apply();
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(step);
      }

      const is3D = () => document.getElementById('easterOverlay').classList.contains('is-3d');

      // Струс телефона — желе отримує поштовх
      window.__jellyKick = (kx, ky) => {
        if (dragging) return;
        vel.x += kx;
        vel.y += ky;
        if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(step); }
      };

      img.addEventListener('pointerdown', (e) => {
        if (is3D()) return; // у 3D-режимі картку крутять, а не розтягують
        e.preventDefault();
        // Режим "Політ" — картку носять і жбурляють (це робить EggFun)
        if (window.EggFun && window.EggFun.isFree()) return;
        // Картка лускає — не чіпаємо
        if (window.EggFun && window.EggFun.busy()) return;
        if (window.EggFun && window.EggFun.tap()) return; // надування з'їло дотик
        dragging = true;
        fv = { x: 0, y: 0 };
        tracker.reset();
        tracker.push(e.clientX, e.clientY);
        lastMove = { x: e.clientX, y: e.clientY, t: performance.now() };
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        const r = img.getBoundingClientRect();
        grab = {
          x: ((e.clientX - r.left) / r.width) * 2 - 1,
          y: ((e.clientY - r.top) / r.height) * 2 - 1
        };
        // Тягнемо від протилежного боку — він ніби "прибитий", а схоплений тягнеться
        img.style.transformOrigin = `${50 - grab.x * 50}% ${50 - grab.y * 50}%`;
        start = { x: e.clientX - pos.x, y: e.clientY - pos.y };
        vel = { x: 0, y: 0 };
        img.style.cursor = 'grabbing';
        try { img.setPointerCapture(e.pointerId); } catch (err) {}
        if (window.easterQuote) window.easterQuote();
        detent = 0;
        Haptics.tick(10);
        if (window.easterSound) window.easterSound.grab();
      });

      img.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const tNow = performance.now();
        if (lastMove) {
          const dtm = Math.max((tNow - lastMove.t) / 1000, 0.004);
          fv.x = fv.x * 0.5 + ((e.clientX - lastMove.x) / dtm) * 0.5;
          fv.y = fv.y * 0.5 + ((e.clientY - lastMove.y) / dtm) * 0.5;
        }
        lastMove = { x: e.clientX, y: e.clientY, t: tNow };
        tracker.push(e.clientX, e.clientY);
        const nx = soften(e.clientX - start.x);
        const ny = soften(e.clientY - start.y);
        // Швидкість потрібна, щоб відпущена картинка "відстрілювала" природно
        vel = { x: (nx - pos.x) * 60, y: (ny - pos.y) * 60 };
        pos = { x: nx, y: ny };
        apply();
        // "Клацання" при розтягуванні — як у гуми, що натягується (на Android)
        const level = Math.floor(Math.hypot(nx, ny) / 40);
        const now = performance.now();
        if (level > detent && now - lastDetent > 45) {
          Haptics.tick(4 + level * 2);
          lastDetent = now;
        }
        detent = level;

        // Секрет: тримаєш розтягнутою майже до упору 2.5 секунди
        if (Math.hypot(nx, ny) > 215) {
          if (!holdStart) holdStart = now;
          else if (now - holdStart > 2500 && window.EggFun) { window.EggFun.secret('hold'); holdStart = now + 1e9; }
        } else {
          holdStart = 0;
        }
      });

      const release = (e) => {
        if (!dragging) return;
        dragging = false;
        img.style.cursor = '';
        const pull = Math.hypot(pos.x, pos.y);

        holdStart = 0;

        // Різкий змах — картка по інерції вилітає і вмикається "Політ"
        const fling = tracker.get();
        if (Math.hypot(fling.x, fling.y) > 1200 && window.EggFun && window.EggFun.launchWith) {
          pos = { x: 0, y: 0 };
          vel = { x: 0, y: 0 };
          apply();
          if (window.EggFun.launchWith(fling.x, fling.y)) return;
        }

        if (pull > 30 && window.EggFun) {
          window.EggFun.stat('stretches');
          window.EggFun.statMax('maxPull', pull);
          window.EggFun.counterHit();
        }
        if (pull > 30) {
          // Вібрація "пружинить" разом з картинкою: сильний удар і затухаючі відскоки
          const k = Math.min(pull / 220, 1.2);
          Haptics.pattern([
            Math.round(22 + 30 * k), 55,
            Math.round(14 + 18 * k), 70,
            Math.round(8 + 10 * k), 85,
            Math.round(5 + 4 * k)
          ]);
          if (window.easterSound) window.easterSound.splash(k);
        }
        lastT = performance.now();
        rafId = requestAnimationFrame(step);
      };
      img.addEventListener('pointerup', release);
      img.addEventListener('pointercancel', release);
      img.addEventListener('lostpointercapture', release);
    })();

    // 4.3 Фрази з тг-каналу: при дотику до картинки, не частіше ніж раз на 3 секунди
    (() => {
      const bubble = document.getElementById('easterQuote');
      const all = Array.isArray(window.EASTER_PHRASES) ? window.EASTER_PHRASES.slice() : [];
      if (!bubble || all.length === 0) return;

      const PERIOD_MS = 3000;
      let deck = [];
      let lastShown = -Infinity;
      let hideTimer = null;

      // Перемішана колода — фрази не повторюються, поки не покажуться всі
      const nextPhrase = () => {
        if (deck.length === 0) {
          deck = all.slice();
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
        }
        return deck.pop();
      };

      window.easterQuote = () => {
        const now = performance.now();
        if (now - lastShown < PERIOD_MS) return;
        lastShown = now;
        bubble.textContent = nextPhrase();
        if (window.EggFun) window.EggFun.stat('quotes');
        bubble.classList.remove('is-shown');
        void bubble.offsetWidth; // перезапуск анімації
        bubble.classList.add('is-shown');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bubble.classList.remove('is-shown'), PERIOD_MS - 200);
      };

      // Показати конкретну фразу одразу (для секретів)
      window.easterQuoteForce = (text) => {
        lastShown = performance.now();
        bubble.textContent = text;
        bubble.classList.remove('is-shown');
        void bubble.offsetWidth;
        bubble.classList.add('is-shown');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bubble.classList.remove('is-shown'), PERIOD_MS);
      };

      // При закритті пасхалки ховаємо бульбашку
      const overlay = document.getElementById('easterOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay && !(window.EggFun && window.EggFun.busy())) { bubble.classList.remove('is-shown'); lastShown = -Infinity; }
        });
      }
    })();

    // 4.5 3D-режим на WebGL (three.js підвантажується лише при натисканні "3D").
    //     Картка — товста, з заокругленими кутами, гнеться як желе:
    //     тягнеш по картці — деформується, тягнеш по фону — крутиться.
    (() => {
      const overlay = document.getElementById('easterOverlay');
      const canvas = document.getElementById('egg3dCanvas');
      const btn = document.getElementById('egg3dToggle');
      const label = document.getElementById('egg3dLabel');
      const srcImg = document.querySelector('.easter-img');
      if (!overlay || !canvas || !btn || !srcImg) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      // Розміри картки у "світових" одиницях
      const CW = 3.6;
      const CH = CW * 600 / 1349;
      const TH = 0.14;                  // товщина
      const RAD = CW * 0.078;           // радіус кутів
      const SEG_X = 48, SEG_Y = 22;     // деталізація поверхні

      // Сітка фізики (м'яке тіло): вузли з пружинами до сусідів і до спокою
      const GX = 37, GY = 17;
      const NODES = GX * GY;
      const P = new Float32Array(NODES * 3);  // зміщення вузлів
      const V = new Float32Array(NODES * 3);  // швидкість
      const W = new Float32Array(NODES);      // вага захоплення
      const K_ANCHOR = 80, K_NEIGH = 90, DAMP = 4.2, K_GRAB = 1400;

      let THREE = null;
      let ready = false, loading = false, on = false, exiting = false;
      let renderer, scene, camera, group, hitMesh, raycaster;
      const meshes = [];                // { geo, base, uv }
      let rafId = null, prevT = 0;

      // Обертання
      let rx = 0, ry = 0, vrx = 0, vry = 0;
      let tiltX = 0, tiltY = 0, gx = 0, gy = 0, baseBeta = null;
      let lastFace = 0;
      let spinLog = [];

      // Взаємодія
      let mode = null;                  // 'deform' | 'rotate' | null
      let startPt = null, lastPt = null, downTime = 0, moved = false;
      let grabTarget = [0, 0, 0];
      let detent = 0, lastDetent = 0;

      const onOrient = (e) => {
        if (e.beta == null || e.gamma == null) return;
        if (baseBeta === null) baseBeta = e.beta;
        tiltX = clamp((e.beta - baseBeta) * 0.012, -0.45, 0.45);
        tiltY = clamp(e.gamma * 0.012, -0.45, 0.45);
      };

      // ---------- Побудова сцени ----------
      function roundRectPath(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function makeAlphaMap() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = Math.round(512 * CH / CW);
        const g = c.getContext('2d');
        g.fillStyle = '#000';
        g.fillRect(0, 0, c.width, c.height);
        g.fillStyle = '#fff';
        roundRectPath(g, 0, 0, c.width, c.height, (RAD / CW) * c.width);
        g.fill();
        const t = new THREE.CanvasTexture(c);
        return t;
      }

      // Фото на полотні потрібного розміру (надійніше за пряму передачу <img> у WebGL)
      function photoCanvas() {
        const c = document.createElement('canvas');
        c.width = Math.min(srcImg.naturalWidth || 1349, 1024);
        c.height = Math.round(c.width * 600 / 1349);
        c.getContext('2d').drawImage(srcImg, 0, 0, c.width, c.height);
        return c;
      }

      function makeFrontTexture() {
        const t = new THREE.CanvasTexture(photoCanvas());
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        return t;
      }

      // Зворот: "інопланетна" версія фото (поворот відтінку + насиченість)
      function makeBackTexture() {
        const c = photoCanvas();
        const g = c.getContext('2d');
        try {
          const d = g.getImageData(0, 0, c.width, c.height);
          const px = d.data;
          const a = (170 * Math.PI) / 180, cos = Math.cos(a), sin = Math.sin(a);
          const m = [
            0.213 + cos * 0.787 - sin * 0.213, 0.715 - cos * 0.715 - sin * 0.715, 0.072 - cos * 0.072 + sin * 0.928,
            0.213 - cos * 0.213 + sin * 0.143, 0.715 + cos * 0.285 + sin * 0.140, 0.072 - cos * 0.072 - sin * 0.283,
            0.213 - cos * 0.213 - sin * 0.787, 0.715 - cos * 0.715 + sin * 0.715, 0.072 + cos * 0.928 + sin * 0.072
          ];
          const sat = 1.6;
          for (let i = 0; i < px.length; i += 4) {
            const r = px[i], gg = px[i + 1], b = px[i + 2];
            let nr = m[0] * r + m[1] * gg + m[2] * b;
            let ng = m[3] * r + m[4] * gg + m[5] * b;
            let nb = m[6] * r + m[7] * gg + m[8] * b;
            const l = 0.2126 * nr + 0.7152 * ng + 0.0722 * nb;
            px[i] = clamp(l + (nr - l) * sat, 0, 255);
            px[i + 1] = clamp(l + (ng - l) * sat, 0, 255);
            px[i + 2] = clamp(l + (nb - l) * sat, 0, 255);
          }
          g.putImageData(d, 0, 0);
        } catch (e) {}
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      // Точки по периметру заокругленого прямокутника (для бокової стінки)
      function perimeter() {
        const pts = [];
        const hw = CW / 2, hh = CH / 2, r = RAD;
        const corners = [
          [hw - r, hh - r, 0], [-hw + r, hh - r, Math.PI / 2],
          [-hw + r, -hh + r, Math.PI], [hw - r, -hh + r, Math.PI * 1.5]
        ];
        const ARC = 10, EDGE_X = 40, EDGE_Y = 16;
        corners.forEach(([cx, cy, a0], ci) => {
          for (let i = 0; i <= ARC; i++) {
            const a = a0 + (i / ARC) * (Math.PI / 2);
            pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
          }
          // пряма до наступного кута
          const [nx, ny, na] = corners[(ci + 1) % 4];
          const ex = cx + Math.cos(a0 + Math.PI / 2) * r, ey = cy + Math.sin(a0 + Math.PI / 2) * r;
          const sx = nx + Math.cos(na) * r, sy = ny + Math.sin(na) * r;
          const n = ci % 2 === 0 ? EDGE_X : EDGE_Y;
          for (let i = 1; i < n; i++) pts.push([ex + (sx - ex) * (i / n), ey + (sy - ey) * (i / n)]);
        });
        return pts;
      }

      function register(geo) {
        const pos = geo.attributes.position.array;
        const base = new Float32Array(pos);
        const n = pos.length / 3;
        const uv = new Float32Array(n * 2);
        for (let i = 0; i < n; i++) {
          uv[i * 2] = clamp((base[i * 3] + CW / 2) / CW, 0, 1);
          uv[i * 2 + 1] = clamp((base[i * 3 + 1] + CH / 2) / CH, 0, 1);
        }
        meshes.push({ geo, base, uv });
      }

      function build() {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor(0x000000, 0);
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
        scene.add(camera);

        // Світло прив'язане до камери — обидві сторони картки гарно освітлені
        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(-2.5, 3, 6);
        camera.add(key);
        const rim = new THREE.DirectionalLight(0x9fd0ff, 0.9);
        rim.position.set(4, -2, 3);
        camera.add(rim);

        group = new THREE.Group();
        scene.add(group);

        const frontTex = makeFrontTexture();
        const alpha = makeAlphaMap();
        const faceMat = (map) => new THREE.MeshStandardMaterial({
          map, alphaMap: alpha, alphaTest: 0.5, roughness: 0.32, metalness: 0.05
        });

        const front = new THREE.PlaneGeometry(CW, CH, SEG_X, SEG_Y);
        front.translate(0, 0, TH / 2);
        const back = new THREE.PlaneGeometry(CW, CH, SEG_X, SEG_Y);
        back.rotateY(Math.PI);
        back.translate(0, 0, -TH / 2);

        // Бокова стінка
        const pts = perimeter();
        const rimPos = new Float32Array(pts.length * 2 * 3);
        pts.forEach(([x, y], i) => {
          rimPos.set([x, y, TH / 2], i * 6);
          rimPos.set([x, y, -TH / 2], i * 6 + 3);
        });
        const idx = [];
        for (let i = 0; i < pts.length; i++) {
          const a = i * 2, b = i * 2 + 1, c = ((i + 1) % pts.length) * 2, d = c + 1;
          idx.push(a, b, c, b, d, c);
        }
        const rimGeo = new THREE.BufferGeometry();
        rimGeo.setAttribute('position', new THREE.BufferAttribute(rimPos, 3));
        rimGeo.setIndex(idx);
        rimGeo.computeVertexNormals();

        group.add(new THREE.Mesh(front, faceMat(frontTex)));
        group.add(new THREE.Mesh(back, faceMat(makeBackTexture())));
        group.add(new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({
          color: 0x3b3e48, roughness: 0.5, metalness: 0.2, side: THREE.DoubleSide
        })));
        [front, back, rimGeo].forEach(register);

        // Невидима площина для визначення, куди саме торкнулись
        hitMesh = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));
        group.add(hitMesh);
        raycaster = new THREE.Raycaster();

        resize();
        window.addEventListener('resize', resize);
        ready = true;
      }

      function resize() {
        if (!renderer) return;
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        // Відстань камери, щоб картка займала ~88% ширини (але не більше 460px)
        const targetFrac = Math.min(0.88, 460 / w);
        const tanH = Math.tan((camera.fov * Math.PI) / 360);
        camera.position.set(0, 0, CW / targetFrac / (2 * tanH * camera.aspect));
        camera.updateProjectionMatrix();
      }

      // Скільки світових одиниць в одному пікселі на глибині картки
      const unitsPerPx = () => (2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360)) / window.innerHeight;

      // ---------- Фізика м'якого тіла ----------
      function physics(dt) {
        const steps = 3;
        const h = dt / steps;
        for (let s = 0; s < steps; s++) {
          for (let j = 0; j < GY; j++) {
            for (let i = 0; i < GX; i++) {
              const n = j * GX + i;
              for (let c = 0; c < 3; c++) {
                const k = n * 3 + c;
                const p = P[k];
                let lap = 0, cnt = 0;
                if (i > 0) { lap += P[k - 3]; cnt++; }
                if (i < GX - 1) { lap += P[k + 3]; cnt++; }
                if (j > 0) { lap += P[k - GX * 3]; cnt++; }
                if (j < GY - 1) { lap += P[k + GX * 3]; cnt++; }
                let f = -K_ANCHOR * p + K_NEIGH * (lap - cnt * p) - DAMP * V[k];
                if (mode === 'deform' && W[n] > 0.001) f += K_GRAB * W[n] * (grabTarget[c] * W[n] - p);
                V[k] += f * h;
              }
            }
          }
          for (let k = 0; k < P.length; k++) P[k] += V[k] * h;
        }
      }

      // Білінійна вибірка зміщення в точці (u, v)
      function deformGeometry() {
        for (const m of meshes) {
          const pos = m.geo.attributes.position.array;
          const { base, uv } = m;
          const n = base.length / 3;
          for (let i = 0; i < n; i++) {
            const fx = uv[i * 2] * (GX - 1), fy = uv[i * 2 + 1] * (GY - 1);
            const x0 = Math.min(Math.floor(fx), GX - 2), y0 = Math.min(Math.floor(fy), GY - 2);
            const tx = fx - x0, ty = fy - y0;
            const a = (y0 * GX + x0) * 3, b = a + 3, c = a + GX * 3, d = c + 3;
            for (let k = 0; k < 3; k++) {
              const top = P[a + k] * (1 - tx) + P[b + k] * tx;
              const bot = P[c + k] * (1 - tx) + P[d + k] * tx;
              pos[i * 3 + k] = base[i * 3 + k] + top * (1 - ty) + bot * ty;
            }
          }
          m.geo.attributes.position.needsUpdate = true;
          m.geo.computeVertexNormals();
        }
      }

      // ---------- Кадр ----------
      function frame(t) {
        const dt = Math.min((t - prevT) / 1000, 0.033);
        prevT = t;

        if (mode !== 'rotate') {
          if (exiting) {
            const target = Math.round(ry / (Math.PI * 2)) * Math.PI * 2;
            vry += ((target - ry) * 60 - vry * 11) * dt;
          } else {
            vry *= Math.pow(0.15, dt);
            if (Math.abs(vry) < 0.7) {
              const target = Math.round(ry / Math.PI) * Math.PI;
              vry += ((target - ry) * 28 - vry * 6) * dt;
            }
          }
          ry += vry * dt;
          vrx += (-rx * 40 - vrx * 8) * dt;
          rx += vrx * dt;
        }

        const ti = exiting ? 0 : 1;
        gx += (tiltX * ti - gx) * Math.min(1, dt * 8);
        gy += (tiltY * ti - gy) * Math.min(1, dt * 8);

        physics(dt);
        deformGeometry();

        group.rotation.x = rx + gx;
        group.rotation.y = ry + gy;
        group.position.y = exiting ? 0 : Math.sin(t / 900) * 0.05;
        renderer.render(scene, camera);

        // Секрет "Вертоліт": 6 повних обертів за 4 секунди
        spinLog.push([t, ry]);
        while (spinLog.length && t - spinLog[0][0] > 4000) spinLog.shift();
        if (spinLog.length > 1 && Math.abs(ry - spinLog[0][1]) > Math.PI * 12 && window.EggFun) {
          window.EggFun.secret('heli');
          spinLog = [];
        }

        // Переворот — тік і "свуш"
        const face = Math.round(ry / Math.PI);
        if (face !== lastFace) {
          lastFace = face;
          if (window.EggFun) window.EggFun.stat('flips');
          Haptics.tick(14);
          if (window.easterSound && window.easterSound.flip) window.easterSound.flip();
        }

        if (exiting) {
          let energy = 0;
          for (let k = 0; k < P.length; k++) energy += Math.abs(P[k]);
          const target = Math.round(ry / (Math.PI * 2)) * Math.PI * 2;
          if ((Math.abs(ry - target) < 0.01 && Math.abs(rx) < 0.01 && energy < 0.5) || t - exitStart > 1400) {
            finishExit();
            return;
          }
        }
        rafId = requestAnimationFrame(frame);
      }

      let exitStart = 0;
      function finishExit() {
        exiting = false;
        on = false;
        overlay.classList.remove('is-3d');
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      const startLoop = () => {
        if (!rafId) { prevT = performance.now(); rafId = requestAnimationFrame(frame); }
      };

      // ---------- Увімкнення / вимкнення ----------
      async function enable() {
        if (loading) return;
        // Дозвіл на гіроскоп iPhone треба просити одразу в обробнику натискання
        let permission = Promise.resolve('granted');
        try {
          if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
            permission = DeviceOrientationEvent.requestPermission().catch(() => 'denied');
          }
        } catch (e) {}

        if (!ready) {
          loading = true;
          btn.classList.add('is-loading');
          try {
            THREE = await import('./js/vendor/three.module.min.js');
            build();
          } catch (e) {
            loading = false;
            btn.classList.remove('is-loading');
            label.textContent = '3D ✕';
            setTimeout(() => { label.textContent = '3D'; }, 1500);
            return;
          }
          loading = false;
          btn.classList.remove('is-loading');
        }

        on = true;
        exiting = false;
        P.fill(0); V.fill(0);
        rx = 0; vrx = 0; ry = 0; lastFace = 0;
        vry = reduceMotion ? 0 : Math.PI * 4;   // ефектне розкручування на вході
        baseBeta = null;
        overlay.classList.add('is-3d');
        btn.setAttribute('aria-pressed', 'true');
        label.textContent = '2D';
        resize();
        permission.then((res) => { if (res === 'granted' && on) window.addEventListener('deviceorientation', onOrient); });
        Haptics.pattern([10, 40, 10, 40, 20]);
        if (window.EggFun) { window.EggFun.setFree(false, true); window.EggFun.stat('threeD'); window.EggFun.askMotion(); }
        startLoop();
      }

      function disable() {
        if (!on || exiting) return;
        exiting = true;
        exitStart = performance.now();
        mode = null;
        window.removeEventListener('deviceorientation', onOrient);
        tiltX = tiltY = 0;
        btn.setAttribute('aria-pressed', 'false');
        label.textContent = '3D';
        Haptics.tick(12);
        startLoop();
      }

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (on && !exiting) disable(); else if (!on) enable();
      });

      // Струс телефона в 3D — картка тремтить і крутиться
      window.__egg3dShake = (power) => {
        if (!on || exiting || !ready) return false;
        for (let k = 0; k < V.length; k++) V[k] += (Math.random() * 2 - 1) * 2.2 * power;
        vry += (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 5) * power;
        vrx += (Math.random() * 2 - 1) * 3 * power;
        startLoop();
        return true;
      };

      // Закрили пасхалку — миттєво виходимо з 3D
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay && on) {
          window.removeEventListener('deviceorientation', onOrient);
          btn.setAttribute('aria-pressed', 'false');
          label.textContent = '3D';
          finishExit();
        }
      });

      // ---------- Дотики ----------
      function hitUV(clientX, clientY) {
        const ndc = new THREE.Vector2((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const hit = raycaster.intersectObject(hitMesh, false)[0];
        if (!hit) return null;
        const local = group.worldToLocal(hit.point.clone());
        return { x: local.x, y: local.y };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (!on || exiting || !ready) return;
        e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        startPt = lastPt = { x: e.clientX, y: e.clientY, t: performance.now() };
        downTime = performance.now();
        moved = false;
        const hit = hitUV(e.clientX, e.clientY);
        if (hit) {
          mode = 'deform';
          // Вага кожного вузла — гаусіана навколо місця дотику
          const sigma = 0.36;
          for (let j = 0; j < GY; j++) {
            for (let i = 0; i < GX; i++) {
              const nx = (i / (GX - 1) - 0.5) * CW, ny = (j / (GY - 1) - 0.5) * CH;
              const d2 = (nx - hit.x) ** 2 + (ny - hit.y) ** 2;
              W[j * GX + i] = Math.exp(-d2 / (2 * sigma * sigma));
            }
          }
          grabTarget = [0, 0, 0];
          detent = 0;
          if (window.easterQuote) window.easterQuote();
          Haptics.tick(10);
          if (window.easterSound) window.easterSound.grab();
        } else {
          mode = 'rotate';
          vrx = vry = 0;
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!on || !mode || !lastPt) return;
        const now = performance.now();
        const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
        if (Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) > 6) moved = true;

        if (mode === 'rotate') {
          const dt = Math.max((now - lastPt.t) / 1000, 0.001);
          ry += dx * 0.009;
          rx = clamp(rx + dy * 0.009, -1.2, 1.2);
          vry = vry * 0.6 + ((dx * 0.009) / dt) * 0.4;
          vrx = vrx * 0.6 + ((dy * 0.009) / dt) * 0.4;
        } else {
          // Розтяг за пальцем + "витягування" до глядача
          const upp = unitsPerPx();
          let wx = (e.clientX - startPt.x) * upp;
          let wy = -(e.clientY - startPt.y) * upp;
          const len = Math.hypot(wx, wy);
          const L = 1.5;
          const soft = len > 0 ? (L * (1 - Math.exp(-len / L))) / len : 0;
          wx *= soft; wy *= soft;
          const pull = Math.min(len, 2) * 0.85;
          const v = new THREE.Vector3(wx, wy, pull);
          v.applyQuaternion(group.quaternion.clone().invert());
          grabTarget = [v.x, v.y, v.z];

          // Тіки при натягуванні
          const level = Math.floor(len / upp / 40);
          if (level > detent && now - lastDetent > 45) { Haptics.tick(4 + level * 2); lastDetent = now; }
          detent = level;
        }
        lastPt = { x: e.clientX, y: e.clientY, t: now };
      });

      const end = (e) => {
        if (!mode) return;
        const wasMode = mode;
        mode = null;
        if (wasMode === 'deform') {
          const len = Math.hypot(grabTarget[0], grabTarget[1], grabTarget[2]);
          W.fill(0);
          if (len > 0.15) {
            if (window.EggFun) { window.EggFun.stat('stretches'); window.EggFun.counterHit(); }
            const k = Math.min(len / 1.2, 1.2);
            Haptics.pattern([
              Math.round(22 + 30 * k), 55, Math.round(14 + 18 * k), 70,
              Math.round(8 + 10 * k), 85, Math.round(5 + 4 * k)
            ]);
            if (window.easterSound) window.easterSound.splash(k);
          }
        } else {
          // Короткий тап по фону без руху — назад у 2D
          if (!moved && performance.now() - downTime < 300) { disable(); return; }
          if (lastPt && performance.now() - lastPt.t > 80) { vrx = vry = 0; }
          vry = clamp(vry, -25, 25);
          vrx = clamp(vrx, -8, 8);
          if (Math.abs(vry) > 6) Haptics.pattern([12, 30, 8]);
        }
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('lostpointercapture', end);
    })();

    // 4.4 Звуки пасхалки: водяні "хлюпи" з варіаціями (синтез у браузері, без файлів)
    window.easterSound = (() => {
      const rand = (a, b) => a + Math.random() * (b - a);
      let ac = null;
      let lastVariant = -1;

      const getAC = () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        return ac;
      };

      const out = (vol) => {
        const g = ac.createGain();
        g.gain.value = vol;
        g.connect(ac.destination);
        return g;
      };

      // Бульбашка: тон швидко росте вгору — так звучить крапля у воді
      const bloop = (dest, time, f0, f1, dur, vol, type = 'sine') => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, time);
        o.frequency.exponentialRampToValueAtTime(f1, time + dur * 0.7);
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        o.connect(g).connect(dest);
        o.start(time);
        o.stop(time + dur + 0.02);
      };

      // Шум води, який "закривається" фільтром
      const wash = (dest, time, dur, vol, fStart, fEnd, q = 3) => {
        const len = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.Q.value = q;
        lp.frequency.setValueAtTime(fStart, time);
        lp.frequency.exponentialRampToValueAtTime(fEnd, time + dur * 0.85);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(lp).connect(g).connect(dest);
        src.start(time);
        src.stop(time + dur);
      };

      const drops = (dest, t0, n, spread) => {
        for (let i = 0; i < n; i++) {
          const f = rand(700, 1900);
          bloop(dest, t0 + rand(0.05, spread), f, f * rand(1.4, 2.1), rand(0.04, 0.08), rand(0.08, 0.2));
        }
      };

      // Варіації хлюпу
      const variants = [
        // 0. Класичний "бульк" з краплями
        (d, t, k, p) => {
          bloop(d, t, 160 * p, (620 + k * 200) * p, 0.16, 0.5);
          wash(d, t, 0.45, 0.18 + k * 0.12, 2600, 350);
          drops(d, t, 4 + Math.round(k * 5), 0.6);
        },
        // 1. Великий плюх — наче щось упало у ванну
        (d, t, k, p) => {
          bloop(d, t, 90 * p, 260 * p, 0.22, 0.55);
          wash(d, t, 0.7, 0.3 + k * 0.15, 3800, 260, 1.5);
          bloop(d, t + 0.05, 240 * p, 900 * p, 0.12, 0.3);
          drops(d, t + 0.1, 7 + Math.round(k * 6), 0.9);
        },
        // 2. Кап-кап-кап — серія крапель
        (d, t, k, p) => {
          const n = 3 + Math.round(k * 2);
          for (let i = 0; i < n; i++) {
            const f = rand(350, 600) * p;
            bloop(d, t + i * rand(0.09, 0.14), f, f * 2.4, 0.11, 0.42 - i * 0.05);
          }
          wash(d, t, 0.25, 0.08, 2000, 500);
        },
        // 3. Желейний "боїнг" — пружинить разом з картинкою
        (d, t, k, p) => {
          const o = ac.createOscillator();
          const lfo = ac.createOscillator();
          const lfoGain = ac.createGain();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(210 * p, t);
          o.frequency.exponentialRampToValueAtTime(140 * p, t + 0.6);
          lfo.frequency.setValueAtTime(14, t);
          lfo.frequency.linearRampToValueAtTime(6, t + 0.6);
          lfoGain.gain.setValueAtTime(70 * (0.6 + k * 0.4), t);
          lfoGain.gain.exponentialRampToValueAtTime(1, t + 0.6);
          lfo.connect(lfoGain).connect(o.frequency);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
          o.connect(g).connect(d);
          o.start(t); lfo.start(t);
          o.stop(t + 0.7); lfo.stop(t + 0.7);
          wash(d, t, 0.3, 0.12, 1800, 400);
        },
        // 4. Ковток "глюк" — тон падає вниз
        (d, t, k, p) => {
          bloop(d, t, 420 * p, 85 * p, 0.2, 0.5);
          bloop(d, t + 0.13, 300 * p, 70 * p, 0.16, 0.35);
          wash(d, t, 0.35, 0.12 + k * 0.08, 1400, 200, 5);
        },
        // 5. Чвяк — в'язкий хлюп
        (d, t, k, p) => {
          wash(d, t, 0.22, 0.35, 900, 3500, 8);
          wash(d, t + 0.08, 0.3, 0.2, 2500, 300, 6);
          bloop(d, t + 0.02, 120 * p, 380 * p, 0.14, 0.4, 'triangle');
          drops(d, t + 0.15, 2 + Math.round(k * 3), 0.4);
        }
      ];

      return {
        // Удар об край екрана під час польоту
        thud(k) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(Math.min(0.8, 0.3 + k * 0.5));
            bloop(d, t, 140 * rand(0.85, 1.2), 60, 0.14, 0.55);
            wash(d, t, 0.18, 0.12 + k * 0.1, 1600, 300, 2);
            if (k > 0.5) drops(d, t, 2, 0.3);
          } catch (e) {}
        },
        // Скрип повітряної кульки, що надувається (вище з кожним рівнем)
        inflate(level) {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.35);
            const f = 300 + level * 90;
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(f, t);
            o.frequency.exponentialRampToValueAtTime(f * 1.35, t + 0.12);
            const lp = ac.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.value = 1800;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
            o.connect(lp).connect(g).connect(d);
            o.start(t);
            o.stop(t + 0.17);
          } catch (e) {}
        },
        // "ПУК": низьке хрипле брр з тремтінням тону + хлопок
        pop() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.9);
            // хлопок кульки
            wash(d, t, 0.12, 0.6, 6000, 800, 0.7);
            // брр
            const o = ac.createOscillator();
            const lfo = ac.createOscillator();
            const lfoG = ac.createGain();
            const g = ac.createGain();
            const lp = ac.createBiquadFilter();
            o.type = 'sawtooth';
            const base = rand(85, 110);
            o.frequency.setValueAtTime(base * 1.3, t + 0.05);
            o.frequency.exponentialRampToValueAtTime(base * 0.7, t + 0.75);
            lfo.type = 'square';
            lfo.frequency.setValueAtTime(rand(22, 30), t);
            lfoG.gain.value = base * 0.35;
            lfo.connect(lfoG).connect(o.frequency);
            lp.type = 'lowpass';
            lp.frequency.value = 650;
            lp.Q.value = 4;
            g.gain.setValueAtTime(0.0001, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.5, t + 0.09);
            g.gain.setValueAtTime(0.45, t + 0.55);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
            o.connect(lp).connect(g).connect(d);
            o.start(t + 0.05); lfo.start(t + 0.05);
            o.stop(t + 0.9); lfo.stop(t + 0.9);
          } catch (e) {}
        },
        // Вибух: глухий удар, гуркіт, що затихає, і тріск уламків
        boom() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const master = out(0.95);
            // Легке "перевантаження" для потужності
            const shaper = ac.createWaveShaper();
            const curve = new Float32Array(1024);
            for (let i = 0; i < 1024; i++) { const x = (i / 512) - 1; curve[i] = Math.tanh(x * 2.5); }
            shaper.curve = curve;
            shaper.connect(master);

            // Суб-удар
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(130, t);
            o.frequency.exponentialRampToValueAtTime(32, t + 0.9);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.9, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
            o.connect(g).connect(shaper);
            o.start(t); o.stop(t + 1.25);

            // Гуркіт
            wash(shaper, t, 1.6, 0.8, 5000, 90, 0.8);
            // Тріск уламків
            for (let i = 0; i < 9; i++) {
              const tt = t + 0.08 + Math.random() * 0.7;
              const len = Math.floor(ac.sampleRate * 0.03);
              const buf = ac.createBuffer(1, len, ac.sampleRate);
              const dd = buf.getChannelData(0);
              for (let j = 0; j < len; j++) dd[j] = (Math.random() * 2 - 1) * (1 - j / len);
              const src = ac.createBufferSource();
              src.buffer = buf;
              const hp = ac.createBiquadFilter();
              hp.type = 'highpass';
              hp.frequency.value = 1500 + Math.random() * 2500;
              const gg = ac.createGain();
              gg.gain.value = 0.15 + Math.random() * 0.2;
              src.connect(hp).connect(gg).connect(master);
              src.start(tt);
            }
          } catch (e) {}
        },
        // Глітч для секрету з аватаркою
        glitch() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.3);
            for (let i = 0; i < 8; i++) {
              const o = ac.createOscillator();
              const g = ac.createGain();
              o.type = 'square';
              o.frequency.value = rand(80, 1800);
              const tt = t + i * 0.06;
              g.gain.setValueAtTime(0.25, tt);
              g.gain.setValueAtTime(0.0001, tt + 0.045);
              o.connect(g).connect(d);
              o.start(tt); o.stop(tt + 0.05);
            }
          } catch (e) {}
        },
        // Дзинь досягнення
        chime() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.01;
            const d = out(0.35);
            [880, 1320, 1760].forEach((f, i) => {
              const o = ac.createOscillator();
              const g = ac.createGain();
              o.type = 'triangle';
              o.frequency.value = f;
              g.gain.setValueAtTime(0.0001, t + i * 0.09);
              g.gain.exponentialRampToValueAtTime(0.3, t + i * 0.09 + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.5);
              o.connect(g).connect(d);
              o.start(t + i * 0.09);
              o.stop(t + i * 0.09 + 0.55);
            });
          } catch (e) {}
        },
        // Переворот картки в 3D — легкий "свуш" і клац
        flip() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.45);
            wash(d, t, 0.14, 0.1, 600, 3000, 2);
            bloop(d, t + 0.05, 900, 1400, 0.04, 0.12, 'triangle');
          } catch (e) {}
        },
        // Тихий "чвяк" коли хапаєш картинку
        grab() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.5);
            wash(d, t, 0.09, 0.12, 700, 2200, 6);
            bloop(d, t, 110, 190, 0.07, 0.18, 'triangle');
          } catch (e) {}
        },
        // Хлюп при відпусканні: випадкова варіація (не та ж сама двічі поспіль)
        splash(k) {
          try {
            if (!getAC()) return;
            let v;
            do { v = Math.floor(Math.random() * variants.length); } while (v === lastVariant && variants.length > 1);
            lastVariant = v;
            const t = ac.currentTime + 0.01;
            const d = out(Math.min(0.9, 0.45 + k * 0.35));
            variants[v](d, t, k, rand(0.85, 1.2)); // p — випадкова висота тону
          } catch (e) {}
        }
      };
    })();

    // 4.6 Розваги пасхалки: кидок, надування, струшування, досягнення, лічильник
    window.EggFun = (() => {
      const overlay = document.getElementById('easterOverlay');

      const rand = (a, b) => a + Math.random() * (b - a);
      const sound = (name, ...args) => { if (window.easterSound && window.easterSound[name]) window.easterSound[name](...args); };

      // ---------- Статистика (зберігається в браузері) ----------
      const STATS_KEY = 'egg_stats_v1';

      try { stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{}') || {}; } catch (e) { stats = {}; }
      if (!Array.isArray(stats.unlocked)) stats.unlocked = [];
      const save = () => { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {} };

      const ACH = [
        { id: 'open',      emoji: '🔍', title: 'Шукач пасхалок',                       desc: 'Знайшов пасхалку',                 ok: (s) => s.opens >= 1 },
        { id: 'stretch10', emoji: '🫠', title: 'Розтягнув 10 разів',                   desc: 'Розтягни пику 10 разів',           ok: (s) => s.stretches >= 10 },
        { id: 'stretch100',emoji: '🧘', title: 'Гумовий майстер',                      desc: 'Розтягни пику 100 разів',          ok: (s) => s.stretches >= 100 },
        { id: 'maxpull',   emoji: '💪', title: 'До упору!',                            desc: 'Розтягни так сильно, як можеш',    ok: (s) => s.maxPull >= 235 },
        { id: 'quotes20',  emoji: '📖', title: 'Читач тгк',                            desc: 'Прочитай 20 фраз',                 ok: (s) => s.quotes >= 20 },
        { id: 'quotes100', emoji: '🤨', title: 'Прочитав 100 фраз — ти точно не Влад?', desc: 'Прочитай 100 фраз',               ok: (s) => s.quotes >= 100 },
        { id: '3d',        emoji: '🧊', title: 'Новий вимір',                          desc: 'Увімкни 3D',                       ok: (s) => s.threeD >= 1 },
        { id: 'flips50',   emoji: '😵‍💫', title: 'Перевернув 50 разів — голова не крутиться?', desc: 'Переверни картку в 3D 50 разів', ok: (s) => s.flips >= 50 },
        { id: 'throw',     emoji: '🚀', title: 'Пика полетіла',                         desc: 'Увімкни «Політ» і пожбурляй картку',           ok: (s) => s.throws >= 1 },

        { id: 'pop10',     emoji: '💨', title: 'Серійний пукач',                        desc: 'Лусни картинку 10 разів',          ok: (s) => s.pops >= 10 },

      ];
      // Секретні — в списку показуються як "Секретна пасхалка", поки не знайдеш
      const hasSecret = (id) => (s) => Array.isArray(s.secrets) && s.secrets.includes(id);
      ACH.push(
        { id: 's_hold',   secret: true, emoji: '😖', title: 'Ай блеее',            desc: 'Тримав розтягнутою до упору 2.5 секунди', ok: hasSecret('hold') },
        { id: 's_dvd',    secret: true, emoji: '📀', title: 'DVD-логотип',         desc: 'Влучив карткою точно в кут екрана',      ok: hasSecret('dvd') },
        { id: 's_night',  secret: true, emoji: '🌙', title: 'Нічний валік',        desc: 'Відкрив пасхалку між 00:00 і 05:00',     ok: hasSecret('night') },
        { id: 's_heli',   secret: true, emoji: '🚁', title: 'Вертоліт',            desc: 'Розкрутив 3D-картку на 6 обертів за 4 с', ok: hasSecret('heli') },
        { id: 's_avatar', secret: true, emoji: '👾', title: 'Хакер аватарки',      desc: '7 разів тапнув по аватарці',             ok: hasSecret('avatar') },
        { id: 's_footer', secret: true, emoji: '🧐', title: 'Читаю дрібний шрифт', desc: '5 разів тапнув по підпису внизу сайту',  ok: hasSecret('footer') },
        { id: 's_disco',  secret: true, emoji: '🪩', title: 'Дискотека',           desc: '8 разів швидко перемкнув тему',          ok: hasSecret('disco') }
      );
      ACH.push({ id: 'all', emoji: '👑', title: 'Еліта телеграм-каналу', desc: 'Відкрий усі досягнення',
        ok: () => ACH.every((a) => a.id === 'all' || stats.unlocked.includes(a.id)) });

      const trophyCount = document.getElementById('eggTrophyCount');
      const trophyBtn = document.getElementById('eggTrophyBtn');
      const updateTrophyCount = () => { if (trophyCount) trophyCount.textContent = `${stats.unlocked.length}/${ACH.length}`; };
      updateTrophyCount();

      // Черга сповіщень
      const toasts = document.getElementById('eggToasts');
      let toastQueue = [];
      let toastBusy = false;
      function showNextToast() {
        if (toastBusy || toastQueue.length === 0 || !toasts) return;

        el.querySelector('.egg-toast-emoji').textContent = a.emoji;
        el.querySelector('.egg-toast-title').textContent = a.title;
        toasts.appendChild(el);
        sound('chime');
        Haptics.pattern([15, 50, 15, 50, 40]);
        if (trophyBtn) { trophyBtn.classList.remove('is-bump'); void trophyBtn.offsetWidth; trophyBtn.classList.add('is-bump'); }
        setTimeout(() => {
          el.classList.add('is-leaving');
          setTimeout(() => { el.remove(); toastBusy = false; showNextToast(); }, 350);
        }, 2600);
      }

      function checkAch() {
        let changed = false;
        ACH.forEach((a) => {
          if (!stats.unlocked.includes(a.id) && a.ok(stats)) {
            stats.unlocked.push(a.id);
            toastQueue.push(a);
            changed = true;
          }
        });
        if (changed) { save(); updateTrophyCount(); showNextToast(); }
      }

      function stat(key, n = 1) {
        stats[key] = (stats[key] || 0) + n;
        save();
        checkAch();
      }
      function statMax(key, v) {
        if (v > (stats[key] || 0)) { stats[key] = v; save(); checkAch(); }
      }

      // Список досягнень
      const panel = document.getElementById('eggTrophies');
      const list = document.getElementById('eggTrophiesList');
      function renderList() {
        if (!list) return;
        list.innerHTML = '';
        ACH.forEach((a) => {
          const got = stats.unlocked.includes(a.id);
          const row = document.createElement('div');
          row.className = 'egg-trophy' + (got ? '' : ' is-locked');
          row.innerHTML = '<span class="egg-trophy-emoji"></span><div><div class="egg-trophy-title"></div><div class="egg-trophy-desc"></div></div>';
          row.querySelector('.egg-trophy-emoji').textContent = got ? a.emoji : (a.secret ? '❓' : '🔒');
          row.querySelector('.egg-trophy-title').textContent = got ? a.title : (a.secret ? 'Секретна пасхалка' : '???');
          row.querySelector('.egg-trophy-desc').textContent = got || !a.secret ? a.desc : 'Шукай сам 🤫';
          list.appendChild(row);
