<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Артем Гай</title>
  <!-- Іконка на вкладці браузера (Favicon) -->
  <link rel="icon" type="image/png" href="img/logo-circle.png">

  <!-- Застосовуємо збережену тему ще до відмальовки, щоб не було "блимання" -->
  <script>
    (function () {
      try {
        var saved = sessionStorage.getItem('user_manual_theme');
        if (saved === 'light' || saved === 'dark' || saved === 'aqua') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Підключення шрифту */
    @font-face {
      font-family: 'SN Pro';
      src: url('fonts/sn-pro.ttf') format('truetype');
      font-weight: 100 900;
      font-display: block;
    }

    :root {
      /* Плавні криві для всіх анімацій */
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) {
        --bg: #141517;
        --text: #f0f1f4;
        --subtext: #8d929f;
        --shadow-light: rgba(255, 255, 255, 0.05);
        --shadow-dark: rgba(0, 0, 0, 0.85);
        --card-border: rgba(255, 255, 255, 0.04);
        --icon-bg: #1a1c1f;
        --icon-fill: #e6e8ee;
        --tag-bg: #141517;
        --tag-text: #a4a9b8;
        --sub-card-bg: #191b1e;
        --sub-card-hover: #22252a;
        --copied-bg: #1e6b3b;
        --copied-text: #ffffff;
        --copied-badge-bg: rgba(255, 255, 255, 0.2);
      }
    }

    [data-theme="dark"] {
      --bg: #141517;
      --text: #f0f1f4;
      --subtext: #8d929f;
      --shadow-light: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.85);
      --card-border: rgba(255, 255, 255, 0.04);
      --icon-bg: #1a1c1f;
      --icon-fill: #e6e8ee;
      --tag-bg: #141517;
      --tag-text: #a4a9b8;
      --sub-card-bg: #191b1e;
      --sub-card-hover: #22252a;
      --copied-bg: #1e6b3b;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg: #f4f3ef;
      --text: #23252a;
      --subtext: #737782;
      --shadow-light: #ffffff;
      --shadow-dark: rgba(166, 171, 189, 0.55);
      --card-border: rgba(255, 255, 255, 0.7);
      --icon-bg: #eceae3;
      --icon-fill: #2f3239;
      --tag-bg: #f4f3ef;
      --tag-text: #505460;
      --sub-card-bg: #eceae3;
      --sub-card-hover: #ffffff;
      --copied-bg: #2b824c;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    /* Тема Aqua */
    [data-theme="aqua"] {
      --bg: transparent;
      --text: #ffffff;
      --subtext: rgba(255, 255, 255, 0.82);
      --shadow-light: rgba(255, 255, 255, 0.22);
      --shadow-dark: rgba(10, 32, 45, 0.55);
      --card-border: rgba(255, 255, 255, 0.35);
      --icon-bg: rgba(255, 255, 255, 0.16);
      --icon-fill: #ffffff;
      --tag-bg: rgba(255, 255, 255, 0.16);
      --tag-text: #ffffff;
      --sub-card-bg: rgba(255, 255, 255, 0.12);
      --sub-card-hover: rgba(255, 255, 255, 0.24);
      --copied-bg: #197278;
      --copied-text: #ffffff;
      --copied-badge-bg: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'SN Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 18px 60px;
      overflow-x: hidden;
      position: relative;
    }

    [data-theme="aqua"] body {
      background: linear-gradient(135deg, #16425b 0%, #216383 38%, #3f8f97 70%, #71bfbc 100%);
      background-size: 260% 260%;
      animation: aquaGradientFlow 14s ease infinite alternate;
    }

    [data-theme="aqua"] .link-card,
    [data-theme="aqua"] .theme-toggle {
      background-color: rgba(255, 255, 255, 0.12) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Прибираємо підкладку навколо логотипу в темі Aqua */
    [data-theme="aqua"] .avatar-wrapper {
      background: transparent !important;
      box-shadow: none !important;
      border-color: transparent !important;
    }

    [data-theme="aqua"] .avatar-inner {
      background: transparent !important;
    }

    @keyframes aquaGradientFlow {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 80%; }
      100% { background-position: 20% 100%; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, 
    .theme-toggle, 
    .avatar-wrapper, 
    .avatar-inner, 
    .profile-title, 
    .username-badge, 
    .profile-desc, 
    .link-card, 
    .link-icon-box, 
    .link-icon-masked,
    .link-title, 
    .link-subtitle, 
    .link-arrow, 
    .nested-btn,
    .nested-btn-badge,
    .nested-btn-right,
    .footer {
      transition: 
        color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        outline-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    @media (hover: hover) and (pointer: fine) {
      body, a, button, [role="button"], input {
        cursor: none !important;
      }
    }

    #rayCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 6px;
      z-index: 2;
    }

    /* Поява блоків */
    .theme-toggle,
    .avatar-wrapper,
    .profile-title,
    .username-badge,
    .profile-desc,
    .link-item-wrapper,
    .footer {
      opacity: 0;
    }

    .container.ready .theme-toggle {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.05s;
    }

    .container.ready .avatar-wrapper {
      animation: revealZoom 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    .container.ready .profile-title {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.28s;
    }

    .container.ready .username-badge {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.34s + var(--i, 0) * 0.06s);
    }

    .container.ready .profile-desc {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.52s;
    }

    .container.ready .link-item-wrapper {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.58s + var(--i, 0) * 0.07s);
    }

    .container.ready .footer {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.05s;
    }

    /* Після появи знімаємо анімацію, інакше вона "з'їдає" transform
       і ефект натискання (scale) на кнопках не працює */
    .container .is-revealed {
      opacity: 1 !important;
      animation: none !important;
    }

    /* Кнопка зміни теми */
    .theme-toggle {
      position: absolute;
      top: 6px;
      right: 4px;
      z-index: 10;
      background: var(--bg);
      border: 1px solid var(--card-border);
      outline: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 
        5px 5px 12px var(--shadow-dark),
        -5px -5px 12px var(--shadow-light);
      transform: scale(1);
    }

    .theme-toggle:active {
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light) !important;
      transform: scale(0.96);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Аватар */
    .avatar-wrapper {
      position: relative;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: var(--bg);
      padding: 7px;
      box-shadow: 
        8px 8px 20px var(--shadow-dark),
        -8px -8px 20px var(--shadow-light);
      margin-top: 8px;
      margin-bottom: 18px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: none !important;
      will-change: opacity;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-light { opacity: 1; z-index: 2; }
    .avatar-dark { opacity: 0; z-index: 1; }
    .avatar-aqua { opacity: 0; z-index: 1; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-light { opacity: 0; z-index: 1; }
      :root:not([data-theme="light"]):not([data-theme="aqua"]) .avatar-dark { opacity: 1; z-index: 2; }
    }

    [data-theme="dark"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="dark"] .avatar-dark { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="dark"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    [data-theme="aqua"] .avatar-light { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="aqua"] .avatar-aqua { opacity: 1 !important; z-index: 3 !important; }

    [data-theme="light"] .avatar-light { opacity: 1 !important; z-index: 2 !important; }
    [data-theme="light"] .avatar-dark { opacity: 0 !important; z-index: 1 !important; }
    [data-theme="light"] .avatar-aqua { opacity: 0 !important; z-index: 1 !important; }

    .avatar-placeholder-svg {
      width: 54px;
      height: 54px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 1.6;
    }

    /* Інфо профілю */
    .profile-info {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      padding: 0 10px;
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .usernames-group {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    .username-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tag-text);
      background: var(--tag-bg);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      box-shadow: 
        3px 3px 7px var(--shadow-dark),
        -3px -3px 7px var(--shadow-light);
    }

    .username-badge,
    .theme-toggle {
      transition: 
        transform 0.6s var(--ease-spring),
        box-shadow 0.6s var(--ease-smooth),
        color 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        border-color 0.4s var(--ease-soft);
    }

    .theme-toggle svg {
      transition: transform 0.7s var(--ease-spring);
    }

    @media (hover: hover) and (pointer: fine) {
      .username-badge:hover {
        transform: translateY(-2px);
        box-shadow: 
          5px 6px 12px var(--shadow-dark),
          -4px -4px 10px var(--shadow-light);
      }
      .theme-toggle:hover {
        transform: translateY(-2px);
      }
      .theme-toggle:hover svg {
        transform: rotate(-18deg) scale(1.08);
      }
    }

    .username-badge:active {
      transform: scale(0.96);
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light) !important;
    }

    .profile-desc {
      font-size: 0.94rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--subtext);
      max-width: 360px;
      margin: 0 auto;
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-item-wrapper {
      width: 100%;
    }

    /* ОСНОВНА КНОПКА */
    .link-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 18px;
      border-radius: 36px;
      background: var(--bg);
      text-decoration: none;
      color: inherit;
      position: relative;
      border: 1px solid var(--card-border);
      user-select: none;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);

      transition: 
        transform 0.7s var(--ease-smooth),
        box-shadow 0.7s var(--ease-smooth),
        border-color 0.6s var(--ease-soft),
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    /* Натискання — м'яке "втискання" картки */
    .link-card:not(.is-open):active,
    .link-card.is-open .link-main-row:active .link-icon-box {
      transition-duration: 0.18s;
    }

    .link-card:not(.is-open):active {
      transform: translateY(0) scale(0.985) !important;
      box-shadow: 
        1px 1px 3px var(--shadow-dark),
        -1px -1px 3px var(--shadow-light) !important;
    }

    .link-main-row {
      width: 100%;
      display: flex;
      align-items: center;
      outline: none;
    }

    .link-card:focus-visible,
    .link-main-row:focus-visible,
    .nested-btn:focus-visible,
    .username-badge:focus-visible,
    .theme-toggle:focus-visible,
    .insta-preview-card:focus-visible {
      outline: 2px solid var(--subtext);
      outline-offset: 3px;
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      position: relative;
      overflow: hidden;
      transform: translate3d(0, 0, 0) scale(1);
      
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light);

      transition: 
        transform 0.75s var(--ease-spring),
        box-shadow 0.7s var(--ease-smooth),
        background-color 0.6s var(--ease-soft);
      will-change: transform, box-shadow;
    }

    .link-icon-masked {
      width: 24px;
      height: 24px;
      background-color: var(--icon-fill);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      display: block;
      transform: translate3d(0, 0, 0);
      transition: 
        transform 0.8s var(--ease-spring),
        background-color 0.6s var(--ease-soft);
    }

    .link-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .link-subtitle {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--subtext);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 20px;
      height: 20px;
      margin-left: 10px;
      color: var(--subtext);
      opacity: 0.7;
      transition: transform 0.7s var(--ease-spring), opacity 0.5s var(--ease-soft), color 0.6s var(--ease-soft);
      flex-shrink: 0;
    }

    /* Випуклий стан на телефоні під час гортання */
    .link-card.is-elevated {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        9px 11px 24px var(--shadow-dark),
        -9px -11px 24px var(--shadow-light);
    }

    .link-card.is-elevated .link-icon-masked {
      transform: scale(1.08) rotate(-6deg);
    }

    .link-card.is-elevated .link-icon-box {
      transform: scale(1.06);
      box-shadow: 
        3px 3px 8px var(--shadow-dark),
        -3px -3px 8px var(--shadow-light);
    }

    .link-card.is-elevated .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .link-card.is-elevated .link-subtitle {
      color: var(--text);
    }

    /* Hover на ПК */
    @media (hover: hover) and (pointer: fine) {
      .link-card:not(.is-open):hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 
          8px 10px 22px var(--shadow-dark),
          -8px -10px 22px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-icon-masked {
        transform: scale(1.1) rotate(-7deg);
      }
      .link-card:hover .link-subtitle {
        color: var(--text);
      }
      .link-card:not(.is-open):hover .link-icon-box {
        transform: scale(1.06);
        box-shadow: 
          3px 3px 8px var(--shadow-dark),
          -3px -3px 8px var(--shadow-light);
      }
      .link-card:not(.is-open):hover .link-arrow {
        opacity: 1;
        transform: translateX(3px);
      }
    }

    /* Стан розкритої кнопки */
    .link-card.is-open {
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 
        7px 9px 20px var(--shadow-dark),
        -7px -9px 20px var(--shadow-light);
      transform: translateY(-1px);
    }

    .link-card.is-open .link-icon-box {
      transform: scale(1.04);
    }

    .link-card.is-open .link-arrow {
      transform: rotate(180deg) !important;
      opacity: 1;
    }

    /* ВНУТРІШНІЙ БЛОК */
    .inner-tray {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.6s var(--ease-smooth);
      width: 100%;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: grid-template-rows;
    }

    .link-card.is-open .inner-tray {
      grid-template-rows: 1fr;
    }

    .inner-tray-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 10px;
      transition: padding-top 0.6s var(--ease-smooth), padding-bottom 0.6s var(--ease-smooth);
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .link-card.is-open .inner-tray-content {
      padding: 14px 10px 14px;
    }

    /* МЕНШІ КНОПКИ */
    .nested-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 20px;
      background-color: var(--sub-card-bg);
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transform: translate3d(0, -10px, 0) scale(0.98);
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      box-shadow: 
        2px 2px 5px var(--shadow-dark),
        -2px -2px 5px var(--shadow-light);

      opacity: 0;
      transition: 
        transform 0.55s var(--ease-smooth),
        opacity 0.4s var(--ease-soft),
        background-color 0.4s var(--ease-soft),
        outline-color 0.4s var(--ease-soft),
        box-shadow 0.5s var(--ease-smooth) !important;
    }

    .link-card.is-open .nested-btn {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      transition-delay: calc(0.06s + var(--n, 0) * 0.06s), calc(0.06s + var(--n, 0) * 0.06s), 0s, 0s, 0s !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover {
        transform: translate3d(0, -2px, 0) !important;
        transition-delay: 0s !important;
        background-color: var(--sub-card-hover) !important;
        outline-color: rgba(255, 255, 255, 0.45);
        box-shadow: 
          3px 4px 10px var(--shadow-dark),
          -3px -4px 10px var(--shadow-light) !important;
      }
      .nested-btn:hover .nested-btn-right {
        color: var(--text);
      }
      .nested-btn:hover .nested-btn-badge {
        outline-color: rgba(255, 255, 255, 0.5);
      }
    }

    .nested-btn:active {
      transform: translate3d(0, 0, 0) scale(0.98) !important;
      outline-color: var(--card-border);
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light) !important;
      transition: transform 0.15s var(--ease-soft), box-shadow 0.15s var(--ease-soft) !important;
    }

    .nested-action-icon {
      transition: transform 0.5s var(--ease-spring), stroke 0.3s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .nested-btn:hover .nested-action-icon {
        transform: translate(2px, -2px);
      }
    }

    .nested-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nested-btn-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 10px;
      background-color: var(--tag-bg);
      color: var(--subtext);
      font-weight: 500;
      border: none !important;
      outline: 1px solid var(--card-border);
      outline-offset: -1px;
      transition: outline-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }

    /* Плашка "Нове відео" */
    .link-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .new-pill {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 10px;
      background-color: #e5322d;
      color: #ffffff;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35);
      transition: opacity 0.4s var(--ease-soft), transform 0.6s var(--ease-spring);
      animation: pillGlow 2.6s var(--ease-soft) infinite;
    }

    @keyframes pillGlow {
      0%, 100% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 0 rgba(229, 50, 45, 0.35); }
      50% { box-shadow: 0 2px 6px rgba(229, 50, 45, 0.35), 0 0 0 5px rgba(229, 50, 45, 0); }
    }

    .link-card .nested-btn .new-pill {
      transform: scale(0.6);
      opacity: 0;
    }

    .link-card.is-open .nested-btn .new-pill {
      transform: scale(1);
      opacity: 1;
      transition-delay: 0.25s;
    }

    /* Всередині — стікер у куті кнопки, щоб не ламати рядок */
    .nested-btn {
      position: relative;
    }

    .nested-btn .new-pill {
      position: absolute;
      top: -7px;
      right: 14px;
      font-size: 0.64rem;
      padding: 3px 7px;
    }

    /* На закритій картці плашка видна, при відкритті переїжджає всередину */
    .link-card.is-open .link-main-row .new-pill {
      opacity: 0;
      transform: scale(0.85);
    }

    .nested-btn-right {
      font-size: 0.78rem;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s ease;
    }

    .nested-action-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* Стан скопійовано */
    .nested-btn.copied {
      background-color: var(--copied-bg) !important;
      color: var(--copied-text) !important;
      outline-color: transparent !important;
      box-shadow: 2px 2px 6px var(--shadow-dark) !important;
    }

    .nested-btn.copied .nested-btn-badge {
      background-color: var(--copied-badge-bg) !important;
      color: #ffffff !important;
      outline-color: rgba(255, 255, 255, 0.3) !important;
    }

    .nested-btn.copied .nested-btn-right {
      color: #ffffff !important;
    }

    .nested-btn.copied .nested-action-icon {
      stroke: #ffffff !important;
    }

    /* Галерея Instagram: без обрізання тіней та підйому */
    .insta-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      padding: 4px 6px 8px; /* Запас для вільного розсіювання тіней */
      box-sizing: border-box;
    }

    .insta-preview-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--sub-card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 
        2px 2px 6px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);
      display: block;
      text-decoration: none;
      transform: translate3d(0, -6px, 0);
      opacity: 0;
      transition: 
        transform 0.6s var(--ease-smooth),
        box-shadow 0.6s var(--ease-smooth),
        border-color 0.5s var(--ease-soft),
        opacity 0.45s var(--ease-soft);
    }

    .link-card.is-open .insta-preview-card {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .link-card.is-open .insta-preview-card:nth-child(1) { transition-delay: 0.06s; }
    .link-card.is-open .insta-preview-card:nth-child(2) { transition-delay: 0.12s; }
    .link-card.is-open .insta-preview-card:nth-child(3) { transition-delay: 0.18s; }
    .link-card.is-open .insta-preview-card:hover { transition-delay: 0s; }

    .insta-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s var(--ease-smooth);
      color-interpolation-filters: sRGB;
    }

    @media (hover: hover) and (pointer: fine) {
      .insta-preview-card:hover {
        transform: translate3d(0, -2px, 0) !important;
        border-color: rgba(255, 255, 255, 0.5) !important;
        box-shadow: 
          3px 5px 12px var(--shadow-dark),
          -3px -5px 12px var(--shadow-light) !important;
      }
      .insta-preview-card:hover .insta-preview-img {
        transform: scale(1.08);
      }
    }

    .insta-profile-btn {
      width: 100%;
      margin-top: 2px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--subtext);
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ПАСХАЛКА: потягни пальцем угору в самому низу сторінки */
    .easter-spacer {
      width: 100%;
      min-height: 45vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      user-select: none;
    }

    /* Ледь помітна стрілочка-підказка без тексту */
    .easter-chevron {
      width: 22px;
      height: 22px;
      stroke: var(--subtext);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.4;
      animation: chevronNudge 2.4s var(--ease-soft) infinite;
    }

    @keyframes chevronNudge {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Кільце прогресу — фіксоване, тож сторінка під ним не смикається */
    .pull-ring {
      position: fixed;
      left: 50%;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      width: 68px;
      height: 68px;
      margin-left: -34px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 
        5px 5px 14px var(--shadow-dark),
        -5px -5px 14px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform: translateY(30px) scale(0.6);
      transition: opacity 0.35s var(--ease-soft), transform 0.5s var(--ease-spring);
    }

    .pull-ring.is-dragging {
      transition: none;
    }

    .pull-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .pull-ring-track {
      fill: none;
      stroke: var(--subtext);
      stroke-width: 2.2;
      stroke-dasharray: 3 5;
      stroke-linecap: round;
      opacity: 0.55;
    }

    .pull-ring-fill {
      fill: none;
      stroke: var(--text);
      stroke-width: 3.2;
      stroke-linecap: round;
    }

    .pull-ring-arrow {
      width: 22px;
      height: 22px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
    }

    .pull-ring.is-done {
      animation: ringPop 0.45s var(--ease-spring) forwards;
    }

    @keyframes ringPop {
      0%   { opacity: 1; transform: scale(1); }
      40%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(0.4); }
    }

    /* Шар з картинкою поверх сторінки */
    .easter-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease-soft), visibility 0s linear 0.35s;
    }

    .easter-overlay.is-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s var(--ease-soft), visibility 0s;
    }

    .easter-overlay {
      flex-direction: column;
      gap: 22px;
    }

    /* Бульбашка з фразою з тг-каналу */
    .easter-quote {
      position: relative;
      max-width: min(420px, 100%);
      min-height: 1px;
      padding: 12px 18px;
      border-radius: 22px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
      border: 1px solid var(--card-border);
      box-shadow: 
        6px 8px 20px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      opacity: 0;
      transform: translateY(14px) scale(0.6);
      transform-origin: 50% 100%;
      transition: opacity 0.25s var(--ease-soft), transform 0.3s var(--ease-smooth);
      pointer-events: none;
      z-index: 3;
    }

    /* Хвостик бульбашки */
    .easter-quote::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      background: var(--bg);
      border-right: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      transform: rotate(45deg);
      border-bottom-right-radius: 4px;
    }

    .easter-quote.is-shown {
      opacity: 1;
      animation: quotePop 0.55s var(--ease-spring) both;
    }

    @keyframes quotePop {
      0%   { opacity: 0; transform: translateY(14px) scale(0.5, 0.3); }
      45%  { opacity: 1; transform: translateY(-4px) scale(1.12, 0.9); }
      70%  { transform: translateY(0) scale(0.95, 1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 3D-РЕЖИМ ПАСХАЛКИ ===== */
    .egg3d-scene {
      perspective: 900px;
    }

    .egg3d-card {
      position: relative;
      transform-style: preserve-3d;
    }

    .egg3d-back,
    .egg3d-glare,
    .egg3d-edge {
      display: none;
    }

    .easter-overlay.is-3d .egg3d-card {
      cursor: grab;
      will-change: transform;
    }

    .easter-overlay.is-3d .easter-img {
      transform: translateZ(11px) !important;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: none;
    }

    /* Зворот — "інопланетна" версія фото */
    .easter-overlay.is-3d .egg3d-back {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 28px;
      transform: rotateY(180deg) translateZ(11px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      filter: hue-rotate(170deg) saturate(1.6) contrast(1.1);
      pointer-events: none;
    }

    /* Товщина картки — стопка кілець по краю (всередині порожньо, щоб не
       перекривати лице чи зворот під будь-яким кутом) */
    .easter-overlay.is-3d .egg3d-edge {
      display: block;
      position: absolute;
      inset: 0;
      border-radius: 28px;
      border: 4px solid #34363e;
      background: transparent;
      pointer-events: none;
    }

    /* Відблиск, що бігає по картці */
    .easter-overlay.is-3d .egg3d-glare {
      display: block;
      position: absolute;
      inset: 0;
      border-radius: 28px;
      transform: translateZ(11.5px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 55%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .egg3d-toggle {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 
        5px 5px 14px rgba(0, 0, 0, 0.35),
        -3px -3px 10px var(--shadow-light);
      transition: transform 0.5s var(--ease-spring), box-shadow 0.4s var(--ease-smooth), background-color 0.4s var(--ease-soft), color 0.4s var(--ease-soft);
    }

    .egg3d-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.8s var(--ease-spring);
    }

    .egg3d-toggle[aria-pressed="true"] {
      background: var(--text);
      color: var(--bg);
    }

    .egg3d-toggle[aria-pressed="true"] svg {
      transform: rotate(180deg);
    }

    .egg3d-toggle:active {
      transform: scale(0.94);
    }

    .easter-bounce {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      opacity: 0;
      transform-origin: 50% 100%;
    }

    /* Смішна поява: вилітає, розплющується, витягується і трясеться як желе */
    .easter-overlay.is-open .easter-bounce {
      opacity: 1;
      animation: easterBoing 1.4s cubic-bezier(0.3, 0.7, 0.4, 1) both;
    }

    @keyframes easterBoing {
      0%   { opacity: 0; transform: translateY(120px) scale(0.3, 1.6); }
      22%  { opacity: 1; transform: translateY(-30px) scale(0.75, 1.35); }
      36%  { transform: translateY(0) scale(1.45, 0.55); }
      50%  { transform: translateY(-12px) scale(0.8, 1.25); }
      63%  { transform: translateY(0) scale(1.18, 0.86); }
      75%  { transform: scale(0.93, 1.08) rotate(-2deg); }
      86%  { transform: scale(1.04, 0.97) rotate(1.5deg); }
      100% { opacity: 1; transform: scale(1, 1) rotate(0); }
    }

    .easter-img {
      touch-action: none;
      cursor: grab;
      will-change: transform;
      -webkit-user-drag: none;
      user-select: none;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 
        8px 10px 22px var(--shadow-dark),
        -8px -10px 22px var(--shadow-light);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }
    }

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes revealZoom {
      from {
        opacity: 0;
        transform: scale(0.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <canvas id="rayCanvas"></canvas>

  <div class="container" id="mainContainer">
    <!-- Кнопка зміни теми (Light -> Dark -> Aqua) -->
    <button class="theme-toggle" id="themeBtn" aria-label="Змінити тему">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>

    <!-- Аватар -->
    <div class="avatar-wrapper">
      <div class="avatar-inner">
        <img 
          src="img/logo.png" 
          alt="Logo Light" 
          class="avatar-img avatar-light"
          onerror="this.onerror=null; this.style.display='none'; document.getElementById('fallback-avatar').style.display='block';"
        >
        <img 
          src="img/logo-dark.png" 
          alt="Logo Dark" 
          class="avatar-img avatar-dark"
          onerror="this.onerror=null; this.src='img/logo.png';"
        >
        <img 
          src="img/logo-trn.png" 
          alt="Logo Aqua Transparent" 
          class="avatar-img avatar-aqua"
          onerror="this.onerror=null; this.src='img/logo-dark.png';"
        >
        <svg id="fallback-avatar" class="avatar-placeholder-svg" style="display: none;" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <!-- Блок профілю -->
    <div class="profile-info">
      <h1 class="profile-title" id="profileTitle"></h1>
      <div class="usernames-group" id="usernamesContainer"></div>
      <p class="profile-desc" id="profileDesc"></p>
    </div>

    <!-- Список кнопок -->
    <div class="links-list" id="linksContainer"></div>

    <div class="footer">
      <span id="footerText"></span>
    </div>

    <!-- Пасхалка: запас для гортання; в самому низу треба потягнути пальцем угору -->
    <div class="easter-spacer" aria-hidden="true">
      <svg class="easter-chevron" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"></polyline></svg>
    </div>
  </div>

  <!-- Кільце прогресу та шар з картинкою (поза потоком сторінки) -->
  <div class="pull-ring" id="pullRing" aria-hidden="true">
    <svg class="pull-ring-svg" viewBox="0 0 68 68">
      <circle class="pull-ring-track" cx="34" cy="34" r="29"></circle>
      <circle class="pull-ring-fill" id="pullRingFill" cx="34" cy="34" r="29"></circle>
    </svg>
    <svg class="pull-ring-arrow" id="pullRingArrow" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </div>

  <div class="easter-overlay" id="easterOverlay" role="dialog" aria-label="Пасхалка" aria-hidden="true">
    <div class="easter-quote" id="easterQuote" aria-live="polite"></div>
    <div class="easter-bounce">
      <div class="egg3d-scene">
        <div class="egg3d-card" id="egg3dCard">
          <img src="img/easter-egg.webp" alt="Пасхалка" class="easter-img" decoding="async" width="1349" height="600">
          <img src="img/easter-egg.webp" alt="" class="egg3d-back" aria-hidden="true" decoding="async">
          <div class="egg3d-glare" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <button type="button" class="egg3d-toggle" id="egg3dToggle" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 2.8 20 7.3v9.4L12 21.2 4 16.7V7.3Z"></path><path d="M4 7.3l8 4.5 8-4.5M12 11.8v9.4"></path></svg>
      <span id="egg3dLabel">3D</span>
    </button>
  </div>

  <script src="js/easter-phrases.js"></script>
  <script>

    // Копіювання картки
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      return legacyCopy(text);
    }

    function legacyCopy(text) {
      return new Promise((resolve, reject) => {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.top = '-1000px';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        document.body.removeChild(area);
        ok ? resolve() : reject(new Error('copy failed'));
      });
    }

    const THEME_KEY = 'user_manual_theme';
    const VALID_THEMES = ['light', 'dark', 'aqua'];

    function readManualTheme() {
      try {
        const value = sessionStorage.getItem(THEME_KEY);
        return VALID_THEMES.includes(value) ? value : null;
      } catch (e) {
        return null;
      }
    }

    function writeManualTheme(value) {
      try {
        if (value) sessionStorage.setItem(THEME_KEY, value);
        else sessionStorage.removeItem(THEME_KEY);
      } catch (e) {}
    }

    try { localStorage.removeItem('theme'); } catch (e) {}

    function getSystemTheme() {
      return mediaQuery.matches ? 'dark' : 'light';

    function syncTheme() {
      const manual = readManualTheme();
      const activeTheme = manual || getSystemTheme();

    // 4. Анімація за скролом (мобільні): картка стає випуклою лише під час гортання.
    //    Угорі сторінки активна перша картка, далі — по черзі до останньої.
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (isTouchDevice) {
      const cards = Array.from(document.querySelectorAll('.link-card'));
      let ticking = false;

      const docCenter = (el) => {
        const r = el.getBoundingClientRect();
        return r.top + (window.scrollY || window.pageYOffset) + r.height / 2;
      };

      function updateActiveCardOnScroll() {
        ticking = false;
        if (cards.length === 0) return;
        const scrollY = window.scrollY || window.pageYOffset;
        const first = docCenter(cards[0]);
        const last = docCenter(cards[cards.length - 1]);

        // Скільки треба прогорнути, щоб остання картка дійшла до центру екрана
        const range = Math.max(last - window.innerHeight / 2, 1);
        const progress = Math.min(Math.max(scrollY / range, 0), 1);
        const focus = first + (last - first) * progress;

        let activeIndex = -1;
        let bestDist = Infinity;
        cards.forEach((card, idx) => {
          const dist = Math.abs(docCenter(card) - focus);
          if (dist < bestDist) { bestDist = dist; activeIndex = idx; }
        });

        // Картки вже за верхнім краєм (гортаємо до пасхалки) — нічого не піднімаємо
        const lastRect = cards[cards.length - 1].getBoundingClientRect();
        if (lastRect.bottom < 0) activeIndex = -1;

        cards.forEach((card, idx) => {
          card.classList.toggle('is-elevated', idx === activeIndex && !card.classList.contains('is-open'));
        });
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(updateActiveCardOnScroll);
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', updateActiveCardOnScroll);
      setTimeout(updateActiveCardOnScroll, 350);
    }

    // 4.0 Хаптика (тактильний відгук)
    //  - Android (Chrome, Samsung, Opera): navigator.vibrate з візерунками;
    //  - iPhone (iOS 18+): Safari дає системний "тап" Taptic Engine, коли клікаєш
    //    по перемикачу <input type="checkbox" switch>. Працює лише у відповідь на
    //    дотик (pointerdown / pointerup / touchend), тому найкраще — у ці моменти.
    const Haptics = (() => {
      const canVibrate = typeof navigator.vibrate === 'function';
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let label = null;

      if (isIOS && !canVibrate) {
        label = document.createElement('label');
        label.setAttribute('aria-hidden', 'true');
        label.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');
        input.tabIndex = -1;
        label.appendChild(input);
        document.body.appendChild(label);
      }

      const iosTap = () => { if (label) { try { label.click(); } catch (e) {} } };
      const vibrate = (p) => { if (canVibrate) { try { navigator.vibrate(p); } catch (e) {} } };

      return {
        // Один короткий "тік"
        tick(ms = 8) {
          if (canVibrate) vibrate(ms); else iosTap();
        },
        // Лише для iPhone (на Android не перебиваємо вже запущену вібрацію)
        ios(p) {
          if (canVibrate || !label) return;
          this.pattern(p);
        },
        // Візерунок [вібро, пауза, вібро, ...] в мілісекундах
        pattern(p) {
          if (canVibrate) { vibrate(p); return; }
          if (!label) return;
          let t = 0;
          p.forEach((d, i) => {
            if (i % 2 === 0) setTimeout(iosTap, t);
            t += d;
          });
        }
      };
    })();

    // 4.1 Пасхалка: в самому низу тягнеш пальцем угору (або крутиш колесо далі) —
    //     пунктирне кільце плавно заповнюється, а коли повне — вилітає картинка.
    (() => {
      const ring = document.getElementById('pullRing');
      const fill = document.getElementById('pullRingFill');
      const arrow = document.getElementById('pullRingArrow');
      const overlay = document.getElementById('easterOverlay');
      if (!ring || !fill || !overlay) return;

      const PULL_DISTANCE = 160;          // скільки пікселів тягнути пальцем
      const CIRCUMFERENCE = 2 * Math.PI * 29;
      fill.style.strokeDasharray = CIRCUMFERENCE;
      fill.style.strokeDashoffset = CIRCUMFERENCE;

      let progress = 0;
      let pullStartY = null;
      let done = false;

      const atBottom = () =>
        window.innerHeight + (window.scrollY || window.pageYOffset) >= document.documentElement.scrollHeight - 4;

      function render(p, dragging) {
        progress = p;
        ring.classList.toggle('is-dragging', !!dragging);
        fill.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);
        ring.style.opacity = p > 0 ? Math.min(1, p * 4) : 0;
        ring.style.transform = p > 0
          ? `translateY(${(1 - p) * 20}px) scale(${0.75 + p * 0.25})`
          : '';
        if (arrow) arrow.style.transform = `translateY(${-p * 4}px)`;
      }

      function reset() {
        pullStartY = null;
        if (!done) render(0, false);
      }

      function openEgg() {
        done = true;
        pullStartY = null;
        ring.classList.remove('is-dragging');
        ring.style.opacity = '';
        ring.style.transform = '';
        ring.classList.add('is-done');
        openedThisTouch = true;
        Haptics.pattern([18, 45, 35]);
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function closeEgg() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        ring.classList.remove('is-done');
        done = false;
        render(0, false);
      }

      // Закриваємо тапом по фону (не по картинці — її можна тягати)
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeEgg();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeEgg();
      });

      // --- Палець ---
      document.addEventListener('touchstart', (e) => {
        if (done || e.touches.length !== 1) return;
        pullStartY = atBottom() ? e.touches[0].clientY : null;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (done || e.touches.length !== 1) return;
        const y = e.touches[0].clientY;
        if (pullStartY === null) {
          if (atBottom()) pullStartY = y; // догорнули до низу посеред жесту
          return;
        }
        const dy = pullStartY - y; // > 0, коли палець іде вгору
        if (dy <= 0) { render(0, true); return; }
        // Блокуємо прокрутку й "гумку" браузера, щоб нічого не смикалось
        if (e.cancelable) e.preventDefault();
        const p = Math.min(dy / PULL_DISTANCE, 1);
        render(p, true);
        if (p >= 1) openEgg();
      }, { passive: false });

      // На iPhone тактильний відгук можливий лише в touchend — "клацаємо" тут
      let openedThisTouch = false;
      document.addEventListener('touchend', () => {
        if (openedThisTouch) { openedThisTouch = false; Haptics.ios([1, 70, 1]); }
        reset();
      }, { passive: true });
      document.addEventListener('touchcancel', reset, { passive: true });

      // --- Колесо миші на ПК ---
      let wheelTimer = null;
      window.addEventListener('wheel', (e) => {
        if (done || e.deltaY <= 0 || !atBottom()) return;
        render(Math.min(progress + e.deltaY / 900, 1), true);
        if (progress >= 1) { openEgg(); return; }
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => render(0, false), 500);
      }, { passive: true });
    })();

    // 4.2 Желейна картинка: хапаєш пальцем — тягнеш — розтягується, відпускаєш — пружинить
    (() => {
      const img = document.querySelector('.easter-img');
      if (!img) return;

      const STIFFNESS = 260;   // пружність (чим більше — тим швидше повертається)
      const DAMPING = 9;       // гасіння (чим менше — тим довше трясеться)
      const MAX_PULL = 260;    // максимальний зсув, далі "впирається"

      let pos = { x: 0, y: 0 };   // поточна деформація
      let vel = { x: 0, y: 0 };
      let dragging = false;
      let grab = null;            // точка, де схопили (відносно центру, -1..1)
      let start = null;
      let rafId = null;
      let lastT = 0;
      let detent = 0;
      let lastDetent = 0;

      // Еластичний "упор": чим далі тягнеш, тим важче
      const soften = (v) => Math.sign(v) * MAX_PULL * (1 - Math.exp(-Math.abs(v) / MAX_PULL));

      function apply() {
        const { x, y } = pos;
        const len = Math.hypot(x, y);
        if (len < 0.05) {
          img.style.transform = '';
          return;
        }
        const angle = Math.atan2(y, x) * 180 / Math.PI;
        const stretch = 1 + len / 220;               // тягнемо вздовж руху пальця
        const squeeze = 1 / Math.sqrt(stretch);      // і стискаємо впоперек (як гума)
        img.style.transform =
          `translate(${x * 0.35}px, ${y * 0.35}px) rotate(${angle}deg) scale(${stretch}, ${squeeze}) rotate(${-angle}deg)`;
      }

      function step(t) {
        const dt = Math.min((t - lastT) / 1000, 0.032);
        lastT = t;
        // Пружина: a = -k*x - c*v
        vel.x += (-STIFFNESS * pos.x - DAMPING * vel.x) * dt;
        vel.y += (-STIFFNESS * pos.y - DAMPING * vel.y) * dt;
        pos.x += vel.x * dt;
        pos.y += vel.y * dt;
        apply();
        if (Math.hypot(pos.x, pos.y) < 0.1 && Math.hypot(vel.x, vel.y) < 0.5) {
          pos = { x: 0, y: 0 };
          vel = { x: 0, y: 0 };
          apply();
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(step);
      }

      const is3D = () => document.getElementById('easterOverlay').classList.contains('is-3d');

      img.addEventListener('pointerdown', (e) => {
        if (is3D()) return; // у 3D-режимі картку крутять, а не розтягують
        e.preventDefault();
        dragging = true;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        const r = img.getBoundingClientRect();
        grab = {
          x: ((e.clientX - r.left) / r.width) * 2 - 1,
          y: ((e.clientY - r.top) / r.height) * 2 - 1
        };
        // Тягнемо від протилежного боку — він ніби "прибитий", а схоплений тягнеться
        img.style.transformOrigin = `${50 - grab.x * 50}% ${50 - grab.y * 50}%`;
        start = { x: e.clientX - pos.x, y: e.clientY - pos.y };
        vel = { x: 0, y: 0 };
        img.style.cursor = 'grabbing';
        try { img.setPointerCapture(e.pointerId); } catch (err) {}
        if (window.easterQuote) window.easterQuote();
        detent = 0;
        Haptics.tick(10);
        if (window.easterSound) window.easterSound.grab();
      });

      img.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const nx = soften(e.clientX - start.x);
        const ny = soften(e.clientY - start.y);
        // Швидкість потрібна, щоб відпущена картинка "відстрілювала" природно
        vel = { x: (nx - pos.x) * 60, y: (ny - pos.y) * 60 };
        pos = { x: nx, y: ny };
        apply();
        // "Клацання" при розтягуванні — як у гуми, що натягується (на Android)
        const level = Math.floor(Math.hypot(nx, ny) / 40);
        const now = performance.now();
        if (level > detent && now - lastDetent > 45) {
          Haptics.tick(4 + level * 2);
          lastDetent = now;
        }
        detent = level;
      });

      const release = (e) => {
        if (!dragging) return;
        dragging = false;
        img.style.cursor = '';
        const pull = Math.hypot(pos.x, pos.y);
        if (pull > 30) {
          // Вібрація "пружинить" разом з картинкою: сильний удар і затухаючі відскоки
          const k = Math.min(pull / 220, 1.2);
          Haptics.pattern([
            Math.round(22 + 30 * k), 55,
            Math.round(14 + 18 * k), 70,
            Math.round(8 + 10 * k), 85,
            Math.round(5 + 4 * k)
          ]);
          if (window.easterSound) window.easterSound.splash(k);
        }
        lastT = performance.now();
        rafId = requestAnimationFrame(step);
      };
      img.addEventListener('pointerup', release);
      img.addEventListener('pointercancel', release);
      img.addEventListener('lostpointercapture', release);
    })();

    // 4.3 Фрази з тг-каналу: при дотику до картинки, не частіше ніж раз на 3 секунди
    (() => {
      const bubble = document.getElementById('easterQuote');
      const all = Array.isArray(window.EASTER_PHRASES) ? window.EASTER_PHRASES.slice() : [];
      if (!bubble || all.length === 0) return;

      const PERIOD_MS = 3000;
      let deck = [];
      let lastShown = -Infinity;
      let hideTimer = null;

      // Перемішана колода — фрази не повторюються, поки не покажуться всі
      const nextPhrase = () => {
        if (deck.length === 0) {
          deck = all.slice();
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
        }
        return deck.pop();
      };

      window.easterQuote = () => {
        const now = performance.now();
        if (now - lastShown < PERIOD_MS) return;
        lastShown = now;
        bubble.textContent = nextPhrase();
        bubble.classList.remove('is-shown');
        void bubble.offsetWidth; // перезапуск анімації
        bubble.classList.add('is-shown');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bubble.classList.remove('is-shown'), PERIOD_MS - 200);
      };

      // При закритті пасхалки ховаємо бульбашку
      const overlay = document.getElementById('easterOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) { bubble.classList.remove('is-shown'); lastShown = -Infinity; }
        });
      }
    })();

    // 4.5 3D-режим: об'ємна картка, яку можна крутити пальцем і нахиляти телефоном
    (() => {
      const overlay = document.getElementById('easterOverlay');
      const card = document.getElementById('egg3dCard');
      const btn = document.getElementById('egg3dToggle');
      const label = document.getElementById('egg3dLabel');
      const img = card && card.querySelector('.easter-img');
      const glare = card && card.querySelector('.egg3d-glare');
      if (!overlay || !card || !btn || !img) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const THICK = 22;                 // товщина картки, px
      const LAYERS = 20;

      // Товщина: шари між лицем і зворотом
      for (let i = 0; i < LAYERS; i++) {
        const z = -THICK / 2 + (THICK * (i + 0.5)) / LAYERS;
        const edge = document.createElement('div');
        edge.className = 'egg3d-edge';
        // Трохи світліші краї посередині — об'ємніше виглядає
        const shade = 46 + Math.round(Math.sin((i / (LAYERS - 1)) * Math.PI) * 18);
        edge.style.borderColor = `rgb(${shade}, ${shade + 2}, ${shade + 10})`;
        edge.style.transform = `translateZ(${z.toFixed(2)}px)`;
        card.insertBefore(edge, img);
      }

      let on = false;
      let rx = 0, ry = 0;               // поворот, градуси
      let vx = 0, vy = 0;               // швидкість, градуси/с
      let tiltX = 0, tiltY = 0;         // нахил від гіроскопа
      let gx = 0, gy = 0;               // згладжений нахил
      let dragging = false;
      let last = null;
      let rafId = null;
      let prevT = 0;
      let lastFace = 0;
      let baseBeta = null;

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      const onOrient = (e) => {
        if (e.beta == null || e.gamma == null) return;
        if (baseBeta === null) baseBeta = e.beta;
        tiltX = clamp((e.beta - baseBeta) * 0.7, -25, 25);
        tiltY = clamp(e.gamma * 0.7, -25, 25);
      };

      function frame(t) {
        const dt = Math.min((t - prevT) / 1000, 0.033);
        prevT = t;

        if (!dragging) {
          // Обертання по Y крутиться з інерцією і тертям, потім м'яко "сідає" на лице або зворот
          vy *= Math.pow(0.12, dt);
          if (Math.abs(vy) < 40) {
            const target = Math.round(ry / 180) * 180;
            vy += ((target - ry) * 28 - vy * 6) * dt;
          }
          ry += vy * dt;
          // Нахил по X пружинить назад
          vx += (-rx * 60 - vx * 9) * dt;
          rx += vx * dt;
        }

        gx += (tiltX - gx) * Math.min(1, dt * 8);
        gy += (tiltY - gy) * Math.min(1, dt * 8);

        const X = rx + gx;
        const Y = ry + gy;
        const float = Math.sin(t / 900) * 4;
        card.style.transform = `translateY(${float.toFixed(2)}px) rotateX(${(-X).toFixed(2)}deg) rotateY(${Y.toFixed(2)}deg)`;

        if (glare) {
          const yr = (Y * Math.PI) / 180, xr = (X * Math.PI) / 180;
          glare.style.setProperty('--gx', `${50 - Math.sin(yr) * 60}%`);
          glare.style.setProperty('--gy', `${35 + Math.sin(xr) * 60}%`);
        }

        // Перевернули на інший бік — тік і звук
        const face = Math.round(ry / 180);
        if (face !== lastFace) {
          lastFace = face;
          Haptics.tick(14);
          if (window.easterSound && window.easterSound.flip) window.easterSound.flip();
        }

        rafId = on || Math.abs(ry % 360) > 0.5 ? requestAnimationFrame(frame) : null;
      }

      const start = () => {
        if (!rafId) { prevT = performance.now(); rafId = requestAnimationFrame(frame); }
      };

      async function enable() {
        on = true;
        overlay.classList.add('is-3d');
        btn.setAttribute('aria-pressed', 'true');
        label.textContent = '2D';
        img.style.transform = '';
        rx = 0; ry = 0; vx = 0; lastFace = 0;
        vy = reduceMotion ? 0 : 720;       // ефектне "розкручування" на вході
        baseBeta = null;
        // iPhone просить дозвіл на гіроскоп — лише у відповідь на натискання кнопки
        try {
          if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res !== 'granted') throw new Error('denied');
          }
          window.addEventListener('deviceorientation', onOrient);
        } catch (e) {}
        Haptics.pattern([10, 40, 10, 40, 20]);
        start();
      }

      function disable() {
        on = false;
        window.removeEventListener('deviceorientation', onOrient);
        tiltX = tiltY = 0;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        // Плавно повертаємо картку лицем до глядача
        const target = Math.round(ry / 360) * 360;
        card.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1)';
        card.style.transform = `rotateX(0deg) rotateY(${target}deg)`;
        btn.setAttribute('aria-pressed', 'false');
        label.textContent = '3D';
        Haptics.tick(12);
        setTimeout(() => {
          if (on) return;
          overlay.classList.remove('is-3d');
          card.style.transition = '';
          card.style.transform = '';
          rx = ry = vx = vy = 0;
        }, 720);
      }

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (on) disable(); else enable();
      });

      // Закрили пасхалку — виходимо з 3D
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay && on) {
          on = false;
          window.removeEventListener('deviceorientation', onOrient);
          overlay.classList.remove('is-3d');
          btn.setAttribute('aria-pressed', 'false');
          label.textContent = '3D';
          card.style.transform = '';
          card.style.transition = '';
        }
      });

      // Кручення пальцем
      card.addEventListener('pointerdown', (e) => {
        if (!on) return;
        e.preventDefault();
        dragging = true;
        card.style.cursor = 'grabbing';
        last = { x: e.clientX, y: e.clientY, t: performance.now() };
        vx = vy = 0;
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        if (window.easterQuote) window.easterQuote();
        Haptics.tick(8);
        if (window.easterSound) window.easterSound.grab();
        start();
      });

      card.addEventListener('pointermove', (e) => {
        if (!on || !dragging || !last) return;
        const now = performance.now();
        const dt = Math.max((now - last.t) / 1000, 0.001);
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        ry += dx * 0.5;
        rx = clamp(rx + dy * 0.5, -70, 70);
        // Згладжена швидкість для інерції після відпускання
        vy = vy * 0.6 + ((dx * 0.5) / dt) * 0.4;
        vx = vx * 0.6 + ((dy * 0.5) / dt) * 0.4;
        last = { x: e.clientX, y: e.clientY, t: now };
      });

      const end = () => {
        if (!dragging) return;
        dragging = false;
        card.style.cursor = '';
        // Відпустили без руху — гасимо швидкість
        if (last && performance.now() - last.t > 80) { vx = 0; vy = 0; }
        vy = clamp(vy, -2000, 2000);
        vx = clamp(vx, -600, 600);
        if (Math.abs(vy) > 500) Haptics.pattern([12, 30, 8]);
      };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
      card.addEventListener('lostpointercapture', end);
    })();

    // 4.4 Звуки пасхалки: водяні "хлюпи" з варіаціями (синтез у браузері, без файлів)
    window.easterSound = (() => {
      const rand = (a, b) => a + Math.random() * (b - a);
      let ac = null;
      let lastVariant = -1;

      const getAC = () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!ac) ac = new AC();
        if (ac.state === 'suspended') ac.resume();
        return ac;
      };

      const out = (vol) => {
        const g = ac.createGain();
        g.gain.value = vol;
        g.connect(ac.destination);
        return g;
      };

      // Бульбашка: тон швидко росте вгору — так звучить крапля у воді
      const bloop = (dest, time, f0, f1, dur, vol, type = 'sine') => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, time);
        o.frequency.exponentialRampToValueAtTime(f1, time + dur * 0.7);
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        o.connect(g).connect(dest);
        o.start(time);
        o.stop(time + dur + 0.02);
      };

      // Шум води, який "закривається" фільтром
      const wash = (dest, time, dur, vol, fStart, fEnd, q = 3) => {
        const len = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.Q.value = q;
        lp.frequency.setValueAtTime(fStart, time);
        lp.frequency.exponentialRampToValueAtTime(fEnd, time + dur * 0.85);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol, time + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(lp).connect(g).connect(dest);
        src.start(time);
        src.stop(time + dur);
      };

      const drops = (dest, t0, n, spread) => {
        for (let i = 0; i < n; i++) {
          const f = rand(700, 1900);
          bloop(dest, t0 + rand(0.05, spread), f, f * rand(1.4, 2.1), rand(0.04, 0.08), rand(0.08, 0.2));
        }
      };

      // Варіації хлюпу
      const variants = [
        // 0. Класичний "бульк" з краплями
        (d, t, k, p) => {
          bloop(d, t, 160 * p, (620 + k * 200) * p, 0.16, 0.5);
          wash(d, t, 0.45, 0.18 + k * 0.12, 2600, 350);
          drops(d, t, 4 + Math.round(k * 5), 0.6);
        },
        // 1. Великий плюх — наче щось упало у ванну
        (d, t, k, p) => {
          bloop(d, t, 90 * p, 260 * p, 0.22, 0.55);
          wash(d, t, 0.7, 0.3 + k * 0.15, 3800, 260, 1.5);
          bloop(d, t + 0.05, 240 * p, 900 * p, 0.12, 0.3);
          drops(d, t + 0.1, 7 + Math.round(k * 6), 0.9);
        },
        // 2. Кап-кап-кап — серія крапель
        (d, t, k, p) => {
          const n = 3 + Math.round(k * 2);
          for (let i = 0; i < n; i++) {
            const f = rand(350, 600) * p;
            bloop(d, t + i * rand(0.09, 0.14), f, f * 2.4, 0.11, 0.42 - i * 0.05);
          }
          wash(d, t, 0.25, 0.08, 2000, 500);
        },
        // 3. Желейний "боїнг" — пружинить разом з картинкою
        (d, t, k, p) => {
          const o = ac.createOscillator();
          const lfo = ac.createOscillator();
          const lfoGain = ac.createGain();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(210 * p, t);
          o.frequency.exponentialRampToValueAtTime(140 * p, t + 0.6);
          lfo.frequency.setValueAtTime(14, t);
          lfo.frequency.linearRampToValueAtTime(6, t + 0.6);
          lfoGain.gain.setValueAtTime(70 * (0.6 + k * 0.4), t);
          lfoGain.gain.exponentialRampToValueAtTime(1, t + 0.6);
          lfo.connect(lfoGain).connect(o.frequency);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
          o.connect(g).connect(d);
          o.start(t); lfo.start(t);
          o.stop(t + 0.7); lfo.stop(t + 0.7);
          wash(d, t, 0.3, 0.12, 1800, 400);
        },
        // 4. Ковток "глюк" — тон падає вниз
        (d, t, k, p) => {
          bloop(d, t, 420 * p, 85 * p, 0.2, 0.5);
          bloop(d, t + 0.13, 300 * p, 70 * p, 0.16, 0.35);
          wash(d, t, 0.35, 0.12 + k * 0.08, 1400, 200, 5);
        },
        // 5. Чвяк — в'язкий хлюп
        (d, t, k, p) => {
          wash(d, t, 0.22, 0.35, 900, 3500, 8);
          wash(d, t + 0.08, 0.3, 0.2, 2500, 300, 6);
          bloop(d, t + 0.02, 120 * p, 380 * p, 0.14, 0.4, 'triangle');
          drops(d, t + 0.15, 2 + Math.round(k * 3), 0.4);
        }
      ];

      return {
        // Переворот картки в 3D — легкий "свуш" і клац
        flip() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.45);
            wash(d, t, 0.14, 0.1, 600, 3000, 2);
            bloop(d, t + 0.05, 900, 1400, 0.04, 0.12, 'triangle');
          } catch (e) {}
        },
        // Тихий "чвяк" коли хапаєш картинку
        grab() {
          try {
            if (!getAC()) return;
            const t = ac.currentTime + 0.005;
            const d = out(0.5);
            wash(d, t, 0.09, 0.12, 700, 2200, 6);
            bloop(d, t, 110, 190, 0.07, 0.18, 'triangle');
          } catch (e) {}
        },
        // Хлюп при відпусканні: випадкова варіація (не та ж сама двічі поспіль)
        splash(k) {
          try {
            if (!getAC()) return;
            let v;
            do { v = Math.floor(Math.random() * variants.length); } while (v === lastVariant && variants.length > 1);
            lastVariant = v;
            const t = ac.currentTime + 0.01;
            const d = out(Math.min(0.9, 0.45 + k * 0.35));
            variants[v](d, t, k, rand(0.85, 1.2)); // p — випадкова висота тону
          } catch (e) {}
        }
      };
    })();

    // 5. Курсор
    const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (isDesktopPointer) {
      const canvas = document.getElementById('rayCanvas');
      const ctx = canvas.getContext('2d');

      let cssWidth = window.innerWidth;
      let cssHeight = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;

      function resizeCanvas() {
        dpr = window.devicePixelRatio || 1;
        cssWidth = window.innerWidth;
        cssHeight = window.innerHeight;

        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let mouse = { x: -200, y: -200, active: false, clicking: false, hovering: false };
      let cursorDot = { x: -200, y: -200 };
      let cursorRing = { x: -200, y: -200, size: 24 };

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;

        const target = e.target.closest('a, button, [role="button"], .username-badge, .nested-btn, .link-main-row, .insta-preview-card');
        mouse.hovering = !!target;
      });

      window.addEventListener('mousedown', () => { mouse.clicking = true; });
      window.addEventListener('mouseup', () => { mouse.clicking = false; });
      document.addEventListener('mouseout', (e) => {
        if (!e.relatedTarget) mouse.active = false; // курсор пішов за межі вікна
      });
      window.addEventListener('blur', () => { mouse.active = false; mouse.clicking = false; });

      function renderFrame() {
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        if (mouse.active) {
          cursorDot.x += (mouse.x - cursorDot.x) * 0.8;
          cursorDot.y += (mouse.y - cursorDot.y) * 0.8;

          cursorRing.x += (mouse.x - cursorRing.x) * 0.28;
          cursorRing.y += (mouse.y - cursorRing.y) * 0.28;

          let targetSize = mouse.clicking ? 18 : (mouse.hovering ? 38 : 24);
          cursorRing.size += (targetSize - cursorRing.size) * 0.25;

          const currentTheme = htmlEl.getAttribute('data-theme') || getSystemTheme();

          let ringColor = 'rgba(35, 37, 42, 0.35)';
          let dotColor = '#23252a';

          if (currentTheme === 'dark') {
            ringColor = mouse.hovering ? 'rgba(255, 255, 255, 0.85)' : 'rgba(240, 241, 244, 0.38)';
            dotColor = '#ffffff';
          } else if (currentTheme === 'aqua') {
            ringColor = mouse.hovering ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
            dotColor = '#ffffff';
          } else {
            ringColor = mouse.hovering ? 'rgba(0, 0, 0, 0.75)' : 'rgba(35, 37, 42, 0.35)';
            dotColor = '#23252a';
          }

          ctx.beginPath();
          ctx.arc(cursorRing.x, cursorRing.y, cursorRing.size / 2, 0, Math.PI * 2);
          ctx.strokeStyle = ringColor;
          ctx.lineWidth = mouse.hovering ? 1.5 : 1.1;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cursorDot.x, cursorDot.y, mouse.hovering ? 3.5 : 3, 0, Math.PI * 2);
          ctx.fillStyle = dotColor;
          ctx.fill();
        }

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }
  </script>
</body>
</html>
